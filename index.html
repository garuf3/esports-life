<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>英雄聯盟職業人生模擬器</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#07120d;--panel:#0d1d14;--panel2:#11261a;
  --line:#244331;--text:#edf5ef;--sub:#9aa99f;
  --green:#78e6a0;--green2:#b9f7c9;--gold:#e9ca6b;
  --red:#ff8585;--blue:#8fcaff;
}
html,body{
  margin:0;width:100%;height:100%;
  overflow:hidden;
  background:radial-gradient(circle at 50% -20%,#1b432b,#07120d 65%);
  color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
button,input{font:inherit}
button{border:0}
input{
  outline:0;color:var(--text);background:#08140d;
  border:1px solid var(--line);border-radius:10px;padding:0 12px;
}
input:focus{border-color:var(--green)}

.hidden{display:none!important}

/* 建立角色 */
#setup{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  padding:14px;
}
.setup-box{
  width:min(440px,100%);
  max-height:calc(100vh - 28px);
  overflow:auto;
  padding:18px;
  background:rgba(13,29,20,.96);
  border:1px solid var(--line);
  border-radius:20px;
}
.setup-title{
  text-align:center;font-size:23px;font-weight:950;
  margin-bottom:3px;
}
.setup-sub{
  text-align:center;color:var(--sub);font-size:11px;
  margin-bottom:17px;
}
label{
  display:block;color:var(--sub);font-size:11px;
  font-weight:800;margin:10px 0 5px;
}
.input{width:100%;height:42px}
.choice-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
}
.role-grid{grid-template-columns:repeat(5,1fr)}
.select-btn{
  min-height:40px;padding:4px 2px;border-radius:9px;
  background:#09160f;color:var(--sub);
  border:1px solid var(--line);font-size:11px;font-weight:900;
}
.select-btn.active{
  color:var(--green2);
  background:rgba(120,230,160,.12);
  border-color:#4d9463;
}
.start{
  width:100%;height:45px;margin-top:15px;
  border-radius:10px;background:var(--green);
  color:#07120d;font-weight:950;
}

/* 遊戲 */
#game{
  width:100%;height:100%;
  max-width:1100px;margin:auto;
  display:flex;flex-direction:column;
}
.header{
  flex:0 0 47px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;
  border-bottom:1px solid rgba(120,230,160,.08);
}
.header-title{font-size:14px;font-weight:950}
.header-season{font-size:11px;color:var(--green);font-weight:900}

.main{
  flex:1;min-height:0;
  padding:8px;
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:8px;
}
.left,.right{min-width:0;min-height:0}

.card{
  background:linear-gradient(145deg,#102319,#0b1911);
  border:1px solid var(--line);
  border-radius:13px;
  padding:10px;
}
.card+.card{margin-top:8px}

.identity{
  display:flex;align-items:center;gap:9px;
}
.avatar{
  width:42px;height:42px;border-radius:11px;
  display:grid;place-items:center;
  background:#173522;border:1px solid #315c40;font-size:19px;
}
.name{font-size:16px;font-weight:950}
.id{font-size:9px;color:var(--sub)}
.tags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.tag{
  padding:3px 6px;border-radius:99px;
  background:#09160f;border:1px solid var(--line);
  color:var(--sub);font-size:8px;font-weight:900;
}
.tag.green{color:var(--green)}

.resource{
  display:grid;grid-template-columns:repeat(3,1fr);gap:5px;
}
.resource-item{
  padding:7px 5px;border-radius:9px;background:#09160f;
  border:1px solid #1b3526;text-align:center;
}
.resource-label{font-size:8px;color:var(--sub)}
.resource-value{font-size:16px;font-weight:950;margin-top:1px}
.resource-value.green{color:var(--green2)}
.resource-value.gold{color:var(--gold)}

.section-title{
  font-size:11px;font-weight:950;margin-bottom:6px;
}
.section-note{
  color:var(--sub);font-size:8px;font-weight:700;
  float:right;
}

.stats{
  display:grid;grid-template-columns:repeat(2,1fr);gap:5px;
}
.stat{
  padding:7px;border-radius:9px;background:#09160f;
  border:1px solid #1b3526;
}
.stat-head{
  display:flex;justify-content:space-between;align-items:center;
}
.stat-name{font-size:9px;font-weight:850}
.stat-value{font-size:14px;font-weight:950;color:var(--green2)}
.stat-info{font-size:7px;color:var(--sub);margin-top:1px}
.bar{
  height:4px;background:#06100a;border-radius:99px;
  margin-top:5px;overflow:hidden;
}
.bar i{
  display:block;height:100%;background:var(--green);
  border-radius:99px;
}

.overall{
  display:flex;align-items:center;gap:10px;
}
.overall-number{
  font-size:32px;line-height:1;font-weight:950;color:var(--green2);
}
.overall-label{font-size:9px;color:var(--sub)}
.rank-text{font-size:11px;font-weight:900}
.rank-bar{
  height:6px;background:#06100a;border-radius:99px;
  margin-top:5px;overflow:hidden;
}
.rank-bar i{
  display:block;height:100%;
  background:linear-gradient(90deg,#5abf7b,#c3ffd0);
}

.timeline{
  display:grid;grid-template-columns:repeat(4,1fr);gap:3px;
}
.quarter{
  padding:6px 2px;text-align:center;border-radius:7px;
  background:#09160f;color:#65766b;font-size:8px;font-weight:900;
}
.quarter.active{
  background:rgba(120,230,160,.13);
  color:var(--green2);
}

.actions{
  display:grid;grid-template-columns:repeat(2,1fr);gap:5px;
}
.action{
  min-height:67px;padding:7px;text-align:left;
  background:#0b1b12;color:var(--text);
  border:1px solid var(--line);border-radius:10px;
}
.action:active{transform:scale(.98)}
.action-icon{font-size:15px}
.action-name{font-size:10px;font-weight:950;margin-top:3px}
.action-desc{
  color:var(--sub);font-size:7.5px;line-height:1.35;
  margin-top:2px;
}
.action-reward{
  color:var(--green);font-size:7.5px;font-weight:900;margin-top:3px;
}

.story{
  font-size:9px;line-height:1.5;color:#cbd6ce;
  max-height:76px;overflow:hidden;
}
.history{
  max-height:76px;overflow:hidden;
}
.history-row{
  padding:4px 0;border-bottom:1px solid #193023;
  font-size:8px;line-height:1.35;color:var(--sub);
}
.history-row:last-child{border:0}
.history-time{color:var(--green);font-weight:900}

.bottom{
  flex:0 0 43px;
  display:grid;grid-template-columns:repeat(3,1fr);
  padding:4px 8px 7px;gap:5px;
}
.nav{
  border-radius:9px;background:#0b1b12;
  border:1px solid var(--line);color:var(--sub);
  font-size:9px;font-weight:900;
}
.nav.active{color:var(--green2);background:rgba(120,230,160,.1)}

.page{
  position:absolute;inset:47px 0 43px;
  display:none;padding:10px;overflow:hidden;
}
.page.show{display:block}
.page-card{
  max-width:900px;margin:auto;height:100%;
  background:#0d1d14;border:1px solid var(--line);
  border-radius:14px;padding:11px;
  overflow:auto;
}
.page-title{font-size:18px;font-weight:950}
.page-sub{font-size:9px;color:var(--sub);margin-top:3px}

.clubs{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:6px;margin-top:9px;
}
.club{
  padding:8px;border-radius:9px;background:#09160f;
  border:1px solid var(--line);
}
.club-name{font-size:10px;font-weight:950}
.club-league{font-size:7px;color:var(--gold);margin-top:2px}
.club-need{font-size:8px;color:var(--sub);line-height:1.4;margin-top:5px}
.club-status{
  margin-top:5px;font-size:7px;font-weight:900;color:var(--green);
}

/* Modal */
.modal{
  position:fixed;inset:0;z-index:50;
  display:none;align-items:center;justify-content:center;
  padding:12px;background:rgba(0,0,0,.68);
}
.modal.show{display:flex}
.modal-box{
  width:min(500px,100%);
  max-height:90vh;overflow:auto;
  background:#102319;border:1px solid #31543d;
  border-radius:16px;padding:13px;
}
.modal-type{font-size:8px;color:var(--green);font-weight:950}
.modal-title{font-size:19px;font-weight:950;margin-top:3px}
.modal-story{
  margin-top:8px;padding:9px;border-left:2px solid var(--green);
  background:#09160f;color:#cbd6ce;font-size:10px;
  line-height:1.65;border-radius:0 8px 8px 0;
}
.modal-actions{display:grid;gap:6px;margin-top:9px}
.event-choice{
  padding:9px;text-align:left;border-radius:9px;
  background:#09160f;border:1px solid var(--line);
  color:var(--text);
}
.event-choice-title{font-size:10px;font-weight:950}
.event-choice-desc{font-size:8px;color:var(--sub);margin-top:2px}
.event-choice-reward{font-size:7px;color:var(--green);font-weight:900;margin-top:3px}
.result-rewards{display:flex;gap:4px;flex-wrap:wrap;margin-top:9px}
.pill{
  padding:4px 7px;border-radius:99px;background:#09160f;
  border:1px solid #31543d;color:var(--green);font-size:8px;font-weight:900;
}
.modal-btn{
  width:100%;height:40px;border-radius:9px;
  background:var(--green);color:#07120d;font-size:10px;font-weight:950;
  margin-top:9px;
}

/* PC */
@media(min-width:800px){
  .main{padding:14px;gap:12px}
  .header{padding:0 18px}
  .bottom{padding:5px 14px 10px}
}

/* 很矮的手機 */
@media(max-height:650px){
  .header{flex-basis:40px}
  .main{padding:5px}
  .card{padding:7px}
  .card+.card{margin-top:5px}
  .action{min-height:59px}
  .story,.history{max-height:58px}
  .bottom{flex-basis:39px}
  .page{inset:40px 0 39px}
}
</style>
</head>

<body>

<!-- =========================
     建立玩家
========================= -->
<div id="setup">

  <div class="setup-box">

    <div class="setup-title">英雄聯盟職業人生模擬器</div>
    <div class="setup-sub">從路人玩家一路走向職業舞台</div>

    <label>選手姓名</label>
    <input id="playerNameInput" class="input" maxlength="16" placeholder="例如：王小明">

    <label>玩家 ID</label>
    <input id="playerIdInput" class="input" maxlength="16" placeholder="例如：MyWay">

    <label>出生聯賽／賽區</label>
    <div class="choice-grid" id="leagueChoices">
      <button class="select-btn" data-value="LCP">LCP</button>
      <button class="select-btn" data-value="PCS">PCS</button>
      <button class="select-btn" data-value="LCK">LCK</button>
      <button class="select-btn" data-value="LPL">LPL</button>
      <button class="select-btn" data-value="LEC">LEC</button>
      <button class="select-btn" data-value="LTA">LTA</button>
    </div>

    <label>主要位置</label>
    <div class="choice-grid role-grid" id="roleChoices">
      <button class="select-btn" data-value="TOP">TOP</button>
      <button class="select-btn" data-value="JUG">JUG</button>
      <button class="select-btn" data-value="MID">MID</button>
      <button class="select-btn" data-value="BOT">BOT</button>
      <button class="select-btn" data-value="SUP">SUP</button>
    </div>

    <button class="start" id="startBtn">開始職業人生</button>

  </div>
</div>


<!-- =========================
     遊戲主畫面
========================= -->
<div id="game" class="hidden">

  <header class="header">
    <div class="header-title">英雄聯盟職業人生</div>
    <div class="header-season" id="season"></div>
  </header>

  <div class="main">

    <div class="left">

      <div class="card">
        <div class="identity">
          <div class="avatar">🎮</div>
          <div>
            <div class="name" id="name"></div>
            <div class="id" id="playerId"></div>
            <div class="tags">
              <span class="tag green" id="league"></span>
              <span class="tag" id="role"></span>
              <span class="tag" id="status"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="section-title">
          玩家能力
          <span class="section-note">軟上限 100</span>
        </div>

        <div class="stats">

          <div class="stat">
            <div class="stat-head">
              <span class="stat-name">操作</span>
              <span class="stat-value" id="mechanic"></span>
            </div>
            <div class="stat-info" id="mechanicInfo"></div>
            <div class="bar"><i id="mechanicBar"></i></div>
          </div>

          <div class="stat">
            <div class="stat-head">
              <span class="stat-name">遊戲理解</span>
              <span class="stat-value" id="macro"></span>
            </div>
            <div class="stat-info" id="macroInfo"></div>
            <div class="bar"><i id="macroBar"></i></div>
          </div>

          <div class="stat">
            <div class="stat-head">
              <span class="stat-name">英雄池</span>
              <span class="stat-value" id="champion"></span>
            </div>
            <div class="stat-info" id="championInfo"></div>
            <div class="bar"><i id="championBar"></i></div>
          </div>

          <div class="stat">
            <div class="stat-head">
              <span class="stat-name">穩定度</span>
              <span class="stat-value" id="stability"></span>
            </div>
            <div class="stat-info" id="stabilityInfo"></div>
            <div class="bar"><i id="stabilityBar"></i></div>
          </div>

        </div>
      </div>

      <div class="card">
        <div class="section-title">
          總評
          <span class="section-note">職業潛力</span>
        </div>

        <div class="overall">
          <div class="overall-number" id="overall"></div>
          <div>
            <div class="rank-text" id="nextGoal"></div>
            <div class="rank-bar"><i id="overallBar"></i></div>
            <div class="stat-info" id="overallInfo"></div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="section-title">核心資源</div>

        <div class="resource">
          <div class="resource-item">
            <div class="resource-label">養成點</div>
            <div class="resource-value green" id="points"></div>
          </div>

          <div class="resource-item">
            <div class="resource-label">RANK</div>
            <div class="resource-value" id="rank"></div>
          </div>

          <div class="resource-item">
            <div class="resource-label">名聲</div>
            <div class="resource-value gold" id="reputation"></div>
          </div>
        </div>
      </div>

    </div>


    <div class="right">

      <div class="card">
        <div class="section-title">
          時間線
          <span class="section-note">一年四季</span>
        </div>

        <div class="timeline">
          <div class="quarter" id="q1">Q1</div>
          <div class="quarter" id="q2">Q2</div>
          <div class="quarter" id="q3">Q3</div>
          <div class="quarter" id="q4">Q4</div>
        </div>
      </div>

      <div class="card">
        <div class="section-title">本季度行動</div>
        <div class="actions" id="actions"></div>
      </div>

      <div class="card">
        <div class="section-title">
          最近故事
          <span class="section-note">人生不一定順利</span>
        </div>
        <div class="story" id="story"></div>
      </div>

      <div class="card">
        <div class="section-title">人生紀錄</div>
        <div class="history" id="history"></div>
      </div>

    </div>

  </div>

  <nav class="bottom">
    <button class="nav active" id="homeNav">人生</button>
    <button class="nav" id="clubNav">俱樂部</button>
    <button class="nav" id="saveNav">存檔</button>
  </nav>

</div>


<!-- =========================
     俱樂部頁
========================= -->
<div id="clubPage" class="page">
  <div class="page-card">
    <div class="page-title">俱樂部</div>
    <div class="page-sub">
      你不需要先加入隊伍。達到條件後，隊伍才會主動找你。
    </div>
    <div class="clubs" id="clubs"></div>
  </div>
</div>


<!-- =========================
     存檔頁
========================= -->
<div id="savePage" class="page">
  <div class="page-card">
    <div class="page-title">存檔</div>
    <div class="page-sub" id="saveInfo">尚未建立存檔</div>
    <button class="modal-btn" id="saveBtn">儲存目前人生</button>
    <button class="modal-btn" id="loadBtn" style="background:#13291e;color:var(--green2)">
      載入人生
    </button>
    <button class="modal-btn" id="deleteBtn" style="background:#251313;color:#ffaaaa">
      刪除存檔
    </button>
  </div>
</div>


<!-- =========================
     隨機事件
========================= -->
<div class="modal" id="eventModal">
  <div class="modal-box">
    <div class="modal-type">RANDOM EVENT</div>
    <div class="modal-title" id="eventTitle"></div>
    <div class="modal-story" id="eventStory"></div>
    <div class="modal-actions" id="eventChoices"></div>
  </div>
</div>


<!-- =========================
     結果
========================= -->
<div class="modal" id="resultModal">
  <div class="modal-box">
    <div class="modal-type">本季度結果</div>
    <div class="modal-title" id="resultTitle"></div>
    <div class="modal-story" id="resultStory"></div>
    <div class="result-rewards" id="resultRewards"></div>
    <button class="modal-btn" id="continueBtn">進入下一季度</button>
  </div>
</div>


<script>
"use strict";

/* =========================
   選擇器
========================= */
let selectedLeague="";
let selectedRole="";

document.querySelectorAll("#leagueChoices .select-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    selectedLeague=btn.dataset.value;
    document.querySelectorAll("#leagueChoices .select-btn")
      .forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
  });
});

document.querySelectorAll("#roleChoices .select-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    selectedRole=btn.dataset.value;
    document.querySelectorAll("#roleChoices .select-btn")
      .forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
  });
});


/* =========================
   遊戲資料
========================= */
let game=null;

const defaultStats={
  mechanic:34,
  macro:30,
  champion:26,
  stability:32
};

const clubData=[
  {
    name:"地方業餘隊",
    league:"業餘",
    need:"Rank、基本數值、即戰力",
    type:"weak",
    rank:1400,
    overall:0,
    rep:0
  },
  {
    name:"地區聯賽一隊",
    league:"地區聯賽",
    need:"Rank、操作、穩定度",
    type:"weak",
    rank:1600,
    overall:45,
    rep:0
  },
  {
    name:"職業體系二隊",
    league:"職業青訓",
    need:"英雄池、理解、成長潛力",
    type:"academy",
    rank:0,
    overall:55,
    rep:0
  },
  {
    name:"頂級聯賽二隊",
    league:"職業體系",
    need:"英雄池、總評、比賽經驗",
    type:"academy",
    rank:0,
    overall:65,
    rep:2
  },
  {
    name:"頂級聯賽一隊",
    league:"職業聯賽",
    need:"總評、穩定度、比賽能力",
    type:"pro",
    rank:0,
    overall:72,
    rep:4
  },
  {
    name:"強隊一隊",
    league:"頂級聯賽",
    need:"高總評、英雄池、名聲",
    type:"elite",
    rank:0,
    overall:82,
    rep:8
  }
];


/* =========================
   行動
========================= */
function rankAction(){
  const ability=
    game.stats.mechanic*.3+
    game.stats.macro*.25+
    game.stats.champion*.15+
    game.stats.stability*.3;

  const expected=
    35+(game.rank/48);

  let chance=Math.max(
    .16,
    Math.min(.84,.48+(ability-expected)/75)
  );

  const win=Math.random()<chance;

  const delta=win
    ?rand(45,88)
    :-rand(35,72);

  const point=win
    ?rand(5,9)
    :rand(2,5);

  game.rank=Math.max(0,game.rank+delta);
  game.points+=point;

  return {
    title:"獨自爬分",
    text:win
      ?"你沒有隊伍、沒有教練，也沒有人替你安排訓練。你只能靠一場又一場 Rank 證明自己。這次你抓住了幾次關鍵機會，分數開始往上走。"
      :"今天的 Rank 並不順利。你開始發現，越往上爬，單純靠操作已經不夠。每一次失誤都會被放大，這也是成為高端玩家必須付出的代價。",
    rewards:[
      `RANK ${delta>=0?"+":""}${delta}`,
