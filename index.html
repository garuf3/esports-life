/* =========================================================
   賽區標籤
========================================================= */

const REGION_LABELS = Object.freeze({
  KR:"🇰🇷 KR",
  CN:"🇨🇳 CN",
  EMEA:"🌍 EMEA",
  APAC:"🌏 APAC",
  AMERICA:"🌎 AMERICA"
});


/* =========================================================
   取得玩家賽區
========================================================= */

function getPlayerRegion(){

  return g.region || "APAC";

}


/* =========================================================
   取得玩家所在賽區的全部隊伍
========================================================= */

function getTeamsForPlayer(){

  const r = getPlayerRegion();

  return REGION_TEAMS[r] || [];

}


/* =========================================================
   取得符合位置的隊伍
   注意：
   賽區永遠是第一層條件
========================================================= */

function getEligibleTeams(){

  const r = getPlayerRegion();
  const position = g.position || "";

  return getTeamsForPlayer()
    .filter(team => team.region === r)
    .filter(team => {

      if(!position){
        return true;
      }

      return team.roles.includes(position);

    })
    .sort((a,b) => b.power - a.power);

}


/* =========================================================
   顯示 Scout
========================================================= */

function renderTeamList(){

  const container = $("teamList");

  if(!container){
    return;
  }

  const r = getPlayerRegion();

  const teams = getEligibleTeams();

  container.innerHTML = "";

  const title = document.createElement("div");

  title.className = "tip";

  title.innerHTML =
    `<b>${REGION_LABELS[r] || r} 隊伍池</b><br>
     目前共有 ${getTeamsForPlayer().length} 支隊伍。
     以下只顯示 ${r} 賽區。`;

  container.appendChild(title);


  teams.forEach(team => {

    const item = document.createElement("div");

    item.className = "team";

    item.innerHTML = `
      <div class="teamTop">

        <div>

          <div class="teamName">
            ${escapeHTML(team.name)}

            <span class="teamCode">
              ${escapeHTML(team.code)}
            </span>
          </div>

          <div class="teamRegion">
            ${REGION_LABELS[team.region] || team.region}
            ・賽區排名 ${team.rank}
          </div>

        </div>

        <div class="attention">
          ${team.power}
        </div>

      </div>

      <div class="badgeRow">

        ${team.roles.map(role => `
          <span class="badge">
            ${escapeHTML(role)}
          </span>
        `).join("")}

      </div>

      <div class="badgeRow">

        ${team.styles.map(style => `
          <span class="badge">
            ${escapeHTML(style)}
          </span>
        `).join("")}

      </div>
    `;

    container.appendChild(item);

  });

}


/* =========================================================
   隊伍邀約
========================================================= */

function openTeamOffer(code){

  const r = getPlayerRegion();

  const team = getTeamsForPlayer()
    .find(t =>
      t.code === code &&
      t.region === r
    );

  if(!team){
    return;
  }

  g.joinedTeam = team;

  $("acceptTitle").textContent =
    `🏆 ${team.name}`;

  $("acceptText").textContent =
    `📨 ${team.name}（${team.code}）來自 ${REGION_LABELS[r] || r}，希望邀請你加入。`;

  hideAll();

  $("accept").classList.remove("hidden");

}


/* =========================================================
   接受邀約
========================================================= */

function acceptTeam(){

  if(!g.joinedTeam){
    return;
  }

  const r = getPlayerRegion();

  const team = getTeamsForPlayer()
    .find(t =>
      t.code === g.joinedTeam.code &&
      t.region === r
    );

  if(!team){

    g.joinedTeam = null;

    showOffer();

    return;

  }

  g.joinedTeam = team;

  $("joinedTitle").textContent =
    `🏆 你加入了 ${team.name}`;

  $("joinedText").textContent =
    `🎉 你正式加入 ${team.name}（${team.code}）。`;

  hideAll();

  $("joined").classList.remove("hidden");

}


/* =========================================================
   HTML 安全處理
========================================================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   重要：
   舊版 TEAMS 不再使用

   如果原 HTML 還有：

      const TEAMS = ...

   請整段刪掉。

   所有地方改用：

      REGION_TEAMS

   Scout：
      getTeamsForPlayer()

   邀約：
      openTeamOffer()

   加入：
      acceptTeam()

   都會自動鎖定玩家目前賽區。
========================================================= */
