/* =====================================================

function getRegionTeams(){

    return teams[game.region] || [];

/* =====================================================
   UI 顯示隊伍
   注意：
   code 不顯示給玩家
   只顯示化名
===================================================== */

function renderTeamInterest(){

    const list = getRegionTeams();

    const container =
        document.getElementById("teamInterest");

    if(!container){
        return;
    }

    if(!list.length){

        container.innerHTML =
            "<div class='muted'>目前沒有隊伍關注你。</div>";

        return;
    }

    let html = "";

    list.forEach(team => {

        const positionScore =
            game.position
            ? positionFit(game.position)
            : 70;

        const interest = Math.max(
            0,
            Math.min(
                99,
                Math.round(
                    team.power * 0.55 +
                    positionScore * 0.25 +
                    game.fit * 0.20
                )
            )
        );

        html += `

        <div class="teamCard">

            <div class="teamHeader">

                <div>

                    <div class="teamName">
                        ${team.name}
                    </div>

                    <div class="teamType">
                        ${game.region}
                    </div>

                </div>

                <div class="teamPower">
                    ${team.power}
                </div>

            </div>


            <div class="teamMeta">

                ${team.style.map(tag => `
                    <span class="tag">
                        ${tag}
                    </span>
                `).join("")}

            </div>


            <div class="interest">

                邀約適性
                <b>
                    ${interest}
                </b>

                <div class="interestBar">

                    <i style="
                        width:${interest}%;
                    "></i>

                </div>

            </div>

        </div>

        `;

    });

    container.innerHTML = html;

}
