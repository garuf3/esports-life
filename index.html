<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LOL 職業人生模擬器</title>

<style>

:root{
    --bg:#edf5ee;
    --card:#ffffff;
    --green:#245c3d;
    --green2:#3f7d59;
    --light:#e3efe5;
    --line:#d8e4da;
    --text:#26332b;
    --muted:#78837c;
    --gold:#b28b42;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:
        radial-gradient(circle at top,#fafffa 0,#edf5ee 45%,#e5efe7 100%);
    color:var(--text);
    font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    font-size:14px;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.top{
    height:62px;
    position:sticky;
    top:0;
    z-index:30;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(15px);
    border-bottom:1px solid var(--line);
}

.top-inner{
    width:min(720px,calc(100% - 20px));
    height:100%;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--green);
    font-weight:900;
    font-size:13px;
}

.logo-icon{
    width:30px;
    height:30px;
    border-radius:9px;
    background:var(--green);
    color:white;
    display:grid;
    place-items:center;
}

.top-buttons{
    display:flex;
    gap:5px;
}

.top-buttons button{
    width:32px;
    height:32px;
    border:1px solid var(--line);
    background:white;
    color:var(--green);
    border-radius:9px;
    font-weight:900;
}

.season{
    width:auto!important;
    padding:0 9px;
    background:var(--light)!important;
    border:0!important;
    font-size:9px;
}

.main{
    width:min(720px,calc(100% - 20px));
    margin:auto;
    padding:16px 0 90px;
}

.profile{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.player{
    display:flex;
    gap:10px;
    align-items:center;
}

.avatar{
    width:46px;
    height:46px;
    border-radius:14px;
    background:#dbeadb;
    display:grid;
    place-items:center;
    color:var(--green);
    font-weight:900;
}

.player-name{
    font-size:18px;
    font-weight:900;
    color:var(--green);
}

.player-id{
    font-size:9px;
    color:var(--muted);
}

.player-meta{
    font-size:8px;
    color:var(--green2);
    margin-top:3px;
    font-weight:800;
}

.rank{
    text-align:right;
}

.rank small{
    display:block;
    font-size:8px;
    color:var(--muted);
}

.rank strong{
    font-size:22px;
    color:var(--green);
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
}

.stat{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px;
}

.stat-top{
    display:flex;
    justify-content:space-between;
    font-size:9px;
    font-weight:900;
}

.stat-top span:last-child{
    color:var(--green2);
}

.bar{
    height:5px;
    margin:7px 0 5px;
    background:#e7eee8;
    border-radius:999px;
    overflow:hidden;
}

.bar-fill{
    height:100%;
    background:var(--green2);
    border-radius:999px;
}

.stat-bottom{
    display:flex;
    justify-content:space-between;
    color:#9aa39d;
    font-size:7px;
}

.points{
    margin:9px 0 17px;
    background:white;
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.point-left{
    display:flex;
    gap:8px;
    align-items:center;
}

.point-icon{
    width:29px;
    height:29px;
    border-radius:8px;
    background:#f3ead7;
    color:var(--gold);
    display:grid;
    place-items:center;
}

.point-title{
    font-size:10px;
    font-weight:900;
    color:var(--green);
}

.point-desc{
    font-size:8px;
    color:var(--muted);
}

.point-right{
    display:flex;
    align-items:center;
    gap:7px;
}

.point-number{
    font-size:19px;
    font-weight:900;
    color:var(--green);
}

.small-button{
    border:0;
    background:var(--light);
    color:var(--green);
    padding:6px 9px;
    border-radius:8px;
    font-size:8px;
    font-weight:900;
}

.kicker{
    font-size:9px;
    color:var(--green2);
    font-weight:900;
    letter-spacing:1px;
}

.title{
    font-size:22px;
    line-height:1.35;
    color:var(--green);
    font-weight:900;
    margin:4px 0 10px;
}

.event-card{
    background:white;
    border:1px solid var(--line);
    border-radius:16px;
    padding:15px;
    box-shadow:0 12px 30px rgba(35,75,48,.06);
}

.event-type{
    font-size:9px;
    color:var(--green2);
    font-weight:900;
    margin-bottom:7px;
}

.story{
    font-size:12px;
    color:#5e6961;
    line-height:1.75;
}

.choices{
    display:grid;
    gap:8px;
    margin-top:12px;
}

.choice{
    width:100%;
    display:grid;
    grid-template-columns:34px 1fr 12px;
    gap:9px;
    align-items:center;
    text-align:left;
    border:1px solid var(--line);
    background:white;
    border-radius:12px;
    padding:10px;
}

.choice:hover{
    border-color:#9fc0a7;
}

.choice-icon{
    width:34px;
    height:34px;
    border-radius:9px;
    background:#eff5ef;
    display:grid;
    place-items:center;
}

.choice-title{
    font-size:11px;
    font-weight:900;
    color:var(--green);
}

.choice-desc{
    font-size:8px;
    color:var(--muted);
    line-height:1.5;
    margin-top:2px;
}

.reward{
    display:inline-block;
    margin-top:4px;
    background:var(--light);
    color:var(--green2);
    border-radius:5px;
    padding:2px 5px;
    font-size:7px;
    font-weight:900;
}

.arrow{
    color:#a7b0a9;
}

.club{
    margin-top:12px;
    background:white;
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px;
}

.club-head{
    display:flex;
    justify-content:space-between;
}

.club-name{
    color:var(--green);
    font-size:11px;
    font-weight:900;
}

.stars{
    color:var(--gold);
    font-size:10px;
}

.club-desc{
    color:var(--muted);
    font-size:8px;
    margin-top:4px;
}

.section{
    margin-top:22px;
}

.section-title{
    color:var(--muted);
    font-size:9px;
    font-weight:900;
    display:flex;
    gap:8px;
    align-items:center;
}

.section-title:after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
}

.history{
    margin-top:6px;
    background:white;
    border:1px solid var(--line);
    border-radius:14px;
    padding:3px 11px;
}

.history-row{
    display:grid;
    grid-template-columns:48px 1fr;
    gap:8px;
    padding:8px 0;
    border-bottom:1px solid #e8eee9;
}

.history-row:last-child{
    border-bottom:0;
}

.history-date{
    color:var(--green2);
    font-size:8px;
    font-weight:900;
}

.history-text{
    color:#6b756e;
    font-size:9px;
    line-height:1.55;
}

/* SHEET */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(18,54,33,.45);
    backdrop-filter:blur(5px);
    z-index:80;
    display:none;
    align-items:flex-end;
}

.overlay.show{
    display:flex;
}

.sheet{
    width:min(720px,100%);
    max-height:92vh;
    overflow:auto;
    background:white;
    border-radius:22px 22px 0 0;
    padding:17px;
}

.handle{
    width:36px;
    height:4px;
    background:#d8e0d9;
    border-radius:99px;
    margin:0 auto 14px;
}

.sheet-head{
    display:flex;
    justify-content:space-between;
    align-items:start;
}

.sheet-title{
    font-size:18px;
    color:var(--green);
    font-weight:900;
}

.sheet-desc{
    font-size:8px;
    color:var(--muted);
    margin-top:3px;
}

.ap{
    color:var(--green2);
    font-size:11px;
    font-weight:900;
}

.allocations{
    display:grid;
    gap:7px;
    margin-top:12px;
}

.allocation{
    display:grid;
    grid-template-columns:1fr auto;
    align-items:center;
    border:1px solid var(--line);
    border-radius:11px;
    padding:9px;
}

.allocation-name{
    font-size:10px;
    font-weight:900;
    color:var(--green);
}

.allocation-value{
    color:var(--green2);
    font-size:9px;
    margin-left:5px;
}

.allocation-desc{
    color:var(--muted);
    font-size:8px;
    margin-top:3px;
}

.alloc-buttons{
    display:flex;
    gap:5px;
}

.alloc-buttons button{
    width:31px;
    height:29px;
    border:0;
    border-radius:8px;
    font-weight:900;
}

.minus{
    background:#eef2ee;
    color:var(--green);
}

.plus{
    background:var(--green);
    color:white;
}

.alloc-buttons button:disabled{
    opacity:.25;
}

.sheet-actions{
    display:grid;
    grid-template-columns:1fr 1.5fr;
    gap:7px;
    margin-top:10px;
}

.sheet-actions button{
    padding:10px;
    border-radius:10px;
    font-size:10px;
    font-weight:900;
}

.cancel{
    border:1px solid var(--line);
    background:white;
    color:var(--green);
}

.confirm{
    border:0;
    background:var(--green);
    color:white;
}

/* OFFER */

.offers{
    display:grid;
    gap:9px;
    margin-top:13px;
}

.offer{
    background:#fbfdfb;
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px;
}

.offer-head{
    display:flex;
    justify-content:space-between;
    align-items:start;
}

.offer-team{
    font-size:12px;
    color:var(--green);
    font-weight:900;
}

.offer-stars{
    color:var(--gold);
    font-size:10px;
}

.offer-tag{
    display:inline-block;
    margin-top:4px;
    padding:3px 6px;
    border-radius:6px;
    background:var(--light);
    color:var(--green2);
    font-size:7px;
    font-weight:900;
}

.offer-text{
    color:#637067;
    font-size:9px;
    line-height:1.7;
    margin:8px 0;
}

.offer-info{
    color:var(--muted);
    font-size:8px;
    line-height:1.7;
}

.offer-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    margin-top:8px;
}

.offer-actions button{
    padding:8px;
    border-radius:8px;
    font-size:9px;
    font-weight:900;
}

.accept{
    background:var(--green);
    color:white;
    border:0;
}

.decline{
    background:white;
    color:var(--green);
    border:1px solid var(--line);
}

/* START */

.start-screen{
    position:fixed;
    inset:0;
    z-index:100;
    background:
        radial-gradient(circle at top,#ffffff,#dcebdd 85%);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:18px;
    overflow:auto;
}

.start-box{
    width:min(440px,100%);
    background:rgba(255,255,255,.95);
    border:1px solid #d4e1d5;
    border-radius:23px;
    padding:23px 20px;
    box-shadow:0 25px 70px rgba(29,72,44,.12);
}

.start-box h1{
    margin:0;
    color:var(--green);
    font-size:25px;
    line-height:1.3;
}

.start-box p{
    font-size:10px;
    line-height:1.7;
    color:var(--muted);
}

.label{
    display:block;
    font-size:9px;
    font-weight:900;
    color:#58635c;
    margin:9px 0 5px;
}

.input,
.select{
    width:100%;
    padding:10px;
    border:1px solid var(--line);
    border-radius:10px;
    background:white;
    outline:0;
    font-size:11px;
}

.start-button{
    width:100%;
    margin-top:15px;
    padding:12px;
    border:0;
    border-radius:11px;
    background:var(--green);
    color:white;
    font-size:11px;
    font-weight:900;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:18px;
    z-index:200;
    transform:translate(-50%,15px);
    opacity:0;
    background:var(--green);
    color:white;
    padding:8px 13px;
    border-radius:99px;
    font-size:9px;
    font-weight:800;
    transition:.2s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

@media(max-width:600px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .title{
        font-size:20px;
    }

    .main{
        padding-top:13px;
    }

}

</style>
</head>

<body>

<header class="top">

<div class="top-inner">

<div class="logo">
    <div class="logo-icon">L</div>
    LOL 職業人生
</div>

<div class="top-buttons">

<button class="season" id="season">2026 Q1</button>

<button onclick="goBack()">←</button>

<button onclick="undoDecision()">↶</button>

<button onclick="saveGame()">↓</button>

</div>

</div>

</header>


<main class="main">

<div class="profile">

<div class="player">

<div class="avatar">◇</div>

<div>

<div class="player-name" id="playerName">未命名</div>

<div class="player-id" id="playerId">@PLAYER</div>

<div class="player-meta" id="playerMeta">
LCP · ADC · 17歲
</div>

</div>

</div>

<div class="rank">

<small id="rankLabel">RANK</small>

<strong id="rankValue">0</strong>

</div>

</div>


<div class="stats" id="stats"></div>


<div class="points">

<div class="point-left">

<div class="point-icon">✦</div>

<div>

<div class="point-title">
養成點
</div>

<div class="point-desc">
能力越高，下一點成本越高
</div>

</div>

</div>

<div class="point-right">

<div class="point-number" id="points">
0
</div>

<button class="small-button" onclick="openAllocation()">
分配
</button>

</div>

</div>


<div class="kicker" id="kicker"></div>

<div class="title" id="eventTitle"></div>


<section class="event-card">

<div class="event-type" id="eventType"></div>

<div class="story" id="story"></div>

<div class="choices" id="choices"></div>

</section>


<div id="clubBox"></div>


<div class="section">

<div class="section-title">
生涯紀錄
</div>

<div class="history" id="history"></div>

</div>

</main>


<!-- 養成點 -->

<div class="overlay" id="allocationOverlay">

<div class="sheet">

<div class="handle"></div>

<div class="sheet-head">

<div>

<div class="sheet-title">
分配養成點
</div>

<div class="sheet-desc">
本次分配可以自由撤回，不會鎖死。
</div>

</div>

<div class="ap" id="allocationPoints">
0 AP
</div>

</div>

<div class="allocations" id="allocations"></div>

<div class="sheet-actions">

<button class="cancel" onclick="cancelAllocation()">
取消
</button>

<button class="confirm" onclick="confirmAllocation()">
完成
</button>

</div>

</div>

</div>


<!-- FA -->

<div class="overlay" id="offerOverlay">

<div class="sheet">

<div class="handle"></div>

<div class="sheet-head">

<div>

<div class="sheet-title">
自由市場 Offer
</div>

<div class="sheet-desc">
只有真正對你提出邀請的隊伍會出現在這裡。
</div>

</div>

<div class="ap" id="offerCount"></div>

</div>

<div class="offers" id="offers"></div>

</div>

</div>


<!-- 開始 -->

<div class="start-screen" id="startScreen">

<div class="start-box">

<h1>
從一名 Rank 玩家開始。
</h1>

<p>
業餘時期先靠 Rank 養成自己。
你可以加入校隊，也可以完全不加入，成為路人王。
之後透過業餘賽與名聲讓 Scout 注意到你。
進入職業後，業餘 Rank 會轉換成職業評分。
</p>

<label class="label">
姓名
</label>

<input
class="input"
id="nameInput"
placeholder="例如：林昱翔"
/>

<label class="label">
遊戲 ID
</label>

<input
class="input"
id="idInput"
placeholder="例如：Yuki"
/>

<label class="label">
出生賽區
</label>

<select class="select" id="regionInput">

<option value="LCP">
台港澳／LCP
</option>

<option value="LCK">
韓國／LCK
</option>

<option value="LPL">
中國／LPL
</option>

<option value="LEC">
歐洲／LEC
</option>

<option value="LCS">
北美／LCS
</option>

<option value="CBLOL">
巴西／CBLOL
</option>

</select>


<label class="label">
主要位置
</label>

<select class="select" id="roleInput">

<option>TOP</option>
<option>JUNGLE</option>
<option>MID</option>
<option>ADC</option>
<option>SUPPORT</option>

</select>


<label class="label">
高中／大學時期
</label>

<select class="select" id="pathInput">

<option value="solo">
不加入校隊：路人王路線
</option>

<option value="school">
加入電競校隊
</option>

</select>


<button class="start-button" onclick="startGame()">
開始生涯
</button>

</div>

</div>


<div class="toast" id="toast"></div>

/* =====================================================
   工具
===================================================== */

function clone(obj){

    return JSON.parse(JSON.stringify(obj));

}


function random(min,max){

    return Math.floor(
        Math.random()*(max-min+1)
    )+min;

}


function showToast(text){

    const toast =
        document.getElementById("toast");

    toast.textContent=text;

    toast.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer=setTimeout(()=>{

        toast.classList.remove("show");

    },1800);

}


/* =====================================================
   養成點成本
===================================================== */

function pointCost(value,limit){

    const ratio=value/limit;

    if(ratio<0.60) return 1;

    if(ratio<0.72) return 2;

    if(ratio<0.82) return 3;

    if(ratio<0.90) return 5;

    if(ratio<0.96) return 8;

    return 12;

}


/* =====================================================
   開始遊戲
===================================================== */

function startGame(){

    const name=
        document.getElementById("nameInput")
        .value.trim();

    const id=
        document.getElementById("idInput")
        .value.trim();

    if(!name || !id){

        showToast("姓名與 ID 都要填");

        return;

    }

    game.started=true;

    game.name=name;

    game.id=id;

    game.region=
        document.getElementById("regionInput").value;

    game.role=
        document.getElementById("roleInput").value;

    game.path=
        document.getElementById("pathInput").value;


    /*
       不同位置初始特性略有不同
    */

    if(game.role==="ADC")
        game.stats.mechanic+=2;

    if(game.role==="MID" ||
       game.role==="JUNGLE")
        game.stats.macro+=2;

    if(game.role==="TOP")
        game.stats.stability+=2;

    if(game.role==="SUPPORT"){

        game.stats.macro+=1;
        game.stats.stability+=1;

    }


    if(game.path==="school"){

        game.school={

            name:"校園電競校隊",

            stars:random(1,3)

        };

        addHistory(
            "加入電競校隊，開始累積團隊比賽經驗。"
        );

    }

    else{

        addHistory(
            "拒絕加入校隊，決定靠 Rank 與業餘賽證明自己。"
        );

    }


    document
        .getElementById("startScreen")
        .style.display="none";


    createNextEvent();

    render();

    showToast("生涯開始");

}

/* =====================================================
   Rank
===================================================== */

function rankGame(){

    const power=
        game.stats.mechanic*.3+
        game.stats.macro*.3+
        game.stats.stability*.22+
        game.stats.champion*.18;


    let delta;


    if(power>=82)
        delta=random(55,90);

    else if(power>=72)
        delta=random(30,60);

    else if(power>=62)
        delta=random(8,35);

    else if(power>=52)
        delta=random(-18,16);

    else
        delta=random(-55,5);


    game.lp=
        Math.max(0,game.lp+delta);


    let points;


    if(game.lp>=1200)
        points=random(10,14);

    else if(game.lp>=1000)
        points=random(8,11);

    else if(game.lp>=800)
        points=random(6,9);

    else if(game.lp>=600)
        points=random(4,7);

    else
        points=random(3,5);


    game.points+=points;


    return {

        delta,

        points

    };

}


/* =====================================================
   Scout 機率
===================================================== */

function checkForScout(){

    if(game.pro || game.pendingScout)
        return;


    let chance=0;


    if(game.lp>=800)
        chance+=0.18;

    if(game.lp>=1000)
        chance+=0.20;

    if(game.reputation>=5)
        chance+=0.18;

    if(game.school)
        chance+=0.08;


    if(Math.random()<chance){

        let possible=
            TEAMS.filter(
                team =>
                team.league===game.region ||
                game.reputation>=6
            );


        if(!possible.length)
            possible=TEAMS;


        const team=
            possible[
                random(0,possible.length-1)
            ];


        game.pendingScout={

            team

        };

    }

}


/* =====================================================
   事件處理
===================================================== */

function makeDecision(action){

    /*
       先完整保存一次狀態，
       所以上一步不會因為加點或事件而失效。
    */

    game.previousState=clone(game);


    if(action==="offers"){

        showOffers();

        return;

    }


    if(action==="leaveSchool"){

        game.school=null;

        addHistory(
            "退出電競校隊，轉為自由玩家。"
        );

        advanceQuarter();

        createNextEvent();

        render();

        return;

    }


    if(action==="trial"){

        doTrial();

        return;

    }


    let resultText="";


    if(action==="rank"){

        const result=rankGame();

        resultText=
            `Rank ${result.delta>=0?"+":""}${result.delta} LP，獲得 ${result.points} 點養成資源。`;

    }


    if(action==="hardRank"){

        const result=rankGame();

        const extra=
            random(8,14);

        game.lp+=extra;

        game.points+=random(2,5);


        resultText=
            `高強度 Rank 結束，Rank ${result.delta+extra>=0?"+":""}${result.delta+extra} LP。你承受了更高強度的對局。`;

    }


    if(action==="review"){

        const points=random(7,11);

        game.points+=points;

        game.stats.macro=
            Math.min(
                game.limits.macro,
                game.stats.macro+1
            );


        resultText=
            `復盤完成，獲得 ${points} 點養成資源，理解提升。`;

    }


    if(action==="amateur"){

        const points=random(5,10);

        const reputation=random(1,6);


        game.points+=points;

        game.reputation+=reputation;


        game.stats.stability=
            Math.min(
                game.limits.stability,
                game.stats.stability+1
            );


        resultText=
            `業餘賽結束，獲得 ${points} 點養成資源與 ${reputation} 點名聲。`;

    }


    if(action==="schoolTraining"){

        const points=random(7,12);

        game.points+=points;


        game.stats.stability=
            Math.min(
                game.limits.stability,
                game.stats.stability+2
            );


        game.stats.macro=
            Math.min(
                game.limits.macro,
                game.stats.macro+1
            );


        resultText=
            `校隊賽訓完成，獲得 ${points} 點養成資源，團隊能力有所提升。`;

    }


    if(action==="schoolTournament"){

        const points=random(6,11);

        const reputation=random(2,7);


        game.points+=points;

        game.reputation+=reputation;


        game.stats.stability=
            Math.min(
                game.limits.stability,
                game.stats.stability+1
            );


        resultText=
            `校際／業餘賽完成，獲得 ${points} 點養成資源與 ${reputation} 點名聲。`;

    }


    if(action==="scrim"){

        const points=random(8,14);

        game.points+=points;


        game.stats.stability=
            Math.min(
                game.limits.stability,
                game.stats.stability+2
            );


        game.stats.macro=
            Math.min(
                game.limits.macro,
                game.stats.macro+1
            );


        resultText=
            `完成賽訓，獲得 ${points} 點養成資源，穩定與理解提升。`;

    }


    addHistory(resultText);


    advanceQuarter();


    checkForScout();


    checkForFA();


    createNextEvent();


    render();

}


/* =====================================================
   試訓
===================================================== */

function doTrial(){

    const average=
        (
            game.stats.mechanic+
            game.stats.macro+
            game.stats.stability+
            game.stats.champion
        )/4;


    const team=
        game.pendingScout.team;


    const success=
        average>=50 &&
        game.stats.stability>=48 &&
        game.reputation>=2;


    const points=random(8,14);

    game.points+=points;


    if(success){

        game.pro={

            team:team.name,

            league:team.league,

            level:"青訓",

            stars:team.stars,

            professionalRating:
                Math.round(average)

        };


        addHistory(
            `通過 ${team.name} 試訓，進入青訓體系。`
        );


        game.pendingScout=null;


        advanceQuarter();

        createNextEvent();

        render();


        showToast(
            "試訓成功，進入職業體系"
        );

    }

    else{

        addHistory(
            `試訓未通過，但獲得 ${points} 點經驗。`
        );


        game.pendingScout=null;


        advanceQuarter();

        createNextEvent();

        render();


        showToast(
            "這次沒有通過試訓"
        );

    }

}


/* =====================================================
   職業評分
===================================================== */

function calculateProfessionalRating(){

    return Math.round(

        game.stats.mechanic*.25+
        game.stats.macro*.30+
        game.stats.stability*.25+
        game.stats.champion*.20

    );

}


/* =====================================================
   FA
===================================================== */

function calculateTeamScore(team){

    const s=game.stats;

    const lp=game.lp;


    /*
       弱隊：
       Rank 比英雄池重要很多。

       中游：
       個人能力與理解平均。

       強隊：
       理解、穩定、英雄池重要。

       這些權重只在後台，
       玩家不需要看到。
    */


    if(team.type==="rebuild"){

        return

            lp*.65+
            s.mechanic*.15+
            s.macro*.07+
            s.stability*.10+
            s.champion*.03;

    }


    if(team.type==="competitive"){

        return

            lp*.30+
            s.mechanic*.22+
            s.macro*.20+
            s.stability*.18+
            s.champion*.10;

    }


    return

        lp*.10+
        s.mechanic*.14+
        s.macro*.30+
        s.stability*.28+
        s.champion*.18;

}


function createOffers(){

    const pool=
        TEAMS.filter(
            team => true
        );


    const candidates=
        pool.map(team=>({

            team,

            score:
                calculateTeamScore(team)

        }))
        .filter(x=>x.score>=60)
        .sort(
            (a,b)=>b.score-a.score
        )
        .slice(0,4);


    game.offers=
        candidates.map(x=>{

            const team=x.team;

            let level="青訓";


            if(
                team.type==="rebuild" &&
                x.score>=72
            ){

                level="一隊主力";

            }

            else if(
                team.type==="rebuild"
            ){

                level="一隊競爭";

            }

            else if(
                x.score>=82
            ){

                level="一隊替補";

            }

            else if(
                x.score>=72
            ){

                level="二隊主力";

            }


            return {

                team,

                level,

                score:x.score,

                years:random(1,3),

                text:
                    createOfferText(
                        team,
                        level
                    )

            };

        });

}


function createOfferText(team,level){

    if(level==="一隊主力"){

        return

        `我們目前正在重建陣容，需要一名能立即上場的 ${game.role}。你近期的 Rank 與個人表現符合我們的需求。`;

    }


    if(level==="一隊競爭"){

        return

        `我們正在尋找能競爭首發位置的 ${game.role}。你的個人能力讓我們願意給你機會。`;

    }


    if(level==="一隊替補"){

        return

        `我們希望增加一名能在高強度環境中隨時上場的 ${game.role}。你的穩定與理解引起了我們注意。`;

    }


    if(level==="二隊主力"){

        return

        `我們正在發展下一代陣容，希望你能在二隊累積職業比賽經驗，並競爭未來的一隊位置。`;

    return

        `你的 Rank、比賽資料與成長潛力符合我們目前的招募方向，希望邀請你加入發展體系。`;

}


function checkForFA(){

    /*
       職業第一季／FA 時間點，
       有機會同時出現多份 Offer。
    */

    if(
        game.pro &&
        game.quarter===1 &&
        Math.random()<0.65
    ){

        createOffers();

    }

}


/* =====================================================
   Offer UI
===================================================== */

function showOffers(){

    const container=
        document.getElementById("offers");


    document.getElementById(
        "offerCount"
    ).textContent=
        game.offers.length+" 份";


    container.innerHTML=
        game.offers.map((offer,index)=>{

            const stars=
                "★".repeat(
                    offer.team.stars
                )+
                "☆".repeat(
                    5-offer.team.stars
                );


            return `

            <div class="offer">

                <div class="offer-head">

                    <div>

                        <div class="offer-team">

                            ${offer.team.name}
                            ·
                            ${offer.team.league}

                        </div>

                        <div class="offer-stars">

                            ${stars}

                        </div>

                        <span class="offer-tag">

                            ${offer.level}

                        </span>

                    </div>

                </div>


                <div class="offer-text">

                    「${offer.text}」

                </div>


                <div class="offer-info">

                    合約：${offer.years} 年

                    <br>

                    隊伍目前需求：
                    ${offer.team.need}

                </div>


                <div class="offer-actions">

                    <button
                        class="decline"
                        onclick="declineOffer(${index})"
                    >
                        拒絕
                    </button>

                    <button
                        class="accept"
                        onclick="acceptOffer(${index})"
                    >
                        接受
                    </button>

                </div>

            </div>

            `;

        }).join("");


    document
        .getElementById("offerOverlay")
        .classList.add("show");

}


function declineOffer(index){

    game.offers.splice(index,1);


    if(game.offers.length===0){

        document
            .getElementById("offerOverlay")
            .classList.remove("show");


        advanceQuarter();

        createNextEvent();

        render();

        showToast(
            "你決定繼續自由市場"
        );

    }

    else{

        showOffers();

    }

}


function acceptOffer(index){

    const offer=
        game.offers[index];


    game.pro={

        team:
            offer.team.name,

        league:
            offer.team.league,

        level:
            offer.level,

        stars:
            offer.team.stars,

        professionalRating:
            calculateProfessionalRating()

    };


    game.offers=[];


    document
        .getElementById("offerOverlay")
        .classList.remove("show");


    addHistory(

        `接受 ${offer.team.name} 的 ${offer.level} Offer，加入 ${offer.team.league}。`

    );


    advanceQuarter();

    createNextEvent();

    render();


    showToast(
        "Offer 已接受"
    );

}


/* =====================================================

===================================================== */

function advanceQuarter(){

    game.quarter++;


    if(game.quarter>4){

        game.quarter=1;

        game.year++;

        game.age++;


        /*
           職業衰退：
           Rank 不再參與，
           只看能力。
        */

        if(game.pro){

            Object.keys(
                game.stats
            ).forEach(key=>{

                if(game.stats[key]>75){

                    game.stats[key]=
                        Math.max(
                            1,
                            game.stats[key]-1
                        );

                }

            });


            game.pro.professionalRating=
                calculateProfessionalRating();

        }

    }

}


/* =====================================================
   生涯紀錄
===================================================== */

function addHistory(text){

    if(!text)
        return;


    game.history.push({

        year:game.year,

        quarter:game.quarter,

        text

    });

}


/* =====================================================
   上一步
===================================================== */

function undoDecision(){

    if(!game.previousState){

        showToast(
            "目前沒有可以回退的決策"
        );

        return;

    }


    game=
        clone(game.previousState);


    game.previousState=null;


    createNextEvent();

    render();


    showToast(
        "已回到上一個決策"
    );

}


/* =====================================================
   ←
===================================================== */

function goBack(){

    const allocation=
        document
        .getElementById(
            "allocationOverlay"
        );


    const offer=
        document
        .getElementById(
            "offerOverlay"
        );


    if(
        allocation.classList.contains("show")
    ){

        cancelAllocation();

        return;

    }


    if(
        offer.classList.contains("show")
    ){

        offer.classList.remove("show");

        return;

    }


    showToast(
        "目前已經在主頁"
    );

}


/* =====================================================
   加點
===================================================== */

function openAllocation(){

    allocationDraft={

        stats:
            clone(game.stats),

        points:
            game.points

    };


    renderAllocation();


    document
        .getElementById(
            "allocationOverlay"
        )
        .classList.add("show");

}


function cancelAllocation(){

    allocationDraft=null;


    document
        .getElementById(
            "allocationOverlay"
        )
        .classList.remove("show");

}


function addPoint(stat){

    const value=
        allocationDraft.stats[stat];

    const limit=
        game.limits[stat];


    if(value>=limit){

        showToast(
            "已達軟上限"
        );

        return;

    }


    const cost=
        pointCost(
            value,
            limit
        );


    if(
        allocationDraft.points<
        cost
    ){

        showToast(
            `需要 ${cost} AP`
        );

        return;

    }


    allocationDraft.points-=cost;

    allocationDraft.stats[stat]++;


    renderAllocation();

}


function removePoint(stat){

    const current=
        allocationDraft.stats[stat];

    const original=
        game.stats[stat];


    /*
       只能退回本次加的，
       不會讓玩家把原本能力洗掉。
    */

    if(current<=original){

        showToast(
            "只能退回本次分配的點"
        );

        return;

    }


    allocationDraft.stats[stat]--;

    allocationDraft.points+=
        pointCost(
            current-1,
            game.limits[stat]
        );


    renderAllocation();

}


function confirmAllocation(){

    game.stats=
        clone(
            allocationDraft.stats
        );


    game.points=
        allocationDraft.points;


    allocationDraft=null;


    document
        .getElementById(
            "allocationOverlay"
        )
        .classList.remove("show");


    render();


    showToast(
        "養成分配完成"
    );

}


function renderAllocation(){

    document
        .getElementById(
            "allocationPoints"
        )
        .textContent=
        allocationDraft.points+" AP";


    const container=
        document.getElementById(
            "allocations"
        );


    container.innerHTML=
        Object.keys(STAT_NAMES)
        .map(stat=>{

            const value=
                allocationDraft.stats[stat];

            const original=
                game.stats[stat];

            const limit=
                game.limits[stat];

            const cost=
                pointCost(
                    value,
                    limit
                );

            const added=
                value-original;


            return `

            <div class="allocation">

                <div>

                    <span class="allocation-name">

                        ${STAT_NAMES[stat]}

                    </span>

                    <span class="allocation-value">

                        ${value}/${limit}

                    </span>

                    <div class="allocation-desc">

                        下一點 ${cost} AP

                        ${
                            added
                            ?
                            ` · 本次 +${added}`
                            :
                            ""
                        }

                    </div>

                </div>


                <div class="alloc-buttons">

                    <button
                        class="minus"
                        onclick="removePoint('${stat}')"
                        ${added?"":"disabled"}
                    >
                        −
                    </button>

                    <button
                        class="plus"
                        onclick="addPoint('${stat}')"
                        ${
                            value<limit &&
                            allocationDraft.points>=cost
                            ?
                            ""
                            :
                            "disabled"
                        }
                    >
                        +
                    </button>

                </div>

            </div>

            `;

        }).join("");

}


/* =====================================================
   存檔
===================================================== */

function saveGame(){

    localStorage.setItem(

        "lolCareerSave",

        JSON.stringify(game)

    );


    showToast(
        "已儲存生涯"
    );

}


/* =====================================================
   讀取
===================================================== */

function loadGame(){

    const saved=
        localStorage.getItem(
            "lolCareerSave"
        );


    if(!saved)
        return false;


    try{

        game=
            JSON.parse(saved);


        if(!game.started)
            return false;


        document
            .getElementById(
                "startScreen"
            )
            .style.display="none";


        if(!game.event){

            createNextEvent();

        }


        return true;

    }

    catch(error){

        localStorage.removeItem(
            "lolCareerSave"
        );

        return false;

    }

}


/* =====================================================
   UI
===================================================== */

function render(){

    document
        .getElementById("playerName")
        .textContent=
        game.name ||
        "未命名";


    document
        .getElementById("playerId")
        .textContent=
        game.id
        ?
        "@"+game.id
        :
        "@PLAYER";


    document
        .getElementById("playerMeta")
        .textContent=
        `${game.region} · ${game.role} · ${game.age}歲`;


    document
        .getElementById("season")
        .textContent=
        `${game.year} Q${game.quarter}`;


    document
        .getElementById("rankLabel")
        .textContent=
        game.pro
        ?
        "職業 RATING"
        :
        "RANK";


    document
        .getElementById("rankValue")
        .textContent=
        game.pro
        ?
        game.pro.professionalRating
        :
        game.lp;


    document
        .getElementById("points")
        .textContent=
        game.points;


    renderStats();


    document
        .getElementById("kicker")
        .textContent=
        `${game.year} · 第 ${game.quarter} 季`;


    document
        .getElementById("eventTitle")
        .textContent=
        game.event
        ?
        game.event.title
        :
        "";


    document
        .getElementById("eventType")
        .textContent=
        game.event
        ?
        game.event.type
        :
        "";


    document
        .getElementById("story")
        .textContent=
        game.event
        ?
        game.event.story
        :
        "";


    renderChoices();

    renderClub();

    renderHistory();

}


function renderStats(){

    const container=
        document.getElementById(
            "stats"
        );


    container.innerHTML=
        Object.keys(STAT_NAMES)
        .map(stat=>{

            const value=
                game.stats[stat];

            const limit=
                game.limits[stat];


            return `

            <div class="stat">

                <div class="stat-top">

                    <span>
                        ${STAT_NAMES[stat]}
                    </span>

                    <span>
                        ${value}/${limit}
                    </span>

                </div>


                <div class="bar">

                    <div
                        class="bar-fill"
                        style="
                        width:${Math.min(
                            100,
                            value/limit*100
                        )}%;
                        "
                    ></div>

                </div>


                <div class="stat-bottom">

                    <span>
                        距上限 ${limit-value}
                    </span>

                    <span>
                        下一點 ${pointCost(
                            value,
                            limit
                        )}
                    </span>

                </div>

            </div>

            `;

        }).join("");

}


function renderChoices(){

    const container=
        document.getElementById(
            "choices"
        );


    if(!game.event){

        container.innerHTML="";

        return;

    }


    container.innerHTML=
        game.event.choices
        .map(choice=>{

            return `

            <button
                class="choice"
                onclick="
                makeDecision(
                    '${choice.action}'
                )
                "
            >

                <div class="choice-icon">

                    ${choice.icon}

                </div>


                <div>

                    <div class="choice-title">

                        ${choice.title}

                    </div>


                    <div class="choice-desc">

                        ${choice.desc}

                    </div>


                    <span class="reward">

                        ${choice.reward}

                    </span>

                </div>


                <div class="arrow">
                    ›
                </div>

            </button>

            `;

        }).join("");

}


function renderClub(){

    const box=
        document.getElementById(
            "clubBox"
        );


    if(game.pro){

        const stars=
            "★".repeat(
                game.pro.stars
            )+
            "☆".repeat(
                5-game.pro.stars
            );


        box.innerHTML=`

        <div class="club">

            <div class="club-head">

                <div class="club-name">

                    ${game.pro.team}

                </div>

                <div class="stars">

                    ${stars}

                </div>

            </div>


            <div class="club-desc">

                ${game.pro.league}

                ·

                ${game.pro.level}

                ·

                職業評分
                ${game.pro.professionalRating}

            </div>

        </div>

        `;

        return;

    }


    if(game.school){

        const stars=
            "★".repeat(
                game.school.stars
            )+
            "☆".repeat(
                5-game.school.stars
            );


        box.innerHTML=`

        <div class="club">

            <div class="club-head">

                <div class="club-name">

                    ${game.school.name}

                </div>

                <div class="stars">

                    ${stars}

                </div>

            </div>


            <div class="club-desc">

                校隊提供賽訓與校際賽。
                名聲仍需要靠正式比賽打出來。

            </div>

        </div>

        `;

        return;

    }


    box.innerHTML="";

}


function renderHistory(){

    const container=
        document.getElementById(
            "history"
        );


    container.innerHTML=
        game.history
        .slice()
        .reverse()
        .map(row=>{

            return `

            <div class="history-row">

                <div class="history-date">

                    ${row.year}
                    Q${row.quarter}

                </div>

                <div class="history-text">

                    ${row.text}

                </div>

            </div>

            `;

        }).join("");

}


/* =====================================================
   啟動
===================================================== */

window.addEventListener(
    "load",
    ()=>{

        const loaded=
            loadGame();


        if(!loaded){

            document
                .getElementById(
                    "startScreen"
                )
                .style.display="flex";

        }


        render();

    }
);

</script>

</body>
</html>
