<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LoL 電競人生模擬器</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#0b1020;
    color:#e8edf7;
    font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;
}

button,input,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    max-width:1050px;
    margin:auto;
    min-height:100vh;
    padding-bottom:90px;
}

/* ===== 頂部 ===== */

.top{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(11,16,32,.94);
    backdrop-filter:blur(12px);
    border-bottom:1px solid #252d43;
    padding:14px 18px;
}

.topline{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.name{
    font-weight:800;
    font-size:19px;
}

.sub{
    color:#8d98ae;
    font-size:12px;
    margin-top:3px;
}

.age{
    background:#1b2438;
    padding:7px 11px;
    border-radius:999px;
    font-size:13px;
}

/* ===== 主畫面 ===== */

main{
    padding:16px;
}

.card{
    background:#12192a;
    border:1px solid #252e45;
    border-radius:16px;
    padding:16px;
    margin-bottom:14px;
}

.card-title{
    font-size:15px;
    font-weight:800;
    margin-bottom:12px;
}

.section-title{
    font-size:20px;
    font-weight:900;
    margin:8px 0 5px;
}

.muted{
    color:#8f9ab0;
}

/* ===== 能力膠囊 ===== */

.stat{
    margin:12px 0;
}

.stat-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
}

.stat-name{
    font-weight:700;
}

.stat-value{
    color:#b8c4dc;
    font-size:13px;
}

.bar{
    height:10px;
    background:#202a40;
    border-radius:999px;
    overflow:hidden;
}

.fill{
    height:100%;
    border-radius:999px;
    background:linear-gradient(90deg,#536dfe,#8b9cff);
}

.distance{
    font-size:11px;
    color:#7f8ba3;
    margin-top:4px;
}

/* ===== 風格 ===== */

.style-box{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:12px;
    background:#0e1526;
    border-radius:12px;
}

.style-main{
    font-size:18px;
    font-weight:900;
}

.style-tag{
    color:#aebbd4;
    font-size:12px;
}

/* ===== 俱樂部 ===== */

.club-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
}

.club{
    background:#0e1526;
    border:1px solid #273149;
    border-radius:14px;
    padding:13px;
}

.club-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.club-name{
    font-size:17px;
    font-weight:900;
}

.region{
    font-size:11px;
    color:#8793ab;
    margin-top:2px;
}

.stars{
    letter-spacing:1px;
    white-space:nowrap;
}

.club-desc{
    color:#a7b1c6;
    font-size:12px;
    line-height:1.5;
    margin:10px 0;
}

.club-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
}

.info{
    background:#161e31;
    padding:7px;
    border-radius:8px;
}

.info b{
    display:block;
    font-size:12px;
}

.info span{
    color:#8f9ab0;
    font-size:11px;
}

.club-action{
    width:100%;
    margin-top:10px;
    border:0;
    background:#29375b;
    color:white;
    border-radius:9px;
    padding:9px;
}

.club-action:hover{
    background:#394d7c;
}

/* ===== 選項 ===== */

.choice{
    width:100%;
    text-align:left;
    border:1px solid #29344d;
    background:#10182a;
    color:#e8edf7;
    border-radius:12px;
    padding:12px;
    margin-top:8px;
}

.choice:hover{
    background:#18233a;
}

.choice-title{
    font-weight:800;
}

.choice-effect{
    color:#8f9ab0;
    font-size:12px;
    margin-top:4px;
}

/* ===== 建立角色 ===== */

.input{
    width:100%;
    padding:11px;
    background:#0d1424;
    border:1px solid #2b3650;
    color:white;
    border-radius:9px;
    margin-top:6px;
    outline:none;
}

.input:focus{
    border-color:#627cff;
}

.option-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:8px;
}

.option{
    border:1px solid #29344d;
    background:#10182a;
    color:#dce4f5;
    border-radius:10px;
    padding:10px;
}

.option.active{
    border-color:#7387ff;
    background:#202b4c;
}

.primary{
    width:100%;
    border:0;
    background:#536dfe;
    color:white;
    border-radius:10px;
    padding:12px;
    margin-top:12px;
    font-weight:800;
}

/* ===== 底部導覽 ===== */

.bottom{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:min(1050px,100%);
    background:rgba(12,17,31,.96);
    border-top:1px solid #252e45;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    z-index:30;
}

.bottom button{
    border:0;
    background:none;
    color:#8793ab;
    padding:12px 5px;
    font-size:12px;
}

.bottom button.active{
    color:#dce4ff;
}

/* ===== 響應式 ===== */

@media(max-width:650px){
    .app{
        width:100%;
    }

    main{
        padding:11px;
    }

    .card{
        padding:13px;
        border-radius:13px;
    }

    .club-grid{
        grid-template-columns:1fr;
    }

    .option-row{
        grid-template-columns:1fr;
    }

    .section-title{
        font-size:18px;
    }
}

@media(min-width:651px){
    .two-col{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:14px;
    }
}

.hidden{
    display:none!important;
}
</style>
</head>

}


function startGame(){

    if(!player.name.trim()){

    }

    if(!player.id.trim()){

        alert("請選擇主要位置");
        return;
    }

    showScreen("life");

/* =========================================================
   風格判定
========================================================= */

function calculateStyle(){

    const s = player.stats;

    const arr = [
        ["操作型",s.operation],
        ["理解型",s.gameSense],
        ["心態型",s.mentality],
        ["體能型",s.stamina]
    ];

    arr.sort((a,b)=>b[1]-a[1]);

    if(arr[0][1] < 60){
        return "尚未定型";
    }

    if(arr[0][1] - arr[1][1] >= 12){
        return arr[0][0];
    }

    if(
        s.operation>=65 &&
        s.gameSense>=65 &&
        s.mentality>=65 &&
        s.stamina>=65
    ){
        return "穩定型";
    }

    return "均衡型";
}

========================================================= */

function stat(name,value){

    return `
        <div class="stat">

            <div class="stat-head">
                <span class="stat-name">${name}</span>
                <span class="stat-value">${value} / 100</span>
            </div>

            <div class="bar">

                    class="fill"
                    style="width:${value}%">
                </div>
            </div>

            <div class="distance">
                距離登頂還差 ${100-value}
            </div>

        </div>
    `;
}

            </div>

            <div class="choice-effect">
                尋找適合自己的職業道路
            </div>

        </button>

    </div>

    `;
}


/* =========================================================
   訓練
========================================================= */

function train(){

    player.stats.operation = Math.min(
        100,
        player.stats.operation + 2
    );

    player.stats.gameSense = Math.min(
        100,
        player.stats.gameSense + 1
    );

    alert("你完成了一次賽訓。");
    render();
}


/* =========================================================
   俱樂部
========================================================= */

function clubScreen(){

    const available = CLUBS
        .filter(c=>c.region===player.region);

    const overseas = CLUBS
        .filter(c=>c.region!==player.region);

    return `

    <div class="section-title">俱樂部市場</div>

    <div class="muted">
        你目前出身於 ${player.region}。
        青訓邀請會優先從本賽區出現。
    </div>


    <div class="card">

        <div class="card-title">
            🏠 本賽區俱樂部
        </div>

        <div class="club-grid">

            ${
                available.length
                ?
                available.map(clubCard).join("")
                :
                `<div class="muted">
                    目前沒有可顯示的俱樂部。
                </div>`
            }

        </div>

    </div>


    <div class="card">

        <div class="card-title">
            🌏 海外俱樂部
        </div>

        <div class="club-grid">

            ${
                overseas.slice(0,8)
                .map(clubCard)
                .join("")
            }

        </div>

    </div>

    `;
}


function clubCard(c){

    const stars = "★".repeat(c.stars)
        + "☆".repeat(5-c.stars);

    const role = player.role.toLowerCase();

    const starterChance =
        Math.max(
            5,
            Math.min(
                95,
                50 + (player.stats.operation - (c.roster[role] || 80)) * 2
            )
        );

    let status = "";

    if(starterChance >= 70){
        status = "🟢 有機會競爭先發";
    }
    else if(starterChance >= 40){
        status = "🟡 需要競爭";
    }
    else{
        status = "🔴 先發競爭激烈";
    }

    return `

    <div class="club">

        <div class="club-top">

            <div>
                <div class="club-name">
                    ${c.name}
                </div>

                <div class="region">
                    ${c.region} ・ ${c.titles}
                </div>
            </div>

            <div class="stars">
                ${stars}
            </div>

        </div>


        <div class="club-desc">
            ${c.desc}
        </div>


        <div class="club-info">

            <div class="info">
                <b>青訓 ${"★".repeat(c.academy)}</b>
                <span>新人培養</span>
            </div>

            <div class="info">
                <b>國際 ${"★".repeat(c.international)}</b>
                <span>海外競爭力</span>
            </div>

            <div class="info">
                <b>${status}</b>
                <span>預估先發 ${Math.round(starterChance)}%</span>
            </div>

            <div class="info">
                <b>${c.stars>=5?"冠軍熱門":c.stars>=4?"競爭者":"挑戰者"}</b>
                <span>戰隊強度</span>
            </div>

        </div>


        <button
            class="club-action"
            onclick="joinClub('${c.id}')">

            查看邀請

        </button>

    </div>

    `;
}


/* =========================================================
   加入俱樂部
========================================================= */

function joinClub(id){

    const club = CLUBS.find(c=>c.id===id);

    if(!club)return;

    player.club = club.id;

    alert(
        `你收到了 ${club.name} 的邀請。\\n\\n` +
        `戰隊強度：${club.stars}/5\\n` +
        `青訓：${club.academy}/5`
    );

    showScreen("life");
}


/* =========================================================
   存檔
========================================================= */

function saveGame(){

    localStorage.setItem(
        "lolLifeSave",
        JSON.stringify(player)
    );

    alert("已存檔。");
}


function loadGame(){

    const data = localStorage.getItem("lolLifeSave");

    if(!data){
        alert("目前沒有存檔。");
        return;
    }

    player = JSON.parse(data);

    alert("已讀取存檔。");

    showScreen("life");
}


function resetGame(){

    if(!confirm("確定要重置目前遊戲？"))return;

    localStorage.removeItem("lolLifeSave");

    location.reload();
}


function saveScreen(){

    return `

    <div class="section-title">存檔</div>

    <div class="card">

        <div class="card-title">
            ${player.name || "尚未建立選手"}
        </div>

        <button
            class="choice"
            onclick="saveGame()">

            💾 儲存目前進度

        </button>

        <button
            class="choice"
            onclick="loadGame()">

            📂 讀取存檔

        </button>

        <button
            class="choice"
            onclick="resetGame()">

            🔄 重置遊戲

        </button>

    </div>

    <div class="card">

        <div class="card-title">
            存檔規則
        </div>

        <div class="muted" style="line-height:1.6">
            每次重新開啟遊戲時，預設都是新的電競人生。
            只有玩家主動讀取存檔，才會恢復之前的進度。
        </div>

    </div>

    `;
}


/* =========================================================
   畫面
========================================================= */

function showScreen(screen){

    document.querySelectorAll(".bottom button")
        .forEach(b=>b.classList.remove("active"));

    if(screen==="life"){
        document.getElementById("navLife")
            .classList.add("active");
    }

    if(screen==="club"){
        document.getElementById("navClub")
            .classList.add("active");
    }

    if(screen==="save"){
        document.getElementById("navSave")
            .classList.add("active");
    }

    const el = document.getElementById("screen");

    if(screen==="life"){
        el.innerHTML = player.name
            ? lifeScreen()
            : createScreen();
    }

    if(screen==="club"){
        el.innerHTML = player.name
            ? clubScreen()
            : createScreen();
    }

    if(screen==="save"){
        el.innerHTML = saveScreen();
    }

    updateTop();
}


function updateTop(){

    document.getElementById("topName").textContent =
        player.name || "尚未建立選手";

    document.getElementById("topSub").textContent =
        player.name
        ? `${player.id} · ${player.region} · ${player.role}`
        : "建立你的職業人生";

    document.getElementById("topAge").textContent =
        `${player.age}歲`;
}


function render(){

    showScreen(
        document.querySelector(".bottom button.active")?.id==="navClub"
        ? "club"
        : "life"
    );
}


/* =========================================================
   工具
========================================================= */

function escapeHtml(str){

    return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================================
   啟動
========================================================= */

/*
    注意：
    這裡故意不自動讀取存檔。

    使用者每次開啟網頁：
    → 新人生

    只有按「讀取存檔」：
    → 恢復人生
*/

showScreen("life");

</script>

</body>
</html>
