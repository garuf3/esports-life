<!-- 把原本上半部 CSS 替換成這段 -->
<style>
*{box-sizing:border-box}
:root{
  --bg:#eef1f5;
  --card:#fff;
  --ink:#17202a;
  --muted:#6b7280;
  --line:#dfe4ea;
  --soft:#f6f8fa;
  --dark:#111827;
  --good:#19734a;
  --warn:#9a6500;
  --bad:#b33a3a
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,
  "Noto Sans TC","Microsoft JhengHei",sans-serif
}

button,input,select{font:inherit}
button{cursor:pointer}

.app{
  width:100%;
  max-width:760px;
  margin:auto;
  background:#fff;
  min-height:100vh
}

/* ===== 上半部 HUD ===== */
.top{
  position:sticky;
  top:0;
  z-index:20;
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:8px 10px 9px;
  box-shadow:0 2px 10px rgba(15,23,42,.06)
}

.topline,
.sectionHead,
.teamTop,
.routeTop{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center
}

.brand{
  font-size:11px;
  color:#4b5563;
  font-weight:900;
  letter-spacing:.08em
}

.player{
  font-size:24px;
  line-height:1.05;
  font-weight:950;
  margin-top:5px;
  letter-spacing:-.02em
}

.meta{
  font-size:13px;
  color:#5b6575;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.hudRow{
  display:grid;
  grid-template-columns:1.05fr 1.15fr .8fr;
  gap:6px;
  margin-top:8px
}

.hudCell{
  display:flex;
  align-items:center;
  gap:6px;
  min-width:0;
  padding:7px 8px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--soft)
}

.hudLabel{
  font-size:11px;
  color:var(--muted);
  font-weight:800;
  white-space:nowrap
}

.hudValue{
  font-size:15px;
  font-weight:950;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.hudScore{
  font-size:19px;
  font-weight:950
}

.flowRow{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:7px;
  font-size:12px;
  color:var(--muted);
  font-weight:850;
  white-space:nowrap;
  overflow:hidden
}

.flowDot{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#edf0f3;
  color:#697386;
  font-size:10px;
  font-weight:950;
  flex:0 0 auto
}

.flowDot.on{
  background:#111827;
  color:#fff
}

.flowArrow{
  color:#a0a7b2;
  font-size:11px;
  flex:0 0 auto
}

main{
  padding:10px 12px 24px
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  padding:13px;
  margin-bottom:10px
}

h1{
  font-size:22px;
  line-height:1.2;
  margin:2px 0 5px;
  font-weight:950
}

h2{
  font-size:17px;
  margin:0;
  font-weight:950
}

.small{
  font-size:14px;
  line-height:1.55;
  color:var(--muted)
}

.muted{
  font-size:12px;
  color:var(--muted);
  font-weight:800;
  letter-spacing:.04em
}

.pill{
  display:inline-flex;
  align-items:center;
  padding:5px 8px;
  border-radius:999px;
  background:var(--soft);
  font-size:12px;
  color:var(--muted);
  font-weight:800
}

.hidden{display:none!important}

/* 其餘原本 CSS 保留 */
</style>


<!-- 把原本 header 替換成這段 -->
<header class="top">
  <div class="topline">
    <div class="brand">職業人生模擬器</div>
    <span class="pill" id="phasePill">角色建立</span>
  </div>

  <div class="player" id="playerName">新人選手</div>

  <div class="meta" id="playerMeta">
    本名：—・玩家名：—・APAC・尚未定位
  </div>

  <div class="hudRow">
    <div class="hudCell">
      <span class="hudLabel">位置</span>
      <span class="hudValue" id="hudPosition">—</span>
    </div>

    <div class="hudCell">
      <span class="hudLabel">風格</span>
      <span class="hudValue" id="hudStyle">—</span>
    </div>

    <div class="hudCell">
      <span class="hudLabel">適性</span>
      <span class="hudScore" id="hudFit">—</span>
    </div>
  </div>

  <div class="flowRow">
    <span class="flowDot on" id="flow1">1</span>
    <span>角色</span>

    <span class="flowArrow">→</span>

    <span class="flowDot" id="flow2">2</span>
    <span>選路</span>

    <span class="flowArrow">→</span>

    <span class="flowDot" id="flow3">3</span>
    <span>風格</span>

    <span class="flowArrow">→</span>

    <span class="flowDot" id="flow4">4</span>
    <span>能力</span>
  </div>
</header>


<!-- 把原本 renderHeader() 替換成這段 -->
<script>
function renderHeader(){
  $("playerName").textContent=g.name||"新人選手";

  $("playerMeta").textContent=
    `本名：${g.real||"—"}・玩家名：${g.name||"—"}・${g.region||"APAC"}・${g.position||"尚未定位"}`;

  if($("hudPosition"))
    $("hudPosition").textContent=g.position||"—";

  if($("hudStyle"))
    $("hudStyle").textContent=g.style||"—";

  if($("hudFit")){
    const fit=
      g.position && Number.isFinite(g.positionScores[g.position])
        ? g.positionScores[g.position]
        : "—";

    $("hudFit").textContent=fit;
  }

  const phase=$("phasePill");

  if(phase){
    phase.textContent=
      g.style
        ? "能力已生成"
        : g.position
          ? "選擇風格"
          : g.name
            ? "選擇位置"
            : "角色建立";
  }

  const step=
    g.style
      ? 4
      : g.position
        ? 3
        : g.name
          ? 2
          : 1;

  for(let i=1;i<=4;i++){
    const el=$("flow"+i);
    if(!el)continue;

    el.classList.toggle("on",i<=step);
  }
}
</script>


<!-- 手機版再補這段 -->
<style>
@media(max-width:520px){

  .top{
    padding:8px 9px 9px
  }

  .player{
    font-size:23px
  }

  .meta{
    font-size:13px
  }

  .hudRow{
    grid-template-columns:1fr 1.2fr .75fr;
    gap:5px
  }

  .hudCell{
    padding:7px 6px
  }

  .hudLabel{
    font-size:11px
  }

  .hudValue{
    font-size:14px
  }

  .hudScore{
    font-size:18px
  }

  .flowRow{
    font-size:12px;
    gap:4px
  }

  .flowDot{
    width:18px;
    height:18px
  }

  .small{
    font-size:14px
  }
}
</style>
