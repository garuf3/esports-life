<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>英雄聯盟職業人生模擬器 </title>
<style>
*{box-sizing:border-box}
:root{--bg:#eef1f5;--card:#fff;--text:#172033;--muted:#687386;--line:#dfe4eb;--accent:#5b67f1;--good:#16865b;--warn:#c77a00}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
button{font:inherit}
.hidden{display:none!important}
.app{width:min(100%,760px);margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px #1720330a}
h1,h2,h3,p{margin:0}
h1{font-size:22px}.small{font-size:13px;color:var(--muted);line-height:1.5}.muted{font-size:12px;color:var(--muted)}
.route{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:8px;cursor:pointer}
.route:active{transform:scale(.99)}
.routeTop{display:flex;justify-content:space-between;gap:8px;align-items:center}
.routeDesc{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.45}
.routeDelta{margin-top:8px;font-size:12px}
.effect{font-size:11px;background:#eef0ff;color:#4d59d8;padding:4px 7px;border-radius:999px;white-space:nowrap}
.delta{color:var(--good)}
.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pill{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;background:#f1f3f6;color:#5c6676;font-size:11px}
.statGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px}
.statName{font-size:12px;color:var(--muted)}
.statValue{font-size:22px;font-weight:700;margin-top:3px}
.team{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:10px 0}
.team:first-child{border-top:0}
.attention{font-weight:700}
@media(max-width:520px){
 .app{padding:8px}
 .card{border-radius:14px;padding:12px}
 h1{font-size:20px}
 .statGrid{grid-template-columns:repeat(4,1fr)}
 .stat{padding:8px 5px;text-align:center}
 .statValue{font-size:18px}
}
</style>
</head>
<body>
<div class="app">

<header class="card" id="header">
  <div class="muted">職業人生模擬器 2026</div>
  <h1 id="playerName">新人選手</h1>
  <div class="small" id="playerMeta">尚未選擇位置</div>
</header>

<section id="setup">
  <div class="card">
    <div class="muted">建立玩家</div>
    <h1>你的職業生涯</h1>
    <p class="small">先決定基本資料，再選擇你最適合的位置。</p>
    <div style="margin-top:10px">
      <input id="nameInput" placeholder="玩家名稱" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:10px">
    </div>
    <button class="route" onclick="startSetup()">開始</button>
  </div>
</section>

<section id="position" class="hidden">
  <div class="card">
    <div class="muted">第一步</div>
    <h1>選擇你的主位置</h1>
    <p class="small">選定後主位置會鎖定，不能一直轉路。</p>
    <div id="positionChoices"></div>
  </div>
</section>

<section id="styleSelect" class="hidden">
  <div class="card">
    <div class="muted">遊戲風格</div>
    <h1 id="styleTitle">選擇你的遊戲風格</h1>
    <p class="small" id="styleIntro">選定後才會生成四項隨機素質。</p>
    <div id="styleChoices"></div>
  </div>
</section>

<section id="amateur" class="hidden">
  <div class="card">
    <div class="sectionHead">
      <div>
        <div class="muted">已選遊戲風格</div>
        <h2 id="selectedStyle">—</h2>
      </div>
      <span class="pill">能力已生成</span>
    </div>
    <div class="small" style="margin-top:7px">
      主位置與風格已鎖定；以下選項只影響生涯成長與 Scout 關注。
    </div>
  </div>

  <div class="card">
    <div class="muted">初始能力</div>
    <div class="statGrid" id="stats"></div>
  </div>

  <div class="card" id="scoutPreview">
    <div class="sectionHead">
      <div>
        <div class="muted">初始 Scout 關注</div>
        <h2>有人開始注意你</h2>
      </div>
      <span class="pill">開局觀察</span>
    </div>
    <div id="teamList"></div>
  </div>

  <div class="card">
    <button class="route" onclick="startGrowth()">
      <div class="routeTop">
        <b>開始第一階段</b>
        <span class="effect">進入生涯</span>
      </div>
      <div class="routeDesc">帶著目前的能力與隊伍關注度開始你的職業旅程。</div>
    </button>
  </div>
</section>

<section id="growth" class="hidden">
  <div class="card">
    <div class="muted">第一階段</div>
    <h1>業餘聯賽</h1>
    <p class="small">你的表現會影響能力成長與 Scout 關注。</p>
    <button class="route" onclick="playMatch()">進行比賽</button>
  </div>
</section>

<section id="event" class="hidden">
  <div class="card">
    <div class="muted">賽事事件</div>
    <h1 id="eventTitle">比賽結果</h1>
    <p class="small" id="eventText"></p>
    <button class="route" onclick="finishEvent()">繼續</button>
  </div>
</section>

<section id="result" class="hidden">
  <div class="card">
    <div class="muted">階段結果</div>
    <h1 id="resultTitle">你的排名</h1>
    <p class="small" id="resultText"></p>
    <button class="route" onclick="showOffer()">查看隊伍關注</button>
  </div>
</section>

<section id="offer" class="hidden">
  <div class="card">
    <div class="muted">Scout</div>
    <h1>隊伍邀請</h1>
    <div id="offerList"></div>
  </div>
</section>

</div>

<script>
"use strict";

const $=id=>document.getElementById(id);

const g={
 name:"",
 region:"APAC",
 position:"",
 positionLocked:false,
 positionScores:{},
 style:"",
 op:0,
 iq:0,
 tm:0,
 xp:0,
 attention:{},
 powerRanking:0,
 matches:0,
 wins:0
};

const POSITIONS=[
 {name:"上路",desc:"單帶、對線、邊線壓力"},
 {name:"打野",desc:"節奏、資源控制、支援"},
 {name:"中路",desc:"線權、支援、輸出"},
 {name:"下路",desc:"射手核心、打線、後期"},
 {name:"輔助",desc:"視野、開戰、保排"}
];

const STYLE_POOLS={
 "上路":[
  {n:"打線壓制",d:"偏向強勢對線與單殺，主動製造線上優勢。",bias:{op:.7,iq:.4,tm:.1,xp:.2}},
  {n:"後期大核",d:"以發育與後期團戰輸出為核心。",bias:{op:.4,iq:.5,tm:.4,xp:.7}},
  {n:"開團手段",d:"選擇能主動開戰、承擔團戰第一波壓力的英雄。",bias:{op:.4,iq:.5,tm:.8,xp:.4}},
  {n:"法師專精",d:"偏向特殊法系上路與魔法傷害體系。",bias:{op:.5,iq:.8,tm:.2,xp:.4}}
 ],
 "打野":[
  {n:"前期節奏",d:"快速支援與入侵，利用前期節奏滾雪球。",bias:{op:.6,iq:.8,tm:.5,xp:.3}},
  {n:"資源控制",d:"圍繞龍、預示者與野區經濟建立優勢。",bias:{op:.4,iq:.9,tm:.5,xp:.6}},
  {n:"開戰核心",d:"以團戰先手與找機會為主要任務。",bias:{op:.5,iq:.6,tm:.9,xp:.5}},
  {n:"後期核心",d:"降低前期風險，換取後期更高戰鬥力。",bias:{op:.4,iq:.5,tm:.5,xp:.9}}
 ],
 "中路":[
  {n:"線權壓制",d:"靠對線壓力取得優先權，再支援邊線。",bias:{op:.8,iq:.6,tm:.4,xp:.3}},
  {n:"後期大核",d:"以團戰輸出與後期接管比賽為目標。",bias:{op:.5,iq:.5,tm:.5,xp:.9}},
  {n:"遊走支援",d:"主動離線，創造其他路的數值優勢。",bias:{op:.6,iq:.9,tm:.8,xp:.3}},
  {n:"法師專精",d:"利用法師池與技能組合建立陣容優勢。",bias:{op:.6,iq:.9,tm:.4,xp:.5}}
 ],
 "下路":[
  {n:"打線壓制",d:"利用射程、換血與操作取得線上優勢。",bias:{op:.9,iq:.5,tm:.3,xp:.3}},
  {n:"後期大核",d:"穩定發育，成為後期主要輸出核心。",bias:{op:.7,iq:.5,tm:.5,xp:.9}},
  {n:"開團手段",d:"利用特殊射手或功能型角色提供開戰手段。",bias:{op:.6,iq:.6,tm:.9,xp:.4}},
  {n:"法師專精",d:"擅長法系下路與特殊下路體系。",bias:{op:.6,iq:.9,tm:.4,xp:.5}}
 ],
 "輔助":[
  {n:"開團手段",d:"以先手、控制與強迫團戰為核心。",bias:{op:.6,iq:.7,tm:.9,xp:.4}},
  {n:"保排核心",d:"保護核心輸出，處理敵方進場威脅。",bias:{op:.5,iq:.7,tm:.9,xp:.6}},
  {n:"遊走支援",d:"利用視野與移動創造全圖節奏。",bias:{op:.5,iq:.9,tm:.8,xp:.4}},
  {n:"法師專精",d:"以高輸出法師與遠程消耗建立線權。",bias:{op:.8,iq:.8,tm:.3,xp:.4}}
 ]
};

const TEAMS=[
 {code:"C",alias:"Coral",region:"APAC",power:1280,roles:["下路","中路"],styles:["打線壓制","後期大核"]},
 {code:"T",alias:"Tempest",region:"APAC",power:1240,roles:["上路","打野","輔助"],styles:["開團手段","前期節奏","遊走支援"]},
 {code:"G",alias:"Gale",region:"APAC",power:1190,roles:["中路","下路"],styles:["法師專精","後期大核"]},
 {code:"D",alias:"Drift",region:"APAC",power:1150,roles:["上路","輔助"],styles:["保排核心","開團手段"]},
 {code:"M",alias:"Mavik",region:"APAC",power:1110,roles:["打野","下路"],styles:["資源控制","後期核心"]}
];

function hideAll(){
 ["setup","position","styleSelect","amateur","growth","event","result","offer"]
 .forEach(id=>$(id)?.classList.add("hidden"));
}

function renderHeader(){
 $("playerName").textContent=g.name||"新人選手";
 $("playerMeta").textContent=g.position
  ? `${g.region} · ${g.position}${g.style?" · "+g.style:""}`
  : `${g.region} · 尚未選擇位置`;
}

function startSetup(){
 g.name=$("nameInput").value.trim()||"新人選手";
 renderHeader();
 showPositions();
}

function latentSeed(){
 let n=0;
 for(const c of g.name)n=(n*31+c.charCodeAt(0))%997;
 return n%100;
}

function posScore(p){
 if(Number.isFinite(g.positionScores[p.name]))
  return g.positionScores[p.name];

 const seed=latentSeed();
 const base={
  "上路":68,
  "打野":66,
  "中路":70,
  "下路":69,
  "輔助":65
 }[p.name]||66;

 const jitter=Math.round(Math.random()*8-4);
 const score=Math.min(
  99,
  Math.max(45,Math.round(base+(seed-50)*.35+jitter))
 );

 g.positionScores[p.name]=score;
 return score;
}

function showPositions(){
 hideAll();
 $("position").classList.remove("hidden");

 $("positionChoices").innerHTML=POSITIONS.map(p=>`
  <button class="route" onclick="pickPosition('${p.name}')">
   <div class="routeTop">
    <b>${p.name}</b>
    <span class="effect">${posScore(p)} 適性</span>
   </div>
   <div class="routeDesc">${p.desc}</div>
  </button>
 `).join("");
}

function pickPosition(p){
 if(g.positionLocked)return;
 g.position=p;
 g.positionLocked=true;
 renderHeader();
 showStyleSelect();
}

function showStyleSelect(){
 hideAll();
 $("styleSelect").classList.remove("hidden");

 $("styleTitle").textContent=`${g.position}・選擇遊戲風格`;
 $("styleIntro").textContent=
  "主位置已鎖定。從下面 4 種風格選 1 種，選完才隨機生成四項能力。";

 const pool=STYLE_POOLS[g.position]||[];

 $("styleChoices").innerHTML=pool.map((r,i)=>`
  <button class="route" onclick="chooseStyle(${i})">
   <div class="routeTop">
    <b>${r.n}</b>
    <span class="effect">${stylePrimaryStat(r)}</span>
   </div>
   <div class="routeDesc">${r.d}</div>
   <div class="routeDelta">
    <span class="delta">能力傾向：${styleStatSummary(r)}</span>
   </div>
  </button>
 `).join("");
}

function stylePrimaryStat(r){
 const a=[
  ["op","操作"],
  ["iq","觀念"],
  ["tm","團隊"],
  ["xp","經驗"]
 ];

 a.sort((x,y)=>
  (r.bias[y[0]]||0)-(r.bias[x[0]]||0)
 );

 return a[0][1]+"傾向";
}

function styleStatSummary(r){
 return [
  ["op","操作"],
  ["iq","觀念"],
  ["tm","團隊"],
  ["xp","經驗"]
 ]
 .filter(x=>(r.bias[x[0]]||0)>=.35)
 .map(x=>x[1])
 .join("・")||"均衡";
}

function chooseStyle(index){
 const pool=STYLE_POOLS[g.position]||[];
 const s=pool[index];

 if(!s)return;

 g.style=s.n;

 generateStats(s);
 updateAttention();
 renderHeader();

 hideAll();
 $("amateur").classList.remove("hidden");

 renderAmateur();
 renderTeams();

 $("scoutPreview").classList.remove("hidden");
}

function generateStats(style){
 const base=50;
 const keys=["op","iq","tm","xp"];

 keys.forEach(k=>{
  const bias=style.bias[k]||0;
  const random=Math.floor(Math.random()*21)-10;
  g[k]=Math.min(
   95,
   Math.max(
    35,
    Math.round(base+bias*20+random)
   )
  );
 });
}

function renderAmateur(){
 if($("selectedStyle"))
  $("selectedStyle").textContent=g.style||"—";

 $("stats").innerHTML=[
  ["op","操作"],
  ["iq","觀念"],
  ["tm","團隊"],
  ["xp","經驗"]
 ].map(([k,n])=>`
  <div class="stat">
   <div class="statName">${n}</div>
   <div class="statValue">${g[k]}</div>
  </div>
 `).join("");
}

function updateAttention(){
 TEAMS.forEach((t,i)=>{
  if(g.attention[t.code]==null){
   let value=
    42+
    (t.power-1100)*.018-
    i*.8;

   if(t.region===g.region)value+=5;
   if(t.roles.includes(g.position))value+=7;
   if(t.styles.includes(g.style))value+=8;

   g.attention[t.code]=Math.max(
    10,
    Math.min(89,Math.round(value))
   );
  }
 });
}

function renderTeams(){
 const teams=TEAMS
  .filter(t=>t.region===g.region)
  .sort((a,b)=>
   (g.attention[b.code]||0)-
   (g.attention[a.code]||0)
  );

 $("teamList").innerHTML=teams.map(t=>`
  <div class="team">
   <div>
    <b>${t.alias}</b>
    <div class="small">
     ${t.roles.includes(g.position)?"缺你的主位置":"目前沒有你的主位置需求"}
    </div>
   </div>
   <div class="attention">${g.attention[t.code]}%</div>
  </div>
 `).join("");
}

function startGrowth(){
 hideAll();
 $("growth").classList.remove("hidden");
}

function playMatch(){
 g.matches++;

 const avg=(g.op+g.iq+g.tm+g.xp)/4;
 const chance=Math.max(
  .2,
  Math.min(.85,avg/100)
 );

 const win=Math.random()<chance;

 if(win)g.wins++;

 $("eventTitle").textContent=
  win?"你贏下這場比賽":"你輸掉這場比賽";

 $("eventText").textContent=
  win
   ?"表現讓 Scout 關注度上升。"
   :"這場失利讓部分隊伍暫時降低評價。";

 TEAMS.forEach(t=>{
  let delta=win?2:-1;

  if(t.roles.includes(g.position))delta+=1;
  if(t.styles.includes(g.style))delta+=1;

  g.attention[t.code]=Math.max(
   0,
   Math.min(
    100,
    (g.attention[t.code]||0)+delta
   )
  );
 });

 hideAll();
 $("event").classList.remove("hidden");
}

function finishEvent(){
 const pct=Math.round(
  (g.wins/Math.max(1,g.matches))*100
 );

 $("resultTitle").textContent=
  `贏過 ${pct}% 玩家`;

 $("resultText").textContent=
  `目前戰績 ${g.wins} 勝 ${g.matches-g.wins} 敗。`;

 hideAll();
 $("result").classList.remove("hidden");
}

function teamFit(t){
 const role=(t.roles||[]).includes(g.position)?25:0;
 const style=(t.styles||[]).includes(g.style)?30:0;
 const avg=(g.op+g.iq+g.tm+g.xp)/4;
 const power=Math.max(
  0,
  Math.min(20,(avg+t.power/25-70)/2)
 );
 const attention=g.attention[t.code]||0;

 return role+style+power+attention*.35;
}

function showOffer(){
 const candidates=TEAMS
  .filter(t=>t.region===g.region)
  .sort((a,b)=>teamFit(b)-teamFit(a))
  .slice(0,3);

 $("offerList").innerHTML=candidates.map(t=>`
  <div class="team">
   <div>
    <b>${t.alias}</b>
    <div class="small">
     ${t.roles.includes(g.position)?"符合位置需求":"目前位置需求較低"}
     · 關注 ${g.attention[t.code]||0}%
    </div>
   </div>
   <span class="effect">
    ${teamFit(t)>=70?"高度關注":"持續觀察"}
   </span>
  </div>
 `).join("");

 hideAll();
 $("offer").classList.remove("hidden");
}

renderHeader();
</script>
</body>
</html>
