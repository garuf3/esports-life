<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LoL 電競人生模擬器</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
    background:#07140d;
    color:#eef8f0;
    font-family:
        system-ui,
        -apple-system,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
}

body{
    background:
        radial-gradient(
            circle at top,
            #123621 0%,
            #07140d 48%,
            #040b07 100%
        );
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:min(1050px,100%);
    min-height:100vh;
    margin:auto;
    padding-bottom:84px;
}

/* =========================
   TOP
========================= */

.top{
    position:sticky;
    top:0;
    z-index:50;

    background:rgba(5,18,11,.96);
    backdrop-filter:blur(14px);

    border-bottom:1px solid #285238;

    padding:14px 17px;
}

.topline{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
}

.top-name{
    font-size:18px;
    font-weight:950;
}

.top-sub{
    margin-top:3px;

    color:#8ba893;

    font-size:13px;
}

.age{
    flex:none;

    padding:7px 12px;

    border-radius:999px;

    background:#153522;
    border:1px solid #356246;

    color:#c8e4cf;

    font-size:13px;
    font-weight:800;
}

/* =========================
   MAIN
========================= */

main{
    padding:16px;
}

.title{
    font-size:25px;
    font-weight:950;
    line-height:1.25;
}

.subtitle{
    margin-top:5px;

    color:#8fa995;

    font-size:14px;
    line-height:1.6;
}

.card{
    margin-top:13px;

    padding:16px;

    background:
        linear-gradient(
            145deg,
            rgba(19,48,31,.96),
            rgba(9,25,16,.96)
        );

    border:1px solid #285239;
    border-radius:15px;

    box-shadow:
        0 8px 28px rgba(0,0,0,.2);
}

.card-title{
    margin-bottom:10px;

    font-size:16px;
    font-weight:950;
}

.event-text{
    color:#d9e8dc;

    font-size:15px;
    line-height:1.75;
}

/* =========================
   BACK
========================= */

.back-row{
    margin-bottom:10px;
}

.back{
    padding:9px 13px;

    border:1px solid #315d40;
    border-radius:10px;

    background:#0b2114;

    color:#c7dfcc;

    font-size:13px;
    font-weight:850;
}

.back:hover{
    background:#153721;
}

/* =========================
   TIMELINE
========================= */

.timeline{
    display:grid;
    grid-template-columns:repeat(4,1fr);

    gap:6px;

    margin-top:15px;
}

.phase{
    padding:9px 6px;

    text-align:center;

    border-radius:10px;

    border:1px solid #234a30;

    background:#081910;

    color:#627968;

    font-size:12px;
}

.phase.done{
    background:#173b24;
    color:#b8d9bf;
}

.phase.active{
    background:#2d7042;
    border-color:#64aa75;

    color:white;

    font-weight:950;
}

.phase-lock{
    margin-top:3px;

    font-size:10px;

    opacity:.7;
}

/* =========================
   PROGRESS
========================= */

.progress-box{
    margin-top:13px;
}

.progress-head{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:6px;

    font-size:13px;
}

.progress-head b{
    font-size:14px;
}

.progress{
    height:11px;

    background:#16281d;

    border-radius:999px;

    overflow:hidden;
}

.progress-fill{
    height:100%;

    background:
        linear-gradient(
            90deg,
            #317947,
            #6fc27e
        );

    border-radius:999px;
}

.progress-text{
    margin-top:5px;

    color:#718878;

    font-size:12px;
}

/* =========================
   STATS
========================= */

.stat{
    margin-top:17px;
}

.stat:first-child{
    margin-top:0;
}

.stat-head{
    display:flex;
    justify-content:space-between;
    align-items:end;

    margin-bottom:7px;
}

.stat-name{
    font-size:14px;
    font-weight:900;
}

.stat-number{
    color:#d7ebdc;

    font-size:18px;
    font-weight:950;
}

.bar{
    height:12px;

    background:#16281d;

    border-radius:999px;

    overflow:hidden;
}

.fill{
    height:100%;

    background:
        linear-gradient(
            90deg,
            #347d4b,
            #6dc07b
        );

    border-radius:999px;
}

.distance{
    margin-top:5px;

    color:#78917e;

    font-size:12px;
}

/* =========================
   BUTTON
========================= */

.primary{
    width:100%;

    margin-top:13px;

    padding:13px;

    border:0;
    border-radius:11px;

    background:#398a53;

    color:white;

    font-size:15px;
    font-weight:950;
}

.primary:hover{
    background:#48a764;
}

.primary:disabled{
    background:#1c2d22;
    color:#607266;

    cursor:not-allowed;
}

.secondary{
    width:100%;

    margin-top:8px;

    padding:11px;

    border-radius:10px;

    background:#0b1d12;

    border:1px solid #315b3d;

    color:#cde1d1;

    font-size:14px;
    font-weight:850;
}

.secondary:hover{
    background:#153321;
}

/* =========================
   CHOICES
========================= */

.choice{

    margin-top:8px;

    padding:12px;

    text-align:left;

    border:1px solid #31583c;

    background:#091a10;

}

.choice:hover{

}

.choice.active{

.choice-title{

    font-weight:950;
}

.choice-effect{

    font-size:12px;

}

/* =========================

========================= */

.result{

    background:#0a1b11;

}

.result-title{

    font-weight:950;
}

.result-text{

}

.result-data{

}

.result-item{

.result-item span{

/* =========================

.club-name{

.club-region{

.stars{

.club-desc{

.club-stats{

.club-stat{

.club-stat b{

.club-stat span{

    font-size:10px;
}

.club-status{

    font-size:11px;
    line-height:1.45;
}

.good{

.mid{

    color:#d8c87e;
}

.bad{

    color:white;

    font-size:12px;
    font-weight:900;

/* =========================

.input{

    color:#f1fff4;

    border:1px solid #2b5738;
    border-radius:10px;

    outline:none;

    font-size:14px;
}

.input:focus{

}

.option-grid{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:8px;

    margin-top:10px;
}

.option{
    padding:11px 7px;

    border-radius:10px;

    background:#091a10;

    border:1px solid #2b5437;

    color:#bdd0c2;

    font-size:13px;
}

.option.active{

    color:white;

    margin-top:3px;

    color:#708976;

    font-size:10px;

.option.active small{

}

.status{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.status span{

    border-radius:999px;

    background:#102319;

    color:#647b6b;

    font-size:11px;

.status span.done{

    color:#c4e5ca;
}

/* =========================
   SAVE
========================= */

.save-info{
    color:#a8bcae;

    font-size:14px;
    line-height:1.7;
}

/* =========================
   BOTTOM
========================= */

.bottom{
    position:fixed;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    width:min(1050px,100%);

    height:68px;

    display:grid;

    grid-template-columns:repeat(3,1fr);

    background:rgba(5,16,10,.98);

    border-top:1px solid #285039;

    z-index:100;
}

.nav{
    border:0;

    background:none;

    color:#657c6c;

    font-size:12px;
}

.nav.active{
    color:#d0ead5;
}

.nav:disabled{
    color:#2b3d31;

    cursor:not-allowed;
}

.nav-icon{
    display:block;

    margin-bottom:2px;

    font-size:20px;
}

/* =========================
   DESKTOP
========================= */

@media(min-width:700px){

    .two-column{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:12px;
    }

}

/* =========================
   MOBILE
========================= */

@media(max-width:699px){

    main{
        padding:12px;
    }

    .club-grid{
        grid-template-columns:1fr;
    }

    .two-column{
        display:block;
    }

}

@media(max-width:420px){

    .timeline{
        gap:4px;
    }

    .phase{
        padding:8px 3px;

        font-size:10px;
    }

    .phase-lock{
        font-size:9px;
    }

    .option-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .result-data{
        grid-template-columns:1fr 1fr;
    }

    .detail-grid{
        grid-template-columns:1fr 1fr;
    }

}
</style>
</head>

/* =========================================================
   PLAYER
========================================================= */

function defaultPlayer(){

    return {

        created:false,

        name:"",
        id:"",

        region:"",
        role:"",

        age:17,
        year:2026,

        phase:0,

        phaseDone:false,

        currentChoice:null,

        club:null,

        language:0,

        styleScores:{
            carry:0,
            control:0,
            utility:0,
            mage:0,
            marksman:0
        },

        stats:{
            operation:48,
            gameSense:45,
            mentality:47,
            stamina:50
        },

        season:{
            games:0,
            wins:0,
            rating:0
        },

        history:[]

    };

}


let player=defaultPlayer();

let currentPage="life";

let currentClub=null;


/* =========================================================
   HELPERS
========================================================= */

function clamp(value,min,max){

    return Math.max(
        min,
        Math.min(max,value)
    );

}


function growthCost(value){

    if(value<50) return 1;

    if(value<70) return 2;

    if(value<85) return 3;

    if(value<95) return 5;

    return 8;

}


function addStat(stat,amount){

    let cost=growthCost(
        player.stats[stat]
    );

    let real=amount;

    if(amount>0){

        real=
            Math.max(
                1,
                Math.floor(
                    amount/cost
                )
            );

    }

    player.stats[stat]=
        clamp(
            player.stats[stat]+real,
            0,
            100
        );

}


/* =========================================================
   TOP
========================================================= */

function updateTop(){

    document.getElementById(
        "topName"
    ).textContent=
        player.created
        ? `${player.name}「${player.id}」`
        : "尚未建立選手";


    if(player.created){

        const phase=
            PHASES[player.phase];

        document.getElementById(
            "topSub"
        ).textContent=
            `${player.region} · ${player.role} · ${player.year} ${phase.short}`;

    }
    else{

        document.getElementById(
            "topSub"
        ).textContent=
            "建立你的職業人生";

    }


    document.getElementById(
        "topAge"
    ).textContent=
        `${player.age}歲`;

}


/* =========================================================
   NAV
========================================================= */

function enableNav(){

    document.getElementById(
        "navClub"
    ).disabled=false;

    document.getElementById(
        "navSave"
    ).disabled=false;

}


function disableNav(){

    document.getElementById(
        "navClub"
    ).disabled=true;

    document.getElementById(
        "navSave"
    ).disabled=true;

}


function setActiveNav(id){

    document
        .querySelectorAll(".nav")
        .forEach(
            x=>x.classList.remove("active")
        );

    if(id){

        document
            .getElementById(id)
            .classList.add("active");

    }

}


/* =========================================================
   NAVIGATION
========================================================= */

function navigate(page){

    if(!player.created){

        renderCreate();

        return;

    }


    currentPage=page;


    if(page==="life"){

        setActiveNav("navLife");

        renderLife();

    }


    if(page==="club"){

        setActiveNav("navClub");

        renderClubList();

    }


    if(page==="save"){

        setActiveNav("navSave");

        renderSave();

    }


    updateTop();

}

function selectRegion(region){

    player.region=region;

    document
        .querySelectorAll("[data-region]")
        .forEach(
            button=>{
                button.classList.toggle(
                    "active",
                    button.dataset.region===region
                );
            }
        );

    updateCreate();

}


function selectRole(role){

    player.role=role;

    document
        .querySelectorAll("[data-role]")
        .forEach(
            button=>{
                button.classList.toggle(
                    "active",
                    button.dataset.role===role
                );
            }
        );

    updateCreate();

}


function createPlayer(){

    updateCreate();

        !player.id ||
        !player.region ||

    player.created=true;

    enableNav();

    navigate("life");

/* =========================================================
   SPRING SIM
========================================================= */

function simulateSpring(){

    const power=
        (
            player.stats.operation+
            player.stats.gameSense+
            player.stats.mentality
        )/3;


    const base=
        45+
        (power-50)*1.1;


    const variance=
        Math.random()*18-9;


    const winRate=
        clamp(
            Math.round(
                base+variance
            ),
            20,
            85
        );


    const games=16;

    const wins=
        Math.round(
            games*winRate/100
        );


    const rating=
        clamp(
            5+
            (winRate-45)/15+
            Math.random(),
            4.5,
            9
        );


    player.season.games+=games;
    player.season.wins+=wins;
    player.season.rating=
        rating;


    player.history.push({

        year:player.year,

        phase:"春季賽",

        text:
            `你完成了春季賽。\
            隊伍 ${wins} 勝 ${games-wins} 敗，\
            個人平均評分 ${rating.toFixed(1)}。`,

        winRate

    });


    player.phaseDone=true;

    player.currentChoice=null;


    renderPhaseResult();

}

                </div>

            </div>

            `
            : ""
        }

    </div>


    <button
        class="primary"
        onclick="advanceTime()">

</div>

/* =========================================================
   ADVANCE TIME
========================================================= */

function advanceTime(){

    if(
        !player.phaseDone
    ){

        return;

    }


    if(
        player.phase<3
    ){

        player.phase++;

        player.phaseDone=false;

        player.currentChoice=null;

        renderLife();

        return;

    }


    /* YEAR END */

    player.year++;
    player.age++;

    player.phase=0;

    player.phaseDone=false;

    player.currentChoice=null;

    player.season={
        games:0,
        wins:0,
        rating:0
    };


    player.history.push({

        year:player.year,

        phase:"新年度",

        text:
            `你迎來 ${player.year} 年。\
            新的一年，所有故事重新開始。`

    });


    renderLife();

}

function clubCard(club){

    const stars=
        "★".repeat(club.stars)+
        "☆".repeat(5-club.stars);


    const roster=
        club.roster[player.role] || 80;


    const ability=
        Math.round(
            (
                player.stats.operation+
                player.stats.gameSense+
                player.stats.mentality
            )/3
        );


    let chance=
        50+
        (ability-roster)*2;


    chance=
        clamp(
            chance,
            5,
            95
        );


    let status;

    let cls;


    if(chance>=70){

        status="先發競爭力高";
        cls="good";

    }
    else if(chance>=40){

        status="可能從青訓／替補開始";
        cls="mid";

    else{

    return `

        </div>

                ${roster}

        }

function saveGame(){

    localStorage.setItem(
        "lolLifeSave",
        JSON.stringify(player)
    );

    alert("進度已儲存。");

}


function loadGame(){

    const raw=
        localStorage.getItem(
            "lolLifeSave"
        );


    if(!raw){

        alert(
            "目前沒有存檔。"
        );

        return;

    }


    try{

        player=
            JSON.parse(raw);

        player.created=true;

        enableNav();

        navigate("life");

    }
    catch(error){

        alert(
            "存檔讀取失敗。"
        );

    }

}


function resetGame(){

    if(
        !confirm(
            "確定要重置遊戲嗎？目前尚未儲存的進度會消失。"
        )
    ){

        return;

    }


    player=
        defaultPlayer();


    currentPage="life";

    currentClub=null;

    disableNav();

    renderCreate();

}
