<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 電競人生模擬器</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111318;
    color: #eee;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
}

#app {
    width: 94%;
    max-width: 1000px;
    margin: 25px auto 50px;
}

.panel {
    background: #20232a;
    border: 1px solid #343841;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 12px;
}

button {
    font-family: inherit;
    cursor: pointer;
}

/* =========================
   開始畫面
========================= */

.setup h1 {
    margin-top: 0;
}

.desc {
    color: #aaa;
    line-height: 1.8;
}

.section-title {
    margin: 24px 0 10px;
    font-size: 18px;
    font-weight: bold;
}

.option-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.option {
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #414650;
    background: #2a2e36;
    color: white;
    text-align: left;
}

.option:hover {
    background: #353a44;
}

.option.selected {
    border-color: #fff;
    background: #3b404b;
}

.option strong {
    display: block;
    margin-bottom: 5px;
}

.option small {
    color: #aaa;
}

.start-btn {
    width: 100%;
    padding: 15px;
    margin-top: 25px;
    border: none;
    border-radius: 10px;
    background: #eee;
    color: #111;
    font-size: 17px;
    font-weight: bold;
}

.start-btn:disabled {
    opacity: .3;
    cursor: not-allowed;
}

/* =========================
   頭部
========================= */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.title {
    font-size: 25px;
    font-weight: bold;
}

.year {
    text-align: right;
    color: #aaa;
}

.year strong {
    display: block;
    color: white;
    font-size: 21px;
}

/* =========================
   數值
========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
}

.stat {
    background: #20232a;
    border: 1px solid #343841;
    border-radius: 10px;
    padding: 11px;
    text-align: center;
}

.stat-name {
    color: #999;
    font-size: 12px;
}

.stat-value {
    font-size: 21px;
    font-weight: bold;
    margin-top: 5px;
}

/* =========================
   身分
========================= */

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.tag {
    background: #30343c;
    border-radius: 20px;
    padding: 6px 11px;
    font-size: 13px;
}

/* =========================
   時間軸
========================= */

.timeline {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    margin-bottom: 12px;
}

.timeline div {
    padding: 9px 4px;
    text-align: center;
    border-radius: 7px;
    background: #24272e;
    color: #666;
    font-size: 12px;
}

.timeline .active {
    background: #454a55;
    color: white;
}

/* =========================
   事件
========================= */

.event-date {
    color: #888;
    font-size: 13px;
    margin-bottom: 7px;
}

.event-title {
    font-size: 27px;
    font-weight: bold;
    margin-bottom: 15px;
}

.event-text {
    line-height: 1.9;
    color: #d4d4d4;
    white-space: pre-line;
    margin-bottom: 20px;
}

.choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.choice {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #414650;
    background: #2b2f37;
    color: white;
    text-align: left;
}

.choice:hover {
    background: #383d47;
}

.choice-title {
    font-size: 16px;
    font-weight: bold;
}

.choice-effect {
    margin-top: 5px;
    color: #999;
    font-size: 13px;
}

/* =========================
   結果
========================= */

.result {
    padding: 17px;
    background: #181a1f;
    border: 1px solid #383c45;
    border-radius: 10px;
    line-height: 1.9;
    white-space: pre-line;
}

.continue {
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #eee;
    color: #111;
    font-size: 16px;
    font-weight: bold;
}

/* =========================
   英雄池
========================= */

.hero-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 12px;
}

.hero {
    padding: 11px;
    border-radius: 8px;
    background: #181a1f;
    text-align: center;
}

.hero-name {
    color: #999;
    font-size: 12px;
}

.hero-value {
    margin-top: 5px;
    font-size: 19px;
}

/* =========================
   語言
========================= */

.language-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 12px;
}

.language {
    padding: 10px;
    background: #181a1f;
    border-radius: 8px;
    text-align: center;
}

.language-name {
    color: #999;
    font-size: 12px;
}

.language-value {
    margin-top: 4px;
    font-size: 18px;
}

/* =========================
   底部
========================= */

.bottom {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.bottom button {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #363a44;
    background: #20232a;
    color: #ccc;
}

/* =========================
   年度結算
========================= */

.summary-line {
    display: flex;
    justify-content: space-between;
    padding: 11px 0;
    border-bottom: 1px solid #343841;
}

.next-year {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    border: none;
    border-radius: 9px;
    background: #eee;
    color: #111;
    font-weight: bold;
    font-size: 16px;
}

/* =========================
   RWD
========================= */

@media(max-width:700px) {

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .option-grid {
        grid-template-columns: 1fr;
    }

    .hero-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .language-list {
        grid-template-columns: repeat(2, 1fr);
    }

    .bottom {
        grid-template-columns: repeat(2, 1fr);
    }

    .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
    }

    .year {
        text-align: left;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

/* =========================================================
   玩家資料
========================================================= */

let player = {

    age: 16,
    year: 2026,

    /* 出身 */
    region: "",
    position: "",

    /* 職涯 */
    career: "高中生",
    club: "",

    /* 基礎能力 */
    skill: 50,
    sense: 50,
    mental: 50,
    stamina: 50,
    fame: 0,

    /* 經驗 */
    experience: 0,

    /* 英雄池隱藏傾向 */
    heroStyle: {
        assassin: 50,
        mage: 50,
        poke: 50,
        utility: 50
    },

    /* 英雄池實際熟練 */
    heroPool: {
        assassin: 50,
        mage: 50,
        poke: 50,
        utility: 50
    },

    /* 單一英雄專精 */
    oneTrick: 0,

    /* 語言 */
    languages: {
        native: 80,
        korean: 0,
        chinese: 0,
        english: 0,
        vietnamese: 0,
        japanese: 0
    },

    /* 目前主要語言 */
    localLanguage: "native",

    /* 英雄池調查結果 */
    heroDiagnosis: "尚未調查",

    /* 平庸懲罰 */
    heroPenalty: 0,

    /* 一年階段 */
    phase: 0,

    seasonResult: "",

    history: [],

    savedBeforeChoice: null
};


/* =========================================================
   開局選擇
========================================================= */

let setup = {
    region: "",
    position: ""
};


function renderSetup() {

    document.getElementById("app").innerHTML = `

    <div class="panel">

        <h1>🎮 電競人生模擬器</h1>

        <div class="desc">
            你將從16歲開始自己的電競人生。
            <br>
            先決定你的出身與位置。
            <br><br>
            <b>語言能力與英雄池風格不會在這裡直接決定。</b>
            它們會在你的人生中逐漸形成。
        </div>


        <div class="section-title">
            🌏 出身賽區
        </div>

        <div class="option-grid">

            ${setupOption(
                "region",
                "LCK",
                "🇰🇷 LCK",
                "韓國出身"
            )}

            ${setupOption(
                "region",
                "LPL",
                "🇨🇳 LPL",
                "中國出身"
            )}

            ${setupOption(
                "region",
                "LEC",
                "🇪🇺 LEC",
                "歐洲出身"
            )}

            ${setupOption(
                "region",
                "LCS",
                "🇺🇸 LCS",
                "北美出身"
            )}

            ${setupOption(
                "region",
                "LCP",
                "🌏 LCP",
                "亞太出身"
            )}

            ${setupOption(
                "region",
                "CBLOL",
                "🇧🇷 CBLOL",
                "巴西出身"
            )}

        </div>


        <div class="section-title">
            🛣️ 登記位置
        </div>

        <div class="option-grid">

            ${setupOption(
                "position",
                "TOP",
                "🛡️ TOP",
                "上路"
            )}

            ${setupOption(
                "position",
                "JUNGLE",
                "🌲 JUNGLE",
                "打野"
            )}

            ${setupOption(
                "position",
                "MID",
                "⚔️ MID",
                "中路"
            )}

            ${setupOption(
                "position",
                "ADC",
                "🎯 ADC",
                "下路"
            )}

            ${setupOption(
                "position",
                "SUPPORT",
                "🧭 SUPPORT",
                "輔助"
            )}

        </div>


        <button
            class="start-btn"
            id="startBtn"
            onclick="startGame()"
            disabled
        >
            開始人生
        </button>

    </div>
    `;
}


function setupOption(type,value,title,desc) {

    let selected =
        setup[type] === value
        ? "selected"
        : "";

    return `

    <button
        class="option ${selected}"
        onclick="selectSetup('${type}','${value}')"
    >

        <strong>${title}</strong>

        <small>
            ${desc}
        </small>

    </button>

    `;
}


function selectSetup(type,value) {

    setup[type] = value;

    renderSetup();

    if (
        setup.region &&
        setup.position
    ) {

        document.getElementById(
            "startBtn"
        ).disabled = false;

    }
}


/* =========================================================
   開始遊戲
========================================================= */

function startGame() {

    player.region = setup.region;
    player.position = setup.position;

    /*
       出身賽區決定本土語言
    */

    if (player.region === "LCK") {

        player.languages.korean = 80;
        player.localLanguage = "korean";

    }

    else if (player.region === "LPL") {

        player.languages.chinese = 80;
        player.localLanguage = "chinese";

    }

    else if (player.region === "LEC") {

        player.languages.english = 70;
        player.localLanguage = "english";

    }

    else if (player.region === "LCS") {

        player.languages.english = 80;
        player.localLanguage = "english";

    }

    else if (player.region === "LCP") {

        /*
           LCP 本身跨多個地區，
           因此先以英文作為共同溝通基礎。
        */

        player.languages.english = 50;
        player.localLanguage = "english";

    }

    else if (player.region === "CBLOL") {

        player.languages.english = 20;
        player.localLanguage = "native";

    }

    renderGame();

    showPhase();
}


/* =========================================================
   主畫面
========================================================= */

function renderGame() {

    document.getElementById("app").innerHTML = `

    <div class="panel header">

        <div class="title">
            🎮 電競人生模擬器
        </div>

        <div class="year">

            <strong>
                ${player.year}
            </strong>

            ${player.age} 歲

        </div>

    </div>


    <div class="stats">

        ${stat("操作","skill")}
        ${stat("遊戲理解","sense")}
        ${stat("心態","mental")}
        ${stat("體力","stamina")}
        ${stat("人氣","fame")}
        ${stat("經驗","experience")}

    </div>


    <div class="panel">

        <div class="tags">

            <span class="tag">
                ${regionName()}
            </span>

            <span class="tag">
                ${positionName()}
            </span>

            <span class="tag">
                ${player.career}
            </span>

            ${
                player.club
                ?
                `<span class="tag">
                    🏢 ${player.club}
                </span>`
                :
                ""
            }

        </div>

    </div>


    <div class="timeline">

        <div id="phase0">
            年初
        </div>

        <div id="phase1">
            賽訓
        </div>

        <div id="phase2">
            比賽
        </div>

        <div id="phase3">
            休賽期
        </div>

    </div>


    <div
        class="panel"
        id="eventArea"
    ></div>


    <div class="panel">

        <strong>
            🎮 英雄池
        </strong>

        <div class="hero-grid">

            ${hero(
                "刺客型",
                "assassin"
            )}

            ${hero(
                "大法師型",
                "mage"
            )}

            ${hero(
                "Poke型",
                "poke"
            )}

            ${hero(
                "功能型",
                "utility"
            )}

        </div>

        <div style="
            margin-top:12px;
            color:#999;
            font-size:13px;
        ">

            目前風格：
            <b style="color:#eee">
                ${player.heroDiagnosis}
            </b>

        </div>

    </div>


    <div class="panel">

        <strong>
            🗣️ 語言能力
        </strong>

        <div class="language-list">

            ${language(
                "韓語",
                "korean"
            )}

            ${language(
                "中文",
                "chinese"
            )}

            ${language(
                "英語",
                "english"
            )}

            ${language(
                "越南語",
                "vietnamese"
            )}

            ${language(
                "日語",
                "japanese"
            )}

            ${language(
                "本土語言",
                "native"
            )}

        </div>

    </div>


    <div class="bottom">

        <button onclick="saveGame()">
            💾 儲存
        </button>

        <button onclick="loadGame()">
            📂 讀取
        </button>

        <button onclick="goBack()">
            ⬅️ 上一步
        </button>

        <button onclick="restart()">
            🔄 重開
        </button>

    </div>

    `;
}


function stat(name,key) {

    return `

    <div class="stat">

        <div class="stat-name">
            ${name}
        </div>

        <div class="stat-value">
            ${Math.round(player[key])}
        </div>

    </div>

    `;
}


function hero(name,key) {

    return `

    <div class="hero">

        <div class="hero-name">
            ${name}
        </div>

        <div class="hero-value">
            ${Math.round(
                player.heroPool[key]
            )}
        </div>

    </div>

    `;
}


function language(name,key) {

    return `

    <div class="language">

        <div class="language-name">
            ${name}
        </div>

        <div class="language-value">
            ${Math.round(
                player.languages[key]
            )}
        </div>

    </div>

    `;
}


/* =========================================================
   階段
========================================================= */

function showPhase() {

    updateTimeline();

    if (player.phase === 0) {

        showStartOfYear();

    }

    else if (player.phase === 1) {

        showTraining();

    }

    else if (player.phase === 2) {

        runCompetition();

    }

    else if (player.phase === 3) {

        showOffSeason();

    }

}


function updateTimeline() {

    for (let i = 0; i < 4; i++) {

        let el =
            document.getElementById(
                "phase" + i
            );

        if (el) {

            el.classList.toggle(
                "active",
                i === player.phase
            );

        }

    }

}


/* =========================================================
   年初
========================================================= */

function showStartOfYear() {

    let text = "";

    if (player.age === 16) {

        text =
`你是一名16歲的高中生。

最近，你開始認真投入英雄聯盟。

原本只是放學後的遊戲，
現在你開始思考：

「如果我真的往職業方向走呢？」

你還不知道自己會成為什麼樣的選手。

甚至連自己的英雄池風格，
現在都還沒有真正形成。`;

    }

    else {

        text =
`新的一年開始。

你回頭看著去年的自己，
發現自己的打法正在逐漸成形。

但你還需要做出今年的重要決定。`;

    }


    showChoices(
        "新的一年",
        text,
        [

            {
                title:
                    "🎮 大量排位",
                effect:
                    "操作 +4、體力 -3、刺客傾向 +2",
                action:()=>{

                    player.skill += 4;
                    player.stamina -= 3;

                    player.heroStyle.assassin += 2;
                    player.heroPool.assassin += 2;

                }
            },

            {
                title:
                    "🧠 研究比賽",
                effect:
                    "遊戲理解 +4、大法師傾向 +2",
                action:()=>{

                    player.sense += 4;

                    player.heroStyle.mage += 2;
                    player.heroPool.mage += 2;

                }
            },

            {
                title:
                    "🎯 嘗試不同打法",
                effect:
                    "英雄池各類 +2，但沒有明顯專精",
                action:()=>{

                    player.heroStyle.assassin += 2;
                    player.heroStyle.mage += 2;
                    player.heroStyle.poke += 2;
                    player.heroStyle.utility += 2;

                    player.heroPool.assassin += 2;
                    player.heroPool.mage += 2;
                    player.heroPool.poke += 2;
                    player.heroPool.utility += 2;

                }
            },

            {
                title:
                    "🧘 保持狀態",
                effect:
                    "心態 +4、體力 +4",
                action:()=>{

                    player.mental += 4;
                    player.stamina += 4;

                }
            }

        ]
    );

}


/* =========================================================
   賽訓
========================================================= */

function showTraining() {

    showChoices(
        "賽季前賽訓",
`現在正式進入賽季前訓練。

這段時間不是比賽。

你會和隊友、教練或自己
針對今年的問題進行訓練。

訓練結束後，
系統才會進入正式比賽。`,
        [

            {
                title:
                    "🏋️ 強化操作",
                effect:
                    "操作 +5、體力 -4",
                action:()=>{

                    player.skill += 5;
                    player.stamina -= 4;

                }
            },

            {
                title:
                    "🧠 戰術訓練",
                effect:
                    "遊戲理解 +5、功能型傾向 +2",
                action:()=>{

                    player.sense += 5;

                    player.heroStyle.utility += 2;
                    player.heroPool.utility += 2;

                }
            },

            {
                title:
                    "🎮 英雄池訓練",
                effect:
                    "選擇一種打法方向 +5",
                action:()=>{

                    showHeroTraining();

                }
            },

            {
                title:
                    "🧘 體能與心理訓練",
                effect:
                    "心態 +4、體力 +5",
                action:()=>{

                    player.mental += 4;
                    player.stamina += 5;

                }
            }

        ]
    );

}


/* =========================================================
   英雄池方向
========================================================= */

function showHeroTraining() {

    showChoices(
        "英雄池訓練",
`教練問你：

「你接下來想把哪種打法練得更深？」

你並不是直接決定自己是什麼型選手。

這只是一次訓練選擇。

長期累積下來，
系統才會調查出你的真正風格。`,
        [

            {
                title:
                    "🔪 進攻與單殺",
                effect:
                    "刺客傾向 +6、刺客英雄池 +5",
                action:()=>{

                    player.heroStyle.assassin += 6;
                    player.heroPool.assassin += 5;

                }
            },

            {
                title:
                    "🔮 技能與團戰輸出",
                effect:
                    "大法師傾向 +6、大法師英雄池 +5",
                action:()=>{

                    player.heroStyle.mage += 6;
                    player.heroPool.mage += 5;

                }
            },

            {
                title:
                    "🎯 遠程消耗",
                effect:
                    "Poke傾向 +6、Poke英雄池 +5",
                action:()=>{

                    player.heroStyle.poke += 6;
                    player.heroPool.poke += 5;

                }
            },

            {
                title:
                    "🧭 團隊功能",
                effect:
                    "功能傾向 +6、功能英雄池 +5",
                action:()=>{

                    player.heroStyle.utility += 6;
                    player.heroPool.utility += 5;

                }
            }

        ]
    );

}


/* =========================================================
   比賽
========================================================= */

function runCompetition() {

    /*
       比賽階段不再提供訓練選項。
       直接依照能力判定。
    */

    diagnoseHeroPool();


    let heroAverage =
        (
            player.heroPool.assassin +
            player.heroPool.mage +
            player.heroPool.poke +
            player.heroPool.utility
        ) / 4;


    let language =
        getCurrentLanguage();


    let languageEffect =
        language >= 70
        ? 5
        : language >= 45
        ? 0
        : -5;


    let power =
        player.skill * .30 +
        player.sense * .30 +
        player.mental * .15 +
        player.stamina * .10 +
        heroAverage * .15;


    power += languageEffect;

    power -= player.heroPenalty;


    let random =
        Math.random() * 16 - 8;


    let finalPower =
        power + random;


    let result;


    if (finalPower >= 75) {

        result =
`🏆 你打出了非常亮眼的賽季。

你的個人表現成為隊伍的重要支柱。

人氣 +8
心態 +3`;

        player.fame += 8;
        player.mental += 3;
        player.experience += 6;

        player.seasonResult = "頂尖";

    }

    else if (finalPower >= 60) {

        result =
`⚔️ 你完成了一個不錯的賽季。

你的表現獲得了教練與隊友肯定。

人氣 +4`;

        player.fame += 4;
        player.experience += 4;

        player.seasonResult = "良好";

    }

    else if (finalPower >= 45) {

        result =
`😐 你的賽季表現普通。

你沒有犯下太多錯誤，
但也沒有成為最受矚目的選手。

人氣沒有明顯變化。`;

        player.experience += 2;

        player.seasonResult = "普通";

    }

    else {

        result =
`😓 這個賽季並不順利。

你在幾場關鍵比賽中出現失誤。

心態 -3`;

        player.mental -= 3;

        player.seasonResult = "失利";

    }


    showResult(
        "🏆 正式比賽",
`賽季正式開始。

你前面的訓練，
現在全部轉化成比賽表現。

英雄池調查：
${player.heroDiagnosis}

${player.heroPenalty > 0
    ? "⚠️ 英雄池平庸懲罰：-" +
      player.heroPenalty +
      " 綜合競爭力"
    : ""
}

語言適應：
${languageNameForValue(language)}

${result}

最終綜合競爭力：
${Math.round(finalPower)}`,
        "進入休賽期"
    );

}


/* =========================================================
   英雄池調查
========================================================= */

function diagnoseHeroPool() {

    let values = Object.values(
        player.heroStyle
    );

    let max =
        Math.max(...values);

    let min =
        Math.min(...values);

    let average =
        values.reduce(
            (a,b)=>a+b,
            0
        ) / values.length;


    let sorted =
        [...values].sort(
            (a,b)=>b-a
        );


    let gap =
        sorted[0] - sorted[1];


    player.heroPenalty = 0;


    /*
       極端專精
    */

    if (sorted[0] >= 75 && gap >= 12) {

        player.heroDiagnosis =
            "🔪 絕活型";

        player.heroPenalty = 0;

        return;

    }


    /*
       明顯專精
    */

    if (gap >= 8) {

        player.heroDiagnosis =
            "🎯 專精型";

        player.heroPenalty = 0;

        return;

    }


    /*
       所有都很普通且非常接近
       → 平庸懲罰
    */

    if (
        max < 65 &&
        (max - min) <= 6
    ) {

        player.heroDiagnosis =
            "😐 平庸型";

        player.heroPenalty = 8;

        return;

    }


    /*
       均衡但能力還可以
    */

    if (
        (max - min) <= 8
    ) {

        player.heroDiagnosis =
            "⚖️ 均衡型";

        /*
           均衡型本身不一定是壞事，
           但如果所有數值都不高，
           仍然給輕微處罰。
        */

        if (average < 60) {

            player.heroPenalty = 4;

        }

        return;

    }


    /*
       剩餘
    */

    player.heroDiagnosis =
        "🎲 偏科型";

    player.heroPenalty = 2;

}


/* =========================================================
   休賽期
========================================================= */

function showOffSeason() {

    let text =
`賽季結束。

你終於有時間休息，
也可以重新檢視自己。

${player.seasonResult === "頂尖"
    ? "你的出色表現讓俱樂部開始注意到你。"
    : player.seasonResult === "失利"
    ? "這次失利讓你開始思考自己的問題。"
    : "你開始整理這一年累積的經驗。"
}

這時候也可能發生一些
與隊友、語言、青訓或轉隊有關的事件。`;


    let choices = [

        {
            title:
                "🔥 下一季繼續衝刺",
            effect:
                "操作 +3、遊戲理解 +2、體力 -3",
            action:()=>{

                player.skill += 3;
                player.sense += 2;
                player.stamina -= 3;

            }
        },

        {
            title:
                "📚 修正自己的弱點",
            effect:
                "目前最低能力 +5",
            action:()=>{

                let keys = [
                    "skill",
                    "sense",
                    "mental",
                    "stamina"
                ];

                keys.sort(
                    (a,b)=>player[a]-player[b]
                );

                player[keys[0]] += 5;

            }
        },

        {
            title:
                "😴 好好休息",
            effect:
                "體力 +8、心態 +5",
            action:()=>{

                player.stamina += 8;
                player.mental += 5;

            }
        }

    ];


    /*
       如果正在海外，
       有機率出現語言事件
    */

    if (
        player.career !== "高中生" &&
        player.club &&
        Math.random() < 0.6
    ) {

        choices.push({

            title:
                "🗣️ 學習當地語言",
            effect:
                "當地語言 +8、心態 -1",
            action:()=>{

                trainLocalLanguage();

                player.mental -= 1;

            }

        });

    }


    /*
       Scout
    */

    if (
        player.fame >= 5 &&
        !player.club
    ) {

        choices.push({

            title:
                "📩 接受青訓試訓",
            effect:
                "嘗試進入職業體系",
            action:()=>{

                scoutCheck();

            }

        });

    }


    showChoices(
        "休賽期",
        text,
        choices
    );

}


/* =========================================================
   語言事件
========================================================= */

function trainLocalLanguage() {

    let key =
        player.localLanguage;

    /*
       如果本土語言，
       不需要特別訓練。
    */

    if (key === "native")
        return;


    player.languages[key] += 8;

}


/* =========================================================
   語言自動成長
========================================================= */

function yearlyLanguageGrowth() {

    let key =
        player.localLanguage;

    if (key === "native")
        return;


    /*
       在該賽區生活，
       即使沒有主動學，
       也會自然增加。

       但速度很慢。
    */

    player.languages[key] += 3;

}


/* =========================================================
   青訓
========================================================= */

function scoutCheck() {

    let power =
        player.skill * .35 +
        player.sense * .30 +
        player.mental * .15 +
        heroAverage() * .20;


    /*
       本土青訓容易度
    */

    let threshold = 62;


    if (
        player.region ===
        player.clubRegion
    ) {

        threshold -= 5;

    }


    if (power >= threshold) {

        player.club =
            player.region + " 青訓";

        player.career =
            "青訓選手";

        player.fame += 3;

        player.history.push(
            "成功加入 " +
            player.club
        );


        showResult(
            "🌱 青訓邀請",
`Scout 看過你的資料。

經過試訓後，

你成功加入：

${player.club}

你現在還不是正式職業選手。

但你已經進入職業電競體系。`,
            "繼續"
        );

    }

    else {

        showResult(
            "📩 青訓試訓",
`你參加了青訓試訓。

但是教練認為你目前仍有不足。

你沒有被淘汰。

只是還需要更多時間。`,
            "繼續"
        );

    }

}


/* =========================================================
   選項
========================================================= */

function showChoices(
    title,
    text,
    choices
) {

    updateTimeline();


    let html = `

    <div class="event-date">
        ${phaseName()}
    </div>

    <div class="event-title">
        ${title}
    </div>

    <div class="event-text">
        ${text}
    </div>

    <div class="choices">

    `;


    choices.forEach(
        (choice,index)=>{

            html += `

            <button
                class="choice"
                onclick="choose(${index})"
            >

                <div class="choice-title">
                    ${choice.title}
                </div>

                <div class="choice-effect">
                    ${choice.effect}
                </div>

            </button>

            `;

        }
    );


    html += `
        </div>
    `;


    document.getElementById(
        "eventArea"
    ).innerHTML = html;


    window.currentChoices =
        choices;

}


/* =========================================================
   做選擇
========================================================= */

function choose(index) {

    /*
       保存狀態
    */

    player.savedBeforeChoice =
        JSON.stringify(player);


    let choice =
        window.currentChoices[index];


    choice.action();


    normalize();


    /*
       如果選擇是英雄池事件，
       action 本身會重新產生選項。
    */

    if (
        choice.title.includes(
            "英雄池訓練"
        )
    ) {

        return;

    }


    /*
       Scout 自己處理結果
    */

    if (
        choice.title.includes(
            "青訓試訓"
        )
    ) {

        return;

    }


    /*
       一般選項
    */

    showResult(
        "你的選擇",
`你選擇了：

${choice.title}

${choice.effect}`,
        getNextButtonText()
    );

}


/* =========================================================
   結果
========================================================= */

function showResult(
    title,
    text,
    nextText
) {

    document.getElementById(
        "eventArea"
    ).innerHTML = `

    <div class="event-date">
        ${phaseName()}
    </div>

    <div class="event-title">
        ${title}
    </div>

    <div class="result">
        ${text}
    </div>

    <button
        class="continue"
        onclick="nextPhase()"
    >
        ▶ ${nextText}
    </button>

    `;

}


/* =========================================================
   下一階段
========================================================= */

function nextPhase() {

    /*
       年初 → 賽訓
    */

    if (player.phase === 0) {

        player.phase = 1;

        renderGame();
        showPhase();

        return;

    }


    /*
       賽訓 → 比賽
    */

    if (player.phase === 1) {

        player.phase = 2;

        renderGame();

        setTimeout(
            showPhase,
            200
        );

        return;

    }


    /*
       比賽 → 休賽期
    */

    if (player.phase === 2) {

        player.phase = 3;

        renderGame();
        showPhase();

        return;

    }


    /*
       休賽期 → 年度結算
    */

    if (player.phase === 3) {

        yearlyLanguageGrowth();

        showYearSummary();

    }

}


/* =========================================================
   年度結算
========================================================= */

        </div>

        </div>

        </h3>

/* =========================================================
   下一年
========================================================= */

function nextYear() {

    player.age++;
    player.year++;

    player.phase = 0;

    player.seasonResult = "";

    /*
       年輕選手自然恢復
    */

    player.stamina += 8;

    /*
       18歲後
    */

    if (
        player.age >= 18 &&
        !player.club
    ) {

        player.career =
            "業餘選手";

    }


    normalize();

    renderGame();
    showPhase();

}


/* =========================================================
   語言
========================================================= */

function getCurrentLanguage() {

    let key =
        player.localLanguage;

    return player.languages[key] || 0;

}


function languageNameForValue(value) {

    if (value >= 70)
        return "流利";

    if (value >= 45)
        return "可以正常溝通";

    if (value >= 25)
        return "基礎溝通";

    return "幾乎不會";

}


/* =========================================================
   名稱
========================================================= */

function regionName() {

    return {

        LCK:"🇰🇷 LCK",
        LPL:"🇨🇳 LPL",
        LEC:"🇪🇺 LEC",
        LCS:"🇺🇸 LCS",
        LCP:"🌏 LCP",
        CBLOL:"🇧🇷 CBLOL"

    }[player.region];

}


function positionName() {

    return {

        TOP:"🛡️ TOP",
        JUNGLE:"🌲 JUNGLE",
        MID:"⚔️ MID",
        ADC:"🎯 ADC",
        SUPPORT:"🧭 SUPPORT"

    }[player.position];

}


function phaseName() {

    return [

        "年初規劃",
        "賽季前・賽訓",
        "正式比賽",
        "休賽期"

    ][player.phase];

}


/* =========================================================
   英雄池
========================================================= */

function heroAverage() {

    return (
        player.heroPool.assassin +
        player.heroPool.mage +
        player.heroPool.poke +
        player.heroPool.utility
    ) / 4;

}


/* =========================================================
   下一階段文字
========================================================= */

function getNextButtonText() {

    if (player.phase === 0)
        return "進入賽訓期";

    if (player.phase === 1)
        return "進入正式比賽";

    if (player.phase === 2)
        return "進入休賽期";

    return "進入年度結算";

}


/* =========================================================
   數值限制
========================================================= */

function normalize() {

    let keys = [
        "skill",
        "sense",
        "mental",
        "stamina",
        "fame",
        "experience"
    ];


    keys.forEach(
        key => {

            player[key] =
                Math.max(
                    0,
                    Math.min(
                        100,
                        player[key]
                    )
                );

        }
    );


    Object.keys(
        player.heroPool
    ).forEach(
        key => {

            player.heroPool[key] =
                Math.max(
                    0,
                    Math.min(
                        100,
                        player.heroPool[key]
                    )
                );

        }
    );


    Object.keys(
        player.heroStyle
    ).forEach(
        key => {

            player.heroStyle[key] =
                Math.max(
                    0,
                    Math.min(
                        100,
                        player.heroStyle[key]
                    )
                );

        }
    );


    Object.keys(
        player.languages
    ).forEach(
        key => {

            player.languages[key] =
                Math.max(
                    0,
                    Math.min(
                        100,
                        player.languages[key]
                    )
                );

        }
    );

}


/* =========================================================
   存檔
========================================================= */

function saveGame() {

    localStorage.setItem(
        "esportsLifeSave",
        JSON.stringify(player)
    );

    alert(
        "💾 存檔成功！"
    );

}


/* =========================================================
   讀檔
========================================================= */

function loadGame() {

    let save =
        localStorage.getItem(
            "esportsLifeSave"
        );


    if (!save) {

        alert(
            "目前沒有存檔。"
        );

        return;

    }


    player =
        JSON.parse(save);

    renderGame();
    showPhase();

}


/* =========================================================
   上一步
========================================================= */

function goBack() {

    if (
        !player.savedBeforeChoice
    ) {

        alert(
            "目前沒有可以返回的操作。"
        );

        return;

    }


    player =
        JSON.parse(
            player.savedBeforeChoice
        );

    player.savedBeforeChoice =
        null;

    renderGame();
    showPhase();

}


/* =========================================================
   重開
========================================================= */

function restart() {

    if (
        !confirm(
            "確定要重新開始嗎？"
        )
    ) {

        return;

    }


    location.reload();

}


/* =========================================================
   初始化
========================================================= */

renderSetup();

</script>
