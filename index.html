<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>英雄聯盟職業人生模擬器</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef0f3;color:#20242a;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
button{font:inherit;cursor:pointer}
.app{max-width:720px;margin:auto;min-height:100vh;background:#fff}
.top{padding:16px 18px;border-bottom:1px solid #e4e6e8}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.name{font-size:20px;font-weight:800}
.muted{font-size:13px;color:#777d84}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.badge{padding:5px 9px;background:#eef0f2;border-radius:999px;font-size:12px;font-weight:700}
.good{background:#e6f5eb;color:#247344}
.warn{background:#fff1d8;color:#966000}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
.stat{background:#f6f7f8;border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:19px}
.stat span{font-size:11px;color:#777}
.timeline{display:flex;gap:5px;margin-top:13px}
.timeline i{height:4px;flex:1;background:#ddd;border-radius:4px}
.timeline i.on{background:#222}

.main{padding:17px}
.card{border:1px solid #e1e4e7;border-radius:15px;padding:16px;margin-bottom:12px}
h1,h2,h3,p{margin-top:0}
h1{font-size:22px;margin-bottom:4px}
h2{font-size:18px;margin-bottom:5px}
h3{font-size:14px;margin-bottom:8px}
.version{font-size:13px;color:#6f757c}

.scores{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}
.score{background:#f6f7f8;border-radius:11px;padding:11px}
.score span{font-size:12px;color:#777}
.score b{display:block;font-size:25px;margin-top:2px}

.tip{background:#f7f7f7;border-left:4px solid #444;border-radius:9px;padding:11px;font-size:13px;line-height:1.6}

.primary,.secondary{
width:100%;padding:13px;border-radius:11px;font-weight:800;margin-top:12px
}
.primary{border:0;background:#222;color:white}
.secondary{border:1px solid #ddd;background:white}

.choice{
border:1px solid #ddd;border-radius:13px;
padding:15px;margin:9px 0;background:white;
text-align:left;width:100%
}
.choice b{display:block;font-size:15px;margin-bottom:5px}
.choice span{font-size:12px;color:#777}
.choice:hover{background:#f7f8f9}

.result{
text-align:center;
padding:10px 0 4px
}
.result .big{font-size:34px;font-weight:900;margin:8px 0}

.hidden{display:none}

@media(max-width:480px){
.stats{grid-template-columns:repeat(2,1fr)}
.scores{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="app">

<header class="top">
  <div class="row">
    <div>
      <div class="name">無名選手</div>
      <div class="muted" id="identity">18歲｜業餘選手｜AP-A</div>
    </div>
    <div class="muted" id="resource">資源 30</div>
  </div>

  <div class="badges">
    <span class="badge" id="position">MID｜適性 84</span>
    <span class="badge">進攻型</span>
    <span class="badge">專門：戰士</span>
    <span class="badge good" id="versionState">版本受益</span>
  </div>

  <div class="stats">
    <div class="stat"><b id="op">82</b><span>操作</span></div>
    <div class="stat"><b id="iq">74</b><span>觀念</span></div>
    <div class="stat"><b id="team">69</b><span>團隊</span></div>
    <div class="stat"><b id="exp">38</b><span>經驗</span></div>
  </div>

  <div class="timeline">
    <i class="on"></i>
    <i></i>
    <i></i>
    <i></i>
  </div>
</header>


<main class="main">

<!-- 第一層：人生節點 -->
<section id="stageScreen">

  <div class="card">
    <div class="muted">目前人生階段</div>
    <h1 id="stageTitle">業餘賽季・春季</h1>
    <div class="version" id="versionText">
      本季版本：操作與主動進攻
    </div>

    <div class="scores">
      <div class="score">
        <span>隊伍評分</span>
        <b id="teamScore">63</b>
      </div>

      <div class="score">
        <span>隊伍版本適合度</span>
        <b id="fit">78</b>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>💡 現況</h3>
    <div class="tip" id="summary">
      你目前的操作能力較突出，但觀念仍有成長空間。
    </div>
  </div>

  <button class="primary" onclick="goDecision()">
    繼續 →
  </button>

</section>


<!-- 第二層：唯一決策 -->
<section id="decisionScreen" class="hidden">

  <div class="card">
    <div class="muted">春季訓練期</div>
    <h1>你要怎麼安排這段時間？</h1>

    <div class="tip" id="decisionTip">
      目前版本與你的打法相性不錯。
    </div>

    <button class="choice" onclick="choose('game')">
      <b>🎮 遊戲訓練</b>
      <span>提升比賽能力，直接影響賽場表現。</span>
    </button>

    <button class="choice" onclick="choose('health')">
      <b>❤️ 健康訓練</b>
      <span>維持狀態，降低長期生涯風險。</span>
    </button>

    <button class="choice" onclick="choose('pr')">
      <b>📣 公關訓練</b>
      <span>提升人氣與商業價值。</span>
    </button>
  </div>

  <button class="secondary" onclick="backToStage()">← 回上一層</button>

</section>


<!-- 第三層：遊戲能力選擇 -->
<section id="trainingScreen" class="hidden">

  <div class="card">
    <div class="muted">遊戲訓練</div>
    <h1>你想提升什麼？</h1>

    <div class="tip" id="trainingTip"></div>

    <div id="trainingChoices"></div>
  </div>

  <button class="secondary" onclick="backToDecision()">
    ← 回上一層
  </button>

</section>


<!-- 第四層：結果 -->
<section id="resultScreen" class="hidden">

  <div class="card result">

    <div class="muted">本階段結果</div>

    <div class="big" id="resultTitle">
      訓練完成
    </div>

    <p id="resultText">
      你的能力有所提升。
    </p>

    <div class="scores">
      <div class="score">
        <span>隊伍評分</span>
        <b id="resultTeam">63</b>
      </div>

      <div class="score">
        <span>版本適合度</span>
        <b id="resultFit">78</b>
      </div>
    </div>

  </div>

  <button class="primary" onclick="showEvent()">
    繼續 →
  </button>

</section>


<!-- 第五層：突發事件 -->
<section id="eventScreen" class="hidden">

  <div class="card">

    <div class="muted">突發事件</div>
    <h1 id="eventTitle">⚡ 社群討論</h1>

    <p id="eventText">
      你的比賽片段突然被大量轉發。
    </p>

    <button class="choice" onclick="finishEvent()">
      <b id="eventChoice">接受採訪</b>
      <span id="eventChoiceText">
        把握這次增加曝光的機會。
      </span>
    </button>

  </div>

</section>


<!-- 第六層：賽季結果 -->
<section id="matchScreen" class="hidden">

  <div class="card result">

    <div class="muted">賽季結果</div>

    <div class="big" id="seasonResult">
      晉級季後賽
    </div>

    <p id="seasonText">
      你的隊伍成功延續本季競爭力。
    </p>

  </div>

  <button class="primary" onclick="newPhase()">
    進入下一階段 →
  </button>

</section>

</main>
</div>


<script>

const game={
  age:18,
  season:1,
  resource:30,

  op:82,
  iq:74,
  team:69,
  exp:38,

  soft:{
    op:91,
    iq:88,
    team:83,
    exp:95
  },

  position:"MID",
  style:"進攻型",
  specialty:"戰士",

  teamScore:63,
  fit:78,

  version:"操作與主動進攻",
  versionState:"版本受益"
};


const versions=[
  "操作與主動進攻",
  "觀念與團隊協作",
  "發育與資源管理",
  "前期打架與支援"
];


function show(id){
  document.querySelectorAll(
    "#stageScreen,#decisionScreen,#trainingScreen,#resultScreen,#eventScreen,#matchScreen"
  ).forEach(x=>x.classList.add("hidden"));

  document.getElementById(id).classList.remove("hidden");
}


function positionFit(){

  return Math.round(
    game.op*.35+
    game.iq*.30+
    game.team*.20+
    game.exp*.15
  );
}


function render(){

  document.getElementById("identity").textContent=
    `${game.age}歲｜${game.age<19?"業餘選手":"職業選手"}｜AP-${String.fromCharCode(65+(game.season%4))}`;

  document.getElementById("resource").textContent=
    `資源 ${game.resource}`;

  document.getElementById("position").textContent=
    `${game.position}｜適性 ${positionFit()}`;

  document.getElementById("op").textContent=game.op;
  document.getElementById("iq").textContent=game.iq;
  document.getElementById("team").textContent=game.team;
  document.getElementById("exp").textContent=game.exp;

  document.getElementById("versionState").textContent=
    game.versionState;

  document.getElementById("versionState").className=
    "badge "+(
      game.versionState==="逆版本"
      ?"warn"
      :"good"
    );

  document.getElementById("stageTitle").textContent=
    game.age<19
    ?"業餘賽季・春季"
    :"職業賽季・春季";

  document.getElementById("versionText").textContent=
    `本季版本：${game.version}`;

  document.getElementById("teamScore").textContent=
    game.teamScore;

  document.getElementById("fit").textContent=
    game.fit;

  updateTips();
}


function updateTips(){

  const values={
    op:game.op,
    iq:game.iq,
    team:game.team,
    exp:game.exp
  };

  const labels={
    op:"操作",
    iq:"觀念",
    team:"團隊",
    exp:"經驗"
  };

  const key=Object.keys(values).sort(
    (a,b)=>
      values[a]/game.soft[a]-
      values[b]/game.soft[b]
  )[0];

  const ratio=
    Math.max(
      0,
      (values[key]-60)/
      (game.soft[key]-60)
    );

  const cost=
    Math.max(
      1,
      Math.round(1+ratio*ratio*9)
    );

  document.getElementById("summary").textContent=
    `目前最值得投資的是${labels[key]}。`+
    `你的${labels[key]}為 ${values[key]}，`+
    `軟上限約 ${game.soft[key]}，`+
    `下一點成長成本約 ${cost}。`;

  document.getElementById("decisionTip").textContent=
    game.versionState==="逆版本"
    ?"目前版本對你的風格較不利。可以考慮補足版本需要的能力。"
    :"目前版本與你的打法相性不錯。可以把資源投入最值得成長的能力。";
}


function goDecision(){
  show("decisionScreen");
}


function backToStage(){
  show("stageScreen");
}


function backToDecision(){
  show("decisionScreen");
}


function choose(type){

  if(type==="game"){
    openGameTraining();
    return;
  }

  if(type==="health"){

    game.resource=
      Math.max(0,game.resource-2);

    showResult(
      "健康訓練完成",
      "你維持了良好的身體狀態，長期生涯風險下降。"
    );

    return;
  }

  if(type==="pr"){

    game.resource+=3;

    showResult(
      "公關活動完成",
      "你的曝光度提升，商業價值也有所增加。"
    );

  }
}


function openGameTraining(){

  const keys=[
    ["op","操作"],
    ["iq","觀念"],
    ["team","團隊"]
  ];

  let html="";

  keys.forEach(([key,label])=>{

    html+=`
      <button class="choice"
        onclick="train('${key}')">

        <b>${label} ${game[key]}</b>

        <span>
          軟上限 ${game.soft[key]}｜
          成長成本 ${trainingCost(key)}
        </span>

      </button>
    `;

  });

  document.getElementById(
    "trainingChoices"
  ).innerHTML=html;

  show("trainingScreen");
}


function trainingCost(key){

  const ratio=
    Math.max(
      0,
      (game[key]-60)/
      (game.soft[key]-60)
    );

  return Math.max(
    1,
    Math.round(1+ratio*ratio*9)
  );
}


function train(key){

  const cost=trainingCost(key);

  if(game[key]>=game.soft[key]){

    alert("這項能力已接近軟上限。");
    return;

  }

  if(game.resource<cost){

    alert("資源不足。");
    return;

  }

  game.resource-=cost;
  game[key]++;

  if(
    key==="iq" &&
    game.versionState==="逆版本"
  ){
    game.fit=Math.min(
      99,
      game.fit+2
    );
  }

  showResult(
    `${key==="op"?"操作":key==="iq"?"觀念":"團隊"}提升`,
    `這段訓練讓你的${key==="op"?"操作":key==="iq"?"觀念":"團隊"}能力提升了。`
  );
}


function showResult(title,text){

  render();

  document.getElementById("resultTitle").textContent=
    title;

  document.getElementById("resultText").textContent=
    text;

  document.getElementById("resultTeam").textContent=
    game.teamScore;

  document.getElementById("resultFit").textContent=
    game.fit;

  show("resultScreen");
}


function showEvent(){

  document.getElementById("eventTitle").textContent=
    "⚡ 突發事件";

  const events=[
    [
      "你的精彩片段被大量轉發。",
      "接受採訪",
      "增加曝光度與商業價值。",
      ()=>game.resource+=5
    ],
    [
      "隊伍希望你參加賽後採訪。",
      "接受採訪",
      "建立正面形象。",
      ()=>{
        game.resource+=2;
        game.team++;
      }
    ],
    [
      "版本更新後，你的打法受到質疑。",
      "維持原打法",
      "可能承受版本壓力，但保留原本風格。",
      ()=>{
        game.versionState="逆版本";
        game.fit=Math.max(
          55,
          game.fit-8
        );
      }
    ]
  ];

  const e=
    events[game.season%events.length];

  document.getElementById("eventText").textContent=
    e[0];

  document.getElementById("eventChoice").textContent=
    e[1];

  document.getElementById("eventChoiceText").textContent=
    e[2];

  window.currentEvent=e[3];

  show("eventScreen");
}


function finishEvent(){

  if(window.currentEvent){
    window.currentEvent();
  }

  render();

  const performance=
    Math.round(
      game.teamScore*.45+
      positionFit()*.35+
      game.fit*.20
    );

  if(performance>=82){

    document.getElementById("seasonResult").textContent=
      "打進決賽";

    document.getElementById("seasonText").textContent=
      "你的個人能力與隊伍體系配合良好，本季成功走得更遠。";

  }else if(performance>=70){

    document.getElementById("seasonResult").textContent=
      "晉級季後賽";

    document.getElementById("seasonText").textContent=
      "隊伍維持競爭力，你也累積了更多職業經驗。";

  }else{

    document.getElementById("seasonResult").textContent=
      "止步例行賽";

    document.getElementById("seasonText").textContent=
      "隊伍整體競爭力不足，下季需要重新調整。";

  }

  show("matchScreen");
}


function newPhase(){

  game.season++;
  game.age++;
  game.exp+=2;

  game.teamScore=
    Math.min(
      95,
      game.teamScore+
      Math.round(Math.random()*8-2)
    );

  game.version=
    versions[
      game.season%versions.length
    ];

  game.versionState=
    game.season%3===0
    ?"逆版本"
    :game.season%3===1
    ?"版本受益"
    :"正常";

  game.fit=
    Math.min(
      98,
      Math.max(
        55,
        game.fit+
        Math.round(Math.random()*10-5)
      )
    );

  render();
  show("stageScreen");
}


render();

</script>

</body>
</html>
