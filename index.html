<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英雄聯盟職業人生模擬器</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef0f3;color:#20242a;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
button{font:inherit;cursor:pointer}
.app{max-width:720px;margin:auto;min-height:100vh;background:#fff}
.top{padding:18px;border-bottom:1px solid #e3e5e8}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.name{font-size:21px;font-weight:800}
.muted{font-size:13px;color:#777d84}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.badge{padding:5px 9px;border-radius:999px;background:#eef0f2;font-size:12px;font-weight:700}
.good{background:#e6f5eb;color:#237442}
.warn{background:#fff1d8;color:#996300}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:13px}
.stat{background:#f6f7f8;border-radius:10px;padding:9px;text-align:center}
.stat b{display:block;font-size:19px}
.stat span{font-size:11px;color:#777d84}
.progress{display:flex;gap:5px;margin-top:14px}
.progress i{height:5px;flex:1;border-radius:5px;background:#ddd}
.progress i.on{background:#222}
.main{padding:16px}
.card{border:1px solid #e2e5e8;border-radius:15px;padding:15px;margin-bottom:11px}
h2{font-size:18px;margin:0 0 5px}
h3{font-size:14px;margin:0 0 9px}
.version{font-size:13px;color:#686e75}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.score{background:#f6f7f8;border-radius:11px;padding:11px}
.score span{font-size:12px;color:#777d84}
.score b{display:block;font-size:25px;margin-top:2px}
.tip{background:#f7f7f7;border-left:4px solid #444;border-radius:9px;padding:11px;font-size:13px;line-height:1.6}
.event{background:#fafbfc}
.primary,.secondary{width:100%;border-radius:10px;padding:12px;font-weight:800;margin-top:10px}
.primary{border:0;background:#222;color:white}
.secondary{border:1px solid #ddd;background:white}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.action{border:1px solid #ddd;background:white;border-radius:10px;padding:11px 5px;font-weight:700}
.action small{display:block;color:#777;font-size:11px;font-weight:400;margin-top:3px}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(720px,100%);background:white;border-radius:18px 18px 0 0;padding:17px;max-height:86vh;overflow:auto}
.option{border:1px solid #ddd;border-radius:12px;padding:12px;margin:8px 0}
.option b{display:block;margin-bottom:5px}
.close{border:0;background:none;font-size:20px}
.hidden{display:none}
@media(max-width:480px){
.stats{grid-template-columns:repeat(2,1fr)}
.actions{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="app">

<header class="top">
  <div class="row">
    <div>
      <div class="name">無名選手</div>
      <div class="muted" id="career">18歲｜業餘選手｜AP-A</div>
    </div>
    <div class="muted" id="money">資源 30</div>
  </div>

  <div class="badges">
    <span class="badge" id="position">MID｜適性 84</span>
    <span class="badge">進攻型</span>
    <span class="badge">專門：戰士</span>
    <span class="badge good" id="versionState">版本受益</span>
  </div>

  <div class="stats">
    <div class="stat"><b id="op">82</b><span>操作</span></div>
    <div class="stat"><b id="iq">74</b><span>觀念</span></div>
    <div class="stat"><b id="team">69</b><span>團隊</span></div>
    <div class="stat"><b id="exp">38</b><span>經驗</span></div>
  </div>

  <div class="progress">
    <i class="on"></i><i></i><i></i><i></i>
  </div>
</header>

<main class="main">

<section class="card">
  <h2 id="stage">業餘賽季｜春季</h2>
  <div class="version" id="version">本季版本：操作與主動進攻</div>

  <div class="scores">
    <div class="score">
      <span>隊伍評分</span>
      <b id="teamScore">63</b>
    </div>
    <div class="score">
      <span>隊伍版本適合度</span>
      <b id="fit">78</b>
    </div>
  </div>

  <button class="primary" onclick="openTraining()">選擇訓練</button>
</section>

<section class="card event">
  <h3>⚡ 突發事件</h3>
  <div id="event">你的比賽片段被社群轉發，開始有人注意到你。</div>
  <button class="secondary" onclick="eventAction()">處理事件</button>
</section>

<section class="card">
  <h3>💡 小提示</h3>
  <div class="tip" id="tip">
    你的操作已經偏高，繼續提升的成本會逐漸增加。可以考慮補強觀念。
  </div>
</section>

<section class="card">
  <h3>現在可以做什麼？</h3>

  <div class="actions">
    <button class="action" onclick="openTraining()">
      🎮 遊戲訓練
      <small>提升能力</small>
    </button>

    <button class="action" onclick="openHealth()">
      ❤️ 健康訓練
      <small>延長生涯</small>
    </button>

    <button class="action" onclick="openPR()">
      📣 公關訓練
      <small>提升人氣</small>
    </button>
  </div>
</section>

<button class="secondary" onclick="nextPhase()">進入下一階段 →</button>

</main>
</div>

<div class="modal hidden" id="modal" onclick="closeModal(event)">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="row">
      <h2 id="modalTitle">選擇</h2>
      <button class="close" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>

const game={
  age:18,
  season:1,
  phase:0,
  money:30,

  op:82,
  iq:74,
  team:69,
  exp:38,

  soft:{
    op:91,
    iq:88,
    team:83,
    exp:95
  },

  position:"MID",
  style:"進攻型",
  specialty:"戰士",

  teamScore:63,
  fit:78,

  version:"操作與主動進攻",
  versionState:"版本受益"
};

const versions=[
  "操作與主動進攻",
  "觀念與團隊協作",
  "發育與資源管理",
  "前期打架與支援"
];

function render(){

  document.getElementById("career").textContent=
    `${game.age}歲｜${game.age<19?"業餘選手":"職業選手"}｜AP-${String.fromCharCode(65+(game.season%4))}`;

  document.getElementById("money").textContent=`資源 ${game.money}`;

  document.getElementById("op").textContent=game.op;
  document.getElementById("iq").textContent=game.iq;
  document.getElementById("team").textContent=game.team;
  document.getElementById("exp").textContent=game.exp;

  document.getElementById("position").textContent=
    `${game.position}｜適性 ${positionFit()}`;

  document.getElementById("versionState").textContent=game.versionState;

  document.getElementById("versionState").className=
    "badge "+(game.versionState==="逆版本"?"warn":"good");

  document.getElementById("teamScore").textContent=game.teamScore;
  document.getElementById("fit").textContent=game.fit;

  document.getElementById("version").textContent=
    `本季版本：${game.version}`;

  updateTip();
}

function positionFit(){

  return Math.round(
    game.op*.35+
    game.iq*.30+
    game.team*.20+
    game.exp*.15
  );
}

function updateTip(){

  const data=[
    ["op","操作"],
    ["iq","觀念"],
    ["team","團隊"],
    ["exp","經驗"]
  ];

  data.sort((a,b)=>
    game[a[0]]/game.soft[a[0]]-
    game[b[0]]/game.soft[b[0]]
  );

  const key=data[0][0];
  const label=data[0][1];

  const value=game[key];
  const limit=game.soft[key];

  const ratio=Math.max(
    0,
    (value-60)/(limit-60)
  );

  const cost=Math.max(
    1,
    Math.round(1+ratio*ratio*9)
  );

  let text=
    `目前較值得投資：${label}。`+
    `你的${label}為 ${value}，`+
    `軟上限約 ${limit}，`+
    `下一點成長成本約 ${cost}。`;

  if(game.versionState==="逆版本"){
    text+=
      "目前版本對你的風格較不利，補足相關能力可能更容易走遠。";
  }else{
    text+=
      "目前版本與你的打法相性不錯，可以把資源投入最值得成長的能力。";
  }

  document.getElementById("tip").textContent=text;
}

function openModal(title,body){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").innerHTML=body;
  document.getElementById("modal").classList.remove("hidden");
}

function closeModal(e){
  if(!e || e.target.id==="modal"){
    document.getElementById("modal").classList.add("hidden");
  }
}

function openTraining(){

  openModal("🎮 遊戲訓練",`

    ${trainingOption("op","操作")}

    ${trainingOption("iq","觀念")}

    ${trainingOption("team","團隊")}

  `);
}

function trainingOption(key,label){

  const value=game[key];
  const limit=game.soft[key];

  return `
    <div class="option">
      <b>${label}</b>
      <div class="muted">
        目前 ${value} ／ 軟上限 ${limit}
      </div>
      <button class="primary"
        onclick="train('${key}')">
        訓練
      </button>
    </div>
  `;
}

function train(key){

  if(game[key]>=game.soft[key]){
    alert("已接近這項能力的軟上限。");
    return;
  }

  const ratio=
    (game[key]-60)/
    (game.soft[key]-60);

  const cost=
    Math.max(
      1,
      Math.round(1+ratio*ratio*9)
    );

  if(game.money<cost){
    alert("資源不足。");
    return;
  }

  game.money-=cost;
  game[key]++;

  if(key==="iq" && game.versionState==="逆版本"){
    game.fit=Math.min(99,game.fit+2);
  }

  closeModal();
  render();
}

function openHealth(){

  openModal("❤️ 健康訓練",`
    <div class="option">
      <b>規律訓練</b>
      <div class="muted">
        消耗少量資源，降低長期生涯風險。
      </div>
      <button class="primary" onclick="health()">
        進行
      </button>
    </div>
  `);
}

function health(){

  game.money=Math.max(0,game.money-2);

  closeModal();
  render();
}

function openPR(){

  openModal("📣 公關訓練",`
    <div class="option">
      <b>經營人氣</b>
      <div class="muted">
        提升人氣與未來商業價值。
      </div>
      <button class="primary" onclick="pr()">
        進行
      </button>
    </div>
  `);
}

function pr(){

  game.money+=3;

  closeModal();
  render();
}

function eventAction(){

  const events=[

    {
      text:"你的精彩片段被大量轉發，人氣上升。",
      action:()=>game.money+=5
    },

    {
      text:"隊伍希望你接受賽後採訪。",
      action:()=>{
        game.money+=2;
        game.team++;
      }
    },

    {
      text:"版本更新，觀念與團隊協作的重要性提高。",
      action:()=>{
        game.version="觀念與團隊協作";
        game.versionState="逆版本";
        game.fit=Math.max(55,game.fit-8);
      }
    }

  ];

  const e=events[game.season%events.length];

  e.action();

  document.getElementById("event").textContent=e.text;

  render();
}

function nextPhase(){

  game.phase++;

  if(game.phase%3===0){

    game.age++;
    game.season++;

    game.exp+=2;

    game.teamScore=Math.min(
      95,
      game.teamScore+
      Math.round(Math.random()*8)
    );

    game.fit=Math.min(
      98,
      Math.max(
        60,
        game.fit+
        Math.round(Math.random()*10-5)
      )
    );

    game.version=
      versions[game.season%versions.length];

    game.versionState=
      game.season%3===0
      ?"逆版本"
      :game.season%3===1
      ?"版本受益"
      :"正常";

    document.getElementById("event").textContent=
      "新賽季開始。版本與你的職業環境發生變化。";
  }

  render();
}

render();

</script>

</body>
</html>
