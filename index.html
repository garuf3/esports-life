<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoL 電競人生模擬器</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    background:#0a0f1d;
    color:#e9eef8;
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    max-width:1050px;
    min-height:100vh;
    margin:auto;
    padding-bottom:82px;
}

/* =========================
   TOP
========================= */

.top{
    position:sticky;
    top:0;
    z-index:50;
    padding:13px 17px;
    background:rgba(10,15,29,.94);
    backdrop-filter:blur(14px);
    border-bottom:1px solid #252e44;
}

.topline{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
}

.top-name{
    font-size:18px;
    font-weight:900;
}

.top-sub{
    margin-top:2px;
    color:#8792a9;
    font-size:12px;
}

.age-pill{
    padding:7px 12px;
    border-radius:999px;
    background:#182238;
    color:#cbd5ea;
    font-size:12px;
    white-space:nowrap;
}

/* =========================
   MAIN
========================= */

main{
    padding:15px;
}

.card{
    background:#11182a;
    border:1px solid #252e44;
    border-radius:15px;
    padding:15px;
    margin-bottom:13px;
}

.title{
    font-size:21px;
    font-weight:900;
    margin:4px 0;
}

.subtitle{
    color:#8995ad;
    font-size:13px;
    line-height:1.55;
}

.card-title{
    font-size:15px;
    font-weight:850;
    margin-bottom:11px;
}

.muted{
    color:#8995ad;
}

/* =========================
   CHARACTER CREATION
========================= */

.create-header{
    text-align:center;
    padding:15px 5px 18px;
}

.create-logo{
    font-size:34px;
    margin-bottom:7px;
}

.create-title{
    font-size:25px;
    font-weight:950;
}

.create-sub{
    color:#8995ad;
    font-size:13px;
    margin-top:5px;
}

label{
    display:block;
    font-size:12px;
    color:#aeb8cc;
    margin-top:10px;
}

.input{
    width:100%;
    margin-top:5px;
    padding:11px 12px;
    border:1px solid #2b3650;
    border-radius:9px;
    background:#0c1322;
    color:#fff;
    outline:none;
}

.input:focus{
    border-color:#657cff;
}

.option-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.option{
    border:1px solid #2b3650;
    background:#0d1525;
    color:#cbd5e7;
    border-radius:10px;
    padding:11px 7px;
    transition:.15s;
}

.option:hover{
    background:#17223a;
}

.option.active{
    background:#26365f;
    border-color:#7387ff;
    color:#fff;
    font-weight:800;
}

.option small{
    display:block;
    margin-top:3px;
    color:#7f8ca5;
    font-size:10px;
}

.option.active small{
    color:#bac7ef;
}

.create-status{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:10px;
}

.status-pill{
    padding:6px 9px;
    border-radius:999px;
    background:#182238;
    color:#9da9bf;
    font-size:11px;
}

.status-pill.done{
    background:#203454;
    color:#c8d6ff;
}

.start-btn{
    width:100%;
    border:0;
    border-radius:11px;
    padding:13px;
    margin-top:10px;
    background:#536dfe;
    color:#fff;
    font-weight:900;
}

.start-btn:disabled{
    background:#252d40;
    color:#68748b;
    cursor:not-allowed;
}

/* =========================
   STATS
========================= */

.stat{
    margin:13px 0;
}

.stat-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
}

.stat-name{
    font-weight:750;
}

.stat-number{
    color:#b9c4d9;
    font-size:12px;
}

.bar{
    height:11px;
    border-radius:999px;
    overflow:hidden;
    background:#202a40;
}

.fill{
    height:100%;
    border-radius:999px;
    background:linear-gradient(
        90deg,
        #536dfe,
        #8d9cff
    );
}

.distance{
    margin-top:4px;
    color:#748098;
    font-size:10px;
}

/* =========================
   STYLE
========================= */

.style-box{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    background:#0d1424;
    border-radius:12px;
    padding:12px;
}

.style-name{
    font-size:18px;
    font-weight:900;
}

.style-desc{
    margin-top:3px;
    color:#8290a9;
    font-size:11px;
}

.style-score{
    text-align:right;
}

.style-score b{
    font-size:18px;
}

/* =========================
   EVENT
========================= */

.event-text{
    font-size:14px;
    line-height:1.7;
    color:#d8dfec;
}

.event-meta{
    color:#73809a;
    font-size:11px;
    margin-bottom:8px;
}

.choice{
    width:100%;
    margin-top:8px;
    text-align:left;
    border:1px solid #29354d;
    background:#0d1525;
    color:#e8edf7;
    border-radius:11px;
    padding:11px 12px;
}

.choice:hover{
    background:#17233a;
}

.choice-title{
    font-weight:850;
}

.choice-effect{
    color:#8794ab;
    font-size:11px;
    margin-top:4px;
}

/* =========================
   CLUBS
========================= */

.club-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
}

.club{
    background:#0d1525;
    border:1px solid #29344c;
    border-radius:13px;
    padding:13px;
}

.club-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
}

.club-name{
    font-size:16px;
    font-weight:900;
}

.club-region{
    color:#77849d;
    font-size:10px;
    margin-top:2px;
}

.stars{
    white-space:nowrap;
    font-size:12px;
    letter-spacing:1px;
}

.club-desc{
    color:#9ba7bc;
    font-size:11px;
    line-height:1.55;
    margin:9px 0;
}

.club-stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
}

.club-stat{
    padding:7px;
    background:#141d30;
    border-radius:8px;
}

.club-stat b{
    display:block;
    font-size:11px;
}

.club-stat span{
    display:block;
    color:#76839b;
    font-size:9px;
    margin-top:2px;
}

.club-status{
    margin-top:8px;
    padding:8px;
    border-radius:8px;
    font-size:11px;
}

.good{
    background:#163326;
    color:#91d7ad;
}

.mid{
    background:#302d19;
    color:#d7c47b;
}

.bad{
    background:#321c24;
    color:#d994a5;
}

.club-btn{
    width:100%;
    margin-top:8px;
    padding:9px;
    border:0;
    border-radius:9px;
    background:#29385d;
    color:#fff;
    font-weight:750;
}

/* =========================
   LOCKED
========================= */

.locked{
    opacity:.42;
    filter:grayscale(.3);
}

.lock-message{
    text-align:center;
    padding:35px 10px;
}

.lock-icon{
    font-size:34px;
    margin-bottom:8px;
}

/* =========================
   SAVE
========================= */

.save-btn{
    width:100%;
    margin-top:8px;
    padding:11px;
    border:1px solid #2b3650;
    border-radius:10px;
    background:#10182a;
    color:#e9eef8;
}

.save-btn:hover{
    background:#18233a;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:min(1050px,100%);
    height:68px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    background:rgba(10,15,29,.97);
    border-top:1px solid #252e44;
    z-index:100;
}

.nav-btn{
    border:0;
    background:none;
    color:#707d95;
    font-size:11px;
}

.nav-btn.active{
    color:#dce4ff;
}

.nav-btn:disabled{
    color:#343e52;
    cursor:not-allowed;
}

.nav-icon{
    display:block;
    font-size:18px;
    margin-bottom:2px;
}

/* =========================
   DESKTOP
========================= */

@media(min-width:700px){

    main{
        padding:20px;
    }

    .create-layout{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:14px;
    }

}

/* =========================
   MOBILE
========================= */

@media(max-width:699px){

    main{
        padding:11px;
    }

    .card{
        padding:13px;
        border-radius:13px;
    }

    .club-grid{
        grid-template-columns:1fr;
    }

    .option-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .title{
        font-size:19px;
    }

    .create-title{
        font-size:22px;
    }
}

@media(max-width:370px){

    .option-grid{
        grid-template-columns:1fr 1fr;
    }

}
</style>
</head>

                        ${regionButton("LPL","中國")}
                        ${regionButton("LEC","歐洲")}
                        ${regionButton("LCS","北美")}
                        ${regionButton("CBLOL","巴西")}

                    </div>

                </div>

            </div>


            <div>

                <div class="card">

                    <div class="card-title">
                        ③ 主要位置
                    </div>

                    <div class="subtitle">
                        這會影響你之後遇到的隊伍陣容與先發競爭。
                    </div>

                    <div class="option-grid" style="margin-top:10px">

                        ${roleButton("TOP","上路")}
                        ${roleButton("JUG","打野")}
                        ${roleButton("MID","中路")}
                        ${roleButton("ADC","下路")}
                        ${roleButton("SUP","輔助")}

                    </div>

                </div>


                <div class="card">

                    <div class="card-title">
                        建立狀態
                    </div>

                    <div class="create-status">

                        <div class="status-pill ${player.name.trim()?"done":""}">
                            ${player.name.trim()?"✓":"○"} 姓名
                        </div>

                        <div class="status-pill ${player.id.trim()?"done":""}">
                            ${player.id.trim()?"✓":"○"} ID
                        </div>

                        <div class="status-pill ${player.region?"done":""}">
                            ${player.region?"✓":"○"} 賽區
                        </div>

                        <div class="status-pill ${player.role?"done":""}">
                            ${player.role?"✓":"○"} 位置
                        </div>

                    </div>


                    <button
                        class="start-btn"
                        onclick="createPlayer()"
                        ${complete ? "" : "disabled"}>

                        ${complete
                            ? "開始我的職業生涯"
                            : "請完成以上資料"}

                    </button>

                </div>

            </div>

        </div>

    `;
}


/* =========================================================
   建立頁按鈕
========================================================= */

function regionButton(id,desc){

    return `
        <button
            class="option ${player.region===id?"active":""}"
            onclick="selectRegion('${id}')">

            ${id}

            <small>${desc}</small>

        </button>
    `;
}


function roleButton(id,desc){

    return `
        <button
            class="option ${player.role===id?"active":""}"
            onclick="selectRole('${id}')">

            ${id}

            <small>${desc}</small>

        </button>
    `;
}


/* =========================================================
   重要：
   這些函式只修改資料，
   不會跳頁。
========================================================= */

function updateName(value){

    player.name = value;

    refreshCreation();
}


function updateID(value){

    player.id = value;

    refreshCreation();
}


function selectRegion(region){

    player.region = region;

    refreshCreation();
}


function selectRole(role){

    player.role = role;

    refreshCreation();
}


/*
   重新繪製「建立角色」時，
   會先保存 player 裡的資料。
   所以不會洗掉姓名、ID、賽區、位置。
*/

function refreshCreation(){

    if(player.created){
        return;
    }

    document.getElementById("screen").innerHTML =
        creationScreen();

    updateTop();
}


/* =========================================================
   真正建立角色
========================================================= */

function createPlayer(){

    if(
        !player.name.trim() ||
        !player.id.trim() ||
        !player.region ||
        !player.role
    ){
        return;
    }

    player.created = true;

    player.style = calculateStyle();

    enableNavigation();

    render();

}


/* =========================================================
   風格判定
========================================================= */

function calculateStyle(){

    const s = player.stats;

    const arr = [
        ["操作型",s.operation],
        ["理解型",s.gameSense],
        ["心態型",s.mentality],
        ["體能型",s.stamina]
    ];

    arr.sort((a,b)=>b[1]-a[1]);

    if(arr[0][1] < 60){
        return "尚未定型";
    }

    if(arr[0][1] - arr[1][1] >= 12){
        return arr[0][0];
    }

    return "均衡型";
}


/* =========================================================
   數值
========================================================= */

function statHTML(name,value){

    return `

        <div class="stat">

            <div class="stat-head">

                <span class="stat-name">
                    ${name}
                </span>

                <span class="stat-number">
                    ${value} / 100
                </span>

            </div>


            <div class="bar">

                <div
                    class="fill"
                    style="width:${value}%">
                </div>

            </div>


            <div class="distance">

                距離登頂還差 ${100-value} 點

            </div>

        </div>

    `;
}


/* =========================================================
   人生首頁
========================================================= */

function lifeScreen(){

    player.style = calculateStyle();

    const s = player.stats;

    return `

        <div class="title">
            ${player.year}・職業人生
        </div>

        <div class="subtitle">
            你的第一個職業賽季即將開始。
        </div>


        <div class="card">

            <div class="card-title">
                目前狀態
            </div>


            <div class="style-box">

                <div>

                    <div class="style-name">
                        ${player.style}
                    </div>

                    <div class="style-desc">
                        你的英雄池／能力傾向正在形成
                    </div>

                </div>


                <div class="style-score">

                    <div class="muted">
                        年齡
                    </div>

                    <b>
                        ${player.age}
                    </b>

                </div>

            </div>


            ${statHTML("操作",s.operation)}
            ${statHTML("遊戲理解",s.gameSense)}
            ${statHTML("心態",s.mentality)}
            ${statHTML("體力",s.stamina)}

        </div>


        <div class="card">

            <div class="card-title">
                📰 今日事件
            </div>

            <div class="event-meta">
                ${player.year}年・職業生涯早期
            </div>


            <div class="event-text">

                你坐在訓練室裡，看著螢幕上的比賽資料。
                以前你只覺得自己「打得不錯」，但現在開始有人認真評估你的潛力。
                這可能是成為職業選手的第一步，也可能只是短暫的幻想。

            </div>


            <button
                class="choice"
                onclick="doTraining()">

                <div class="choice-title">
                    🎯 認真進行一次賽訓
                </div>

                <div class="choice-effect">
                    操作 +2 ・ 遊戲理解 +1
                </div>

            </button>


            <button
                class="choice"

                <div class="choice-title">

                <div class="choice-effect">

                </div>

            </button>

        </div>

    `;
}


/* =========================================================
   賽訓
========================================================= */

function doTraining(){

    player.stats.operation =
        Math.min(100,player.stats.operation+2);

    player.stats.gameSense =
        Math.min(100,player.stats.gameSense+1);

    player.stats.stamina =
        Math.max(0,player.stats.stamina-1);

    alert(
        "你完成了一次高強度賽訓。\n\n" +
        "操作 +2\n" +
        "遊戲理解 +1\n" +
        "體力 -1"
    );

    render();

}


/* =========================================================
   俱樂部
========================================================= */

function clubScreen(){

    const domestic =
        CLUBS.filter(c=>c.region===player.region);

    const overseas =
        CLUBS.filter(c=>c.region!==player.region);


    return `

        <div class="title">
            俱樂部市場
        </div>

        <div class="subtitle">
            你可以觀察哪些隊伍適合你的職業道路。
        </div>


        <div class="card">

            <div class="card-title">
                🏠 ${player.region}・本賽區
            </div>

            <div class="club-grid">

                ${
                    domestic.length
                    ? domestic.map(clubHTML).join("")
                    : `<div class="muted">目前沒有資料。</div>`
                }

            </div>

        </div>


        <div class="card">

            <div class="card-title">
                🌏 海外隊伍
            </div>

            <div class="subtitle" style="margin-bottom:10px">
                海外隊伍通常具有更高曝光與國際賽機會，但競爭也可能更加激烈。
            </div>

            <div class="club-grid">

                ${
                    overseas.map(clubHTML).join("")
                }

            </div>

        </div>

    `;
}


/* =========================================================
   俱樂部卡
========================================================= */

function clubHTML(club){

    const stars =
        "★".repeat(club.stars) +
        "☆".repeat(5-club.stars);


    const currentAbility =
        Math.round(
            (
                player.stats.operation +
                player.stats.gameSense +
                player.stats.mentality
            ) / 3
        );


    const enemy =
        club.roster[player.role] || 80;


    let chance =
        50 + (currentAbility-enemy)*2;


    chance =
        Math.max(5,Math.min(95,chance));


    let statusClass;
    let statusText;


    if(chance>=70){

        statusClass="good";
        statusText=
            `🟢 先發機會不錯・預估 ${Math.round(chance)}%`;

    }
    else if(chance>=40){

        statusClass="mid";
        statusText=
            `🟡 需要競爭・預估 ${Math.round(chance)}%`;

    }
    else{

        statusClass="bad";
        statusText=
            `🔴 先發競爭激烈・預估 ${Math.round(chance)}%`;

    }


    const champion =
        club.stars>=5
        ? "🏆 冠軍熱門"
        : club.stars>=4
        ? "⚔️ 強力競爭者"
        : "🌱 挑戰者";


    return `

        <div class="club">

            <div class="club-top">

                <div>

                    <div class="club-name">
                        ${club.name}
                    </div>

                    <div class="club-region">
                        ${club.region}・${club.history}
                    </div>

                </div>

                <div class="stars">
                    ${stars}
                </div>

            </div>


            <div class="club-desc">
                ${club.desc}
            </div>


            <div class="club-stats">

                <div class="club-stat">

                    <b>
                        ${"★".repeat(club.academy)}
                    </b>

                    <span>
                        青訓能力
                    </span>

                </div>


                <div class="club-stat">

                    <b>
                        ${"★".repeat(club.international)}
                    </b>

                    <span>
                        國際競爭力
                    </span>

                </div>


                <div class="club-stat">

                    <b>
                        ${champion}
                    </b>

                    <span>
                        戰隊定位
                    </span>

                </div>


                <div class="club-stat">

                    <b>
                        ${club.roster[player.role] || "—"}
                    </b>

                    <span>
                        目前該位置強度
                    </span>

                </div>

            </div>


            <div class="club-status ${statusClass}">
                ${statusText}
            </div>


            <button
                class="club-btn"
                onclick="clubOffer('${club.id}')">

                查看青訓邀請

            </button>

        </div>

    `;
}


/* =========================================================
   俱樂部邀請
========================================================= */

function clubOffer(id){

    const club =
        CLUBS.find(c=>c.id===id);

    if(!club)return;


    const currentAbility =
        Math.round(
            (
                player.stats.operation +
                player.stats.gameSense +
                player.stats.mentality
            )/3
        );


    const opponent =
        club.roster[player.role] || 80;


    let chance =
        Math.max(
            5,
            Math.min(
                95,
                50+(currentAbility-opponent)*2
            )
        );


    const result =
        chance>=45
        ? "教練團對你的潛力產生了興趣。"
        : "教練團認為你目前還需要更多時間成長。";


    alert(
        `${club.name}\n\n` +
        `${result}\n\n` +
        `青訓邀請評估：${Math.round(chance)}%`
    );


    if(chance>=45){

        player.club = club.id;

        alert(
            `你加入了 ${club.name} 的青訓體系。\n\n` +
            "你的職業生涯正式開始。"
        );

        navigate("life");

    }

}


/* =========================================================
   存檔
========================================================= */

function saveScreen(){

    const hasSave =
        !!localStorage.getItem("lolLifeSave");


    return `

        <div class="title">
            存檔
        </div>

        <div class="subtitle">
            遊戲不會自動讀取存檔。
        </div>


        <div class="card">

            <div class="card-title">
                💾 遊戲進度
            </div>


            <button
                class="save-btn"
                onclick="saveGame()">

                💾 儲存目前進度

            </button>


            <button
                class="save-btn"
                onclick="loadGame()">

                📂 讀取存檔
                ${hasSave?"":"（目前沒有存檔）"}

            </button>


            <button
                class="save-btn"
                onclick="resetGame()">

                🔄 重置遊戲

            </button>

        </div>


        <div class="card">

            <div class="card-title">
                存檔規則
            </div>

            <div class="subtitle">

                關閉網頁後再次開啟，
                遊戲會從新的職業人生開始。

                只有你主動按下「讀取存檔」，
                才會恢復之前的進度。

            </div>

        </div>

    `;
}


function saveGame(){

    localStorage.setItem(
        "lolLifeSave",
        JSON.stringify(player)
    );

    alert("存檔成功。");

}


function loadGame(){

    const data =
        localStorage.getItem("lolLifeSave");


    if(!data){

        alert("目前沒有存檔。");
        return;

    }


    try{

        player =
            JSON.parse(data);

        player.created = true;

        enableNavigation();

        navigate("life");

        alert("讀檔成功。");

    }
    catch(e){

        alert("存檔資料損壞。");

    }

}


function resetGame(){

    if(
        !confirm(
            "確定要刪除目前進度並重新開始嗎？"
        )
    ){
        return;
    }


    localStorage.removeItem(
        "lolLifeSave"
    );


    loadInitial();

}


/* =========================================================
   導覽
========================================================= */

function navigate(page){

    /*
       角色還沒建立：
       只能留在建立頁。
    */

    if(!player.created){

        render();
        return;

    }


    document
        .querySelectorAll(".nav-btn")
        .forEach(btn=>{
            btn.classList.remove("active");
        });


    if(page==="life"){

        document
            .getElementById("navLife")
            .classList.add("active");

        document
            .getElementById("screen")
            .innerHTML =
            lifeScreen();

    }


    if(page==="club"){

        document
            .getElementById("navClub")
            .classList.add("active");

        document
            .getElementById("screen")
            .innerHTML =
            clubScreen();

    }


    if(page==="save"){

        document
            .getElementById("navSave")
            .classList.add("active");

        document
            .getElementById("screen")
            .innerHTML =
            saveScreen();

    }


    updateTop();

}


/* =========================================================
   啟用底部導覽
========================================================= */

function enableNavigation(){

    document
        .getElementById("navClub")
        .disabled=false;

    document
        .getElementById("navSave")
        .disabled=false;

}


/* =========================================================
   Render
========================================================= */

function render(){

    const screen =
        document.getElementById("screen");


    if(!player.created){

        screen.innerHTML =
            creationScreen();

        updateTop();

        return;

    }


    enableNavigation();

    screen.innerHTML =
        lifeScreen();

    document
        .querySelectorAll(".nav-btn")
        .forEach(btn=>{
            btn.classList.remove("active");
        });

    document
        .getElementById("navLife")
        .classList.add("active");

    updateTop();

}


/* =========================================================
   TOP
========================================================= */

function updateTop(){

    document
        .getElementById("topName")
        .textContent =
        player.created
        ? `${player.name}「${player.id}」`
        : "尚未建立選手";


    document
        .getElementById("topSub")
        .textContent =
        player.created
        ? `${player.region} · ${player.role} · ${player.year}`
        : "建立你的職業人生";


    document
        .getElementById("topAge")
        .textContent =
        `${player.age}歲`;

}


/* =========================================================
   HTML 安全
========================================================= */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================================
   啟動
========================================================= */

loadInitial();

</script>

</body>
</html>
