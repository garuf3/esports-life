<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電競人生模擬器</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #15171c;
    color: #eee;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
}

#app {
    max-width: 950px;
    width: 94%;
    margin: 25px auto 50px;
}

/* ===== 共用 ===== */

.panel {
    background: #22252c;
    border: 1px solid #363a44;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 12px;
}

button {
    font-family: inherit;
    cursor: pointer;
}

/* ===== 開始設定 ===== */

.setup h1 {
    margin-top: 0;
}

.desc {
    color: #aaa;
    line-height: 1.8;
}

.section-title {
    font-size: 18px;
    font-weight: bold;
    margin: 25px 0 10px;
}

.option-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.option {
    background: #2c3038;
    border: 1px solid #414650;
    border-radius: 10px;
    color: white;
    padding: 14px;
    text-align: left;
}

.option:hover {
    background: #373c46;
}

.option.selected {
    border-color: white;
    background: #3b404a;
}

.option strong {
    display: block;
    margin-bottom: 5px;
}

.option small {
    color: #aaa;
    line-height: 1.5;
}

.start {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: 0;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
}

/* ===== 頂部 ===== */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.game-title {
    font-size: 25px;
    font-weight: bold;
}

.year {
    text-align: right;
    color: #aaa;
}

.year strong {
    display: block;
    color: white;
    font-size: 20px;
}

/* ===== 數值 ===== */

.stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
}

.stat {
    background: #22252c;
    border: 1px solid #363a44;
    border-radius: 10px;
    padding: 11px;
    text-align: center;
}

.stat-name {
    color: #999;
    font-size: 12px;
}

.stat-value {
    font-size: 22px;
    font-weight: bold;
    margin-top: 4px;
}

/* ===== 身分 ===== */

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.tag {
    background: #30343c;
    border-radius: 20px;
    padding: 6px 11px;
    font-size: 13px;
}

/* ===== 時間軸 ===== */

.timeline {
    display: flex;
    gap: 5px;
    margin-bottom: 12px;
}

.timeline div {
    flex: 1;
    text-align: center;
    padding: 8px 3px;
    border-radius: 7px;
    background: #282b32;
    color: #777;
    font-size: 12px;
}

.timeline .active {
    background: #454a55;
    color: white;
}

/* ===== 事件 ===== */

.event-date {
    color: #888;
    font-size: 13px;
    margin-bottom: 8px;
}

.event-title {
    font-size: 27px;
    font-weight: bold;
    margin-bottom: 15px;
}

.event-text {
    line-height: 1.9;
    color: #d4d4d4;
    white-space: pre-line;
    margin-bottom: 22px;
}

.choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.choice {
    background: #2c3038;
    border: 1px solid #414650;
    color: white;
    border-radius: 10px;
    padding: 14px;
    text-align: left;
}

.choice:hover {
    background: #373c46;
}

.choice-title {
    font-weight: bold;
    font-size: 16px;
}

.choice-effect {
    color: #999;
    font-size: 13px;
    margin-top: 5px;
}

/* ===== 結果 ===== */

.result {
    background: #191b20;
    border: 1px solid #383c45;
    border-radius: 10px;
    padding: 16px;
    line-height: 1.8;
    white-space: pre-line;
}

.continue {
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    border: 0;
    border-radius: 9px;
    background: #eee;
    color: #111;
    font-size: 16px;
    font-weight: bold;
}

/* ===== 英雄池 ===== */

.hero-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.hero {
    background: #191b20;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
}

.hero-name {
    color: #999;
    font-size: 12px;
}

.hero-value {
    font-size: 19px;
    margin-top: 5px;
}

/* ===== 底部 ===== */

.bottom {
    display: flex;
    gap: 8px;
}

.bottom button {
    flex: 1;
    padding: 10px;
    background: #22252c;
    border: 1px solid #363a44;
    color: #ccc;
    border-radius: 8px;
}

/* ===== 年度結算 ===== */

.summary h2 {
    margin-top: 0;
}

.summary-line {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #363a44;
    padding: 11px 0;
}

.next {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    border: 0;
    border-radius: 9px;
    font-weight: bold;
    font-size: 16px;
}

/* ===== RWD ===== */

@media(max-width:700px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .option-grid {
        grid-template-columns: 1fr;
    }

    .hero-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
    }

    .year {
        text-align: left;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

/* =========================================================
   玩家
========================================================= */

let player = {
    age: 16,
    year: 2026,

    region: "",
    position: "",
    style: "",
    language: "",

    skill: 50,
    sense: 50,
    mental: 50,
    stamina: 50,
    fame: 0,

    experience: 0,

    career: "高中生",
    club: "",

    hero: {
        assassin: 50,
        mage: 50,
        poke: 50,
        utility: 50
    },

    eventIndex: 0,

    /*
       一年四個階段：

       0 年初
       1 訓練期
       2 賽事
       3 休賽期
    */

    phase: 0,

    seasonResult: "",
    history: [],

    savedBeforeChoice: null
};


/* =========================================================
   建立畫面
========================================================= */

function renderSetup() {

    document.getElementById("app").innerHTML = `
    
    <div class="panel setup">

        <h1>🎮 電競人生模擬器</h1>

        <div class="desc">
            你將從16歲開始自己的電競人生。
            <br>
            每年只需要做幾次重要決定。
            訓練會影響比賽，而比賽結果會影響你的職業生涯。
        </div>


        <div class="section-title">
            🌏 出身賽區
        </div>

        <div class="option-grid">

            ${setupOption("region","LCK","🇰🇷 LCK","韓國")}
            ${setupOption("region","LPL","🇨🇳 LPL","中國")}
            ${setupOption("region","LEC","🇪🇺 LEC","歐洲")}
            ${setupOption("region","LCS","🇺🇸 LCS","北美")}
            ${setupOption("region","LCP","🌏 LCP","亞太")}
            ${setupOption("region","CBLOL","🇧🇷 CBLOL","巴西")}

        </div>


        <div class="section-title">
            🛣️ 位置
        </div>

        <div class="option-grid">

            ${setupOption("position","TOP","🛡️ TOP","上路")}
            ${setupOption("position","JUNGLE","🌲 JUNGLE","打野")}
            ${setupOption("position","MID","⚔️ MID","中路")}
            ${setupOption("position","ADC","🎯 ADC","下路")}
            ${setupOption("position","SUPPORT","🧭 SUPPORT","輔助")}

        </div>


        <div class="section-title">
            🎮 英雄池發展
        </div>

        <div class="option-grid">

            ${setupOption(
                "style",
                "specialist",
                "🔪 專精型",
                "某一類英雄成長較快"
            )}

            ${setupOption(
                "style",
                "wide",
                "📚 廣泛型",
                "不同類型平均成長"
            )}

            ${setupOption(
                "style",
                "balanced",
                "⚖️ 平衡型",
                "所有類型正常成長"
            )}

        </div>


        <div class="section-title">
            🗣️ 語言
        </div>

        <div class="option-grid">

            ${setupOption(
                "language",
                "native",
                "🗣️ 本土語言",
                "本土交流容易"
            )}

            ${setupOption(
                "language",
                "english",
                "🌎 英語",
                "英語環境適應較好"
            )}

            ${setupOption(
                "language",
                "korean",
                "🇰🇷 韓語",
                "韓國交流較容易"
            )}

            ${setupOption(
                "language",
                "multi",
                "🌐 多語言",
                "海外交流能力較高"
            )}

        </div>


        <button
            class="start"
            id="startBtn"
            onclick="startGame()"
            disabled
        >
            開始人生
        </button>

    </div>
    `;
}


let setup = {
    region: "",
    position: "",
    style: "",
    language: ""
};


function setupOption(type,value,title,desc) {

    let selected =
        setup[type] === value
        ? "selected"
        : "";

    return `
    
    <button
        class="option ${selected}"
        onclick="selectSetup('${type}','${value}')"
    >
        <strong>${title}</strong>
        <small>${desc}</small>
    </button>
    
    `;
}


function selectSetup(type,value) {

    setup[type] = value;

    renderSetup();

    if (
        setup.region &&
        setup.position &&
        setup.style &&
        setup.language
    ) {
        document.getElementById("startBtn").disabled = false;
    }
}


/* =========================================================
   開始
========================================================= */

function startGame() {

    player.region = setup.region;
    player.position = setup.position;
    player.style = setup.style;
    player.language = setup.language;

    player.age = 16;
    player.year = 2026;

    player.phase = 0;
    player.eventIndex = 0;

    player.history = [];

    applyStyle();

    renderGame();

    showPhase();
}


function applyStyle() {

    if (player.style === "specialist") {

        player.hero.assassin = 65;
        player.hero.mage = 45;
        player.hero.poke = 45;
        player.hero.utility = 45;

    }

    if (player.style === "wide") {

        player.hero.assassin = 52;
        player.hero.mage = 52;
        player.hero.poke = 52;
        player.hero.utility = 52;

    }

}


/* =========================================================
   主畫面
========================================================= */

function renderGame() {

    document.getElementById("app").innerHTML = `

    <div class="panel header">

        <div class="game-title">
            🎮 電競人生模擬器
        </div>

        <div class="year">
            <strong>${player.year}</strong>
            ${player.age} 歲
        </div>

    </div>


    <div class="stats">

        ${stat("操作","skill")}
        ${stat("遊戲理解","sense")}
        ${stat("心態","mental")}
        ${stat("體力","stamina")}
        ${stat("人氣","fame")}

    </div>


    <div class="panel">

        <div class="tags">

            <span class="tag">
                ${regionName()}
            </span>

            <span class="tag">
                ${positionName()}
            </span>

            <span class="tag">
                ${styleName()}
            </span>

            <span class="tag">
                ${languageName()}
            </span>

            <span class="tag">
                ${player.career}
            </span>

            ${
                player.club
                ? `<span class="tag">🏢 ${player.club}</span>`
                : ""
            }

        </div>

    </div>


    <div class="timeline">

        <div id="phase0">年初</div>
        <div id="phase1">賽訓</div>
        <div id="phase2">比賽</div>
        <div id="phase3">休賽期</div>

    </div>


    <div class="panel" id="eventArea"></div>


    <div class="panel">

        <strong>🎮 英雄池</strong>

        <div class="hero-grid" style="margin-top:10px">

            ${hero("刺客型","assassin")}
            ${hero("大法師型","mage")}
            ${hero("Poke型","poke")}
            ${hero("功能型","utility")}

        </div>

    </div>


    <div class="bottom">

        <button onclick="saveGame()">💾 儲存</button>
        <button onclick="loadGame()">📂 讀取</button>
        <button onclick="goBack()">⬅️ 上一步</button>
        <button onclick="restart()">🔄 重開</button>

    </div>

    `;
}


function stat(name,key) {

    return `
    
    <div class="stat">

        <div class="stat-name">
            ${name}
        </div>

        <div class="stat-value">
            ${Math.round(player[key])}
        </div>

    </div>
    
    `;
}


function hero(name,key) {

    return `
    
    <div class="hero">

        <div class="hero-name">
            ${name}
        </div>

        <div class="hero-value">
            ${Math.round(player.hero[key])}
        </div>

    </div>
    
    `;
}


/* =========================================================
   顯示階段
========================================================= */

function showPhase() {

    updateTimeline();

    if (player.phase === 0) {
        showStartOfYear();
    }

    if (player.phase === 1) {
        showTraining();
    }

    if (player.phase === 2) {
        runCompetition();
    }

    if (player.phase === 3) {
        showOffSeason();
    }
}


function updateTimeline() {

    for (let i = 0; i < 4; i++) {

        let el =
            document.getElementById("phase" + i);

        if (el) {

            el.classList.toggle(
                "active",
                i === player.phase
            );

        }
    }
}


/* =========================================================
   ① 年初
========================================================= */

function showStartOfYear() {

    let text;

    if (player.age === 16) {

        text =
`你是一名16歲的高中生。

最近，你開始認真投入英雄聯盟。

原本只是放學後的遊戲，
現在你開始思考：

「如果我真的往職業方向走呢？」`;

    } else {

        text =
`新的一年開始了。

過去一年累積的經驗，
會成為今年的基礎。

你必須決定今年最重要的目標。`;

    }


    showChoices(
        "年初規劃",
        text,
        [
            {
                title:"🎮 提升操作",
                effect:"操作 +4、體力 -2",
                action:()=>{
                    player.skill += 4;
                    player.stamina -= 2;
                }
            },

            {
                title:"🧠 研究遊戲",
                effect:"遊戲理解 +4",
                action:()=>{
                    player.sense += 4;
                }
            },

            {
                title:"🎮 發展英雄池",
                effect:"選定的英雄類型成長",
                action:()=>{
                    showHeroTraining();
                }
            },

            {
                title:"🧘 維持狀態",
                effect:"心態 +3、體力 +3",
                action:()=>{
                    player.mental += 3;
                    player.stamina += 3;
                }
            }
        ]
    );
}


/* =========================================================
   英雄池事件
========================================================= */

function showHeroTraining() {

    showChoices(
        "你的英雄池開始形成",
`你開始發現自己有特別習慣的打法。

這一年，你決定把訓練重心放在哪一種類型？

這不是在選一隻英雄，
而是在決定你的英雄池發展方向。`,
        [
            {
                title:"🔪 刺客型",
                effect:"刺客型 +6",
                action:()=>{
                    player.hero.assassin += 6;
                }
            },

            {
                title:"🔮 大法師型",
                effect:"大法師型 +6",
                action:()=>{
                    player.hero.mage += 6;
                }
            },

            {
                title:"🎯 Poke型",
                effect:"Poke型 +6",
                action:()=>{
                    player.hero.poke += 6;
                }
            },

            {
                title:"🧭 功能型",
                effect:"功能型 +6",
                action:()=>{
                    player.hero.utility += 6;
                }
            }
        ]
    );
}


/* =========================================================
   ② 賽訓
========================================================= */

function showTraining() {

    showChoices(
        "賽季前訓練",
`正式比賽還沒有開始。

現在是賽訓期。

教練、隊友或你自己，
開始安排這段時間的訓練內容。

這些訓練會直接影響接下來的比賽表現。`,
        [
            {
                title:"🏋️ 高強度操作訓練",
                effect:"操作 +5、體力 -4",
                action:()=>{
                    player.skill += 5;
                    player.stamina -= 4;
                }
            },

            {
                title:"🧠 戰術與比賽理解",
                effect:"遊戲理解 +5",
                action:()=>{
                    player.sense += 5;
                }
            },

            {
                title:"🎮 英雄池訓練",
                effect:"英雄池各類 +3",
                action:()=>{
                    player.hero.assassin += 3;
                    player.hero.mage += 3;
                    player.hero.poke += 3;
                    player.hero.utility += 3;
                }
            },

            {
                title:"🧘 心態與體能",
                effect:"心態 +4、體力 +4",
                action:()=>{
                    player.mental += 4;
                    player.stamina += 4;
                }
            }
        ]
    );

}


/* =========================================================
   ③ 比賽
========================================================= */

function runCompetition() {

    /*
       注意：
       這裡沒有任何「訓練選項」。

       前面的訓練已經結束。
       現在直接依照能力判定比賽。
    */

    let heroAverage =
        (
            player.hero.assassin +
            player.hero.mage +
            player.hero.poke +
            player.hero.utility
        ) / 4;


    let power =
        player.skill * 0.30 +
        player.sense * 0.30 +
        player.mental * 0.15 +
        player.stamina * 0.10 +
        heroAverage * 0.15;


    let random =
        Math.random() * 20 - 10;


    let finalPower =
        power + random;


    let result = "";


    if (finalPower >= 75) {

        result =
`🏆 你打出了非常亮眼的賽季。

你的個人表現成為隊伍的重要支柱。

賽事評價：頂尖

人氣 +8
心態 +3`;

        player.fame += 8;
        player.mental += 3;
        player.experience += 5;
        player.seasonResult = "頂尖";

    }

    else if (finalPower >= 60) {

        result =
`⚔️ 你完成了一個穩定的賽季。

雖然沒有成為最耀眼的選手，
但你的表現獲得了肯定。

賽事評價：良好

人氣 +4`;

        player.fame += 4;
        player.experience += 4;
        player.seasonResult = "良好";

    }

    else if (finalPower >= 45) {

        result =
`😐 你的賽季表現普通。

你沒有犯下太多錯誤，
但也沒有留下非常深刻的印象。

賽事評價：普通`;

        player.experience += 2;
        player.seasonResult = "普通";

    }

    else {

        result =
`😓 這個賽季並不順利。

你在關鍵比賽中出現了一些失誤。

賽事評價：失利

心態 -3`;

        player.mental -= 3;
        player.seasonResult = "失利";

    }


    showResult(
        "正式比賽開始了",
        `賽季期間，你的訓練成果正式接受考驗。

系統根據你的操作、遊戲理解、
心態、體力與英雄池進行判定。

${result}

最終綜合競爭力：${Math.round(finalPower)}`,
        "進入休賽期"
    );
}


/* =========================================================
   ④ 休賽期
========================================================= */

function showOffSeason() {

    let text =
`賽季結束。

你終於有時間停下來，
看看這一年究竟發生了什麼。

${player.seasonResult === "頂尖"
    ? "你的出色表現讓一些俱樂部開始注意到你。"
    : player.seasonResult === "失利"
    ? "這個賽季的失利讓你開始思考自己的問題。"
    : "你開始整理這一年的比賽經驗。"
}

接下來，你可以決定下一步。`;


    let choices = [

        {
            title:"🔥 下一季繼續衝刺",
            effect:"操作 +3、遊戲理解 +2、體力 -3",
            action:()=>{
                player.skill += 3;
                player.sense += 2;
                player.stamina -= 3;
            }
        },

        {
            title:"📚 專門修正弱點",
            effect:"目前最低能力 +5",
            action:()=>{

                let keys = [
                    "skill",
                    "sense",
                    "mental",
                    "stamina"
                ];

                keys.sort(
                    (a,b)=>player[a]-player[b]
                );

                player[keys[0]] += 5;
            }
        },

        {
            title:"😴 充分休息",
            effect:"體力 +8、心態 +5",
            action:()=>{
                player.stamina += 8;
                player.mental += 5;
            }
        }

    ];


    /*
       年輕選手可能受到青訓注意
    */

    if (
        player.age >= 16 &&
        player.fame >= 8 &&
        !player.club
    ) {

        choices.push({

            title:"📩 回覆青訓 Scout",
            effect:"嘗試進入青訓體系",
            action:()=>{
                scoutCheck();
            }

        });

    }


    showChoices(
        "休賽期",
        text,
        choices
    );
}


/* =========================================================
   Scout
========================================================= */

function scoutCheck() {

    let power =
        player.skill * 0.35 +
        player.sense * 0.30 +
        player.mental * 0.15 +
        heroAverage() * 0.20;


    let threshold = 60;


    /*
       本土青訓優先
    */

    if (
        player.region === "LCK" ||
        player.region === "LPL" ||
        player.region === "LCP"
    ) {
        threshold -= 5;
    }


    if (power >= threshold) {

        player.club =
            player.region + " 青訓";

        player.career =
            "青訓選手";

        player.fame += 3;

        showResult(
            "青訓邀請",
`Scout 看過你的資料與賽事表現。

經過試訓後，

🌱 你成功加入 ${player.club}。

你正式踏入職業電競體系。

這並不代表你已經成為職業選手。

真正的競爭，現在才開始。`,
            "繼續"
        );

    }

    else {

        showResult(
            "青訓試訓",
`你參加了青訓試訓。

但是教練認為你目前仍然有一些不足。

「繼續努力，我們之後還會觀察你。」

你沒有被淘汰出電競圈。

只是還需要更多時間。`,
            "繼續"
        );

    }

}


/* =========================================================
   共用選項
========================================================= */

function showChoices(title,text,choices) {

    updateTimeline();

    let html = `

        <div class="event-date">
            ${phaseName()}
        </div>

        <div class="event-title">
            ${title}
        </div>

        <div class="event-text">
            ${text}
        </div>

        <div class="choices">

    `;


    choices.forEach((choice,index)=>{

        html += `

        <button
            class="choice"
            onclick="choose(${index})"
        >

            <div class="choice-title">
                ${choice.title}
            </div>

            <div class="choice-effect">
                ${choice.effect}
            </div>

        </button>

        `;

    });


    html += `</div>`;


    document.getElementById("eventArea")
        .innerHTML = html;


    window.currentChoices =
        choices;
}


function choose(index) {

    /*
       保存上一個狀態
    */

    player.savedBeforeChoice =
        JSON.stringify(player);


    let choice =
        window.currentChoices[index];


    choice.action();


    normalize();


    /*
       如果選項自己觸發 Scout，
       就讓 Scout 結果接管流程。
    */

    if (
        player.career === "青訓選手" &&
        choice.title.includes("青訓")
    ) {

        return;

    }


    showResult(
        "你的選擇",
        `你選擇了：

${choice.title}

${choice.effect}

你的決定會影響接下來的賽季。`,
        getNextButtonText()
    );

}


/* =========================================================
   結果
========================================================= */

function showResult(title,text,nextText) {

    document.getElementById("eventArea")
        .innerHTML = `

        <div class="event-date">
            ${phaseName()}
        </div>

        <div class="event-title">
            ${title}
        </div>

        <div class="result">
            ${text}
        </div>

        <button
            class="continue"
            onclick="nextPhase()"
        >
            ▶ ${nextText}
        </button>

        `;

}


/* =========================================================
   下一階段
========================================================= */

function nextPhase() {

    /*
       年初 → 賽訓
    */

    if (player.phase === 0) {

        player.phase = 1;

        renderGame();
        showPhase();

        return;

    }


    /*
       賽訓 → 比賽
    */

    if (player.phase === 1) {

        player.phase = 2;

        renderGame();

        /*
           比賽直接自動結算
        */

        setTimeout(
            showPhase,
            250
        );

        return;

    }


    /*
       比賽 → 休賽期
    */

    if (player.phase === 2) {

        player.phase = 3;

        renderGame();
        showPhase();

        return;

    }


    /*
       休賽期 → 年度結算
    */

    if (player.phase === 3) {

        showYearSummary();

    }

}


/* =========================================================
   年度結算
========================================================= */

function showYearSummary() {

    document.getElementById("app")
        .innerHTML = `

    <div class="panel summary">

        <h2>
            📅 ${player.year} 年度結算
        </h2>

        <p>
            今年結束了。
        </p>


        <div class="summary-line">
            <span>年齡</span>
            <strong>
                ${player.age} → ${player.age + 1}
            </strong>
        </div>

        <div class="summary-line">
            <span>操作</span>
            <strong>${Math.round(player.skill)}</strong>
        </div>

        <div class="summary-line">
            <span>遊戲理解</span>
            <strong>${Math.round(player.sense)}</strong>
        </div>

        <div class="summary-line">
            <span>心態</span>
            <strong>${Math.round(player.mental)}</strong>
        </div>

        <div class="summary-line">
            <span>體力</span>
            <strong>${Math.round(player.stamina)}</strong>
        </div>

        <div class="summary-line">
            <span>人氣</span>
            <strong>${Math.round(player.fame)}</strong>
        </div>

        <div class="summary-line">
            <span>年度賽事</span>
            <strong>${player.seasonResult}</strong>
        </div>


        <br>

        <h3>
            📜 年度紀錄
        </h3>

        <div>
            ${player.history
                .slice(-5)
                .map(x=>`・${x}`)
                .join("<br>")
            }
        </div>


        <button
            class="next"
            onclick="nextYear()"
        >
            ▶ 進入 ${player.year + 1} 年
        </button>

    </div>

    `;
}


/* =========================================================
   下一年
========================================================= */

function nextYear() {

    player.age++;
    player.year++;

    player.phase = 0;
    player.seasonResult = "";

    player.stamina += 8;

    /*
       18歲後離開高中
    */

    if (player.age >= 18 && !player.club) {

        player.career = "業餘選手";

    }


    normalize();

    renderGame();
    showPhase();
}


/* =========================================================
   名稱
========================================================= */

function regionName() {

    return {

        LCK:"🇰🇷 LCK",
        LPL:"🇨🇳 LPL",
        LEC:"🇪🇺 LEC",
        LCS:"🇺🇸 LCS",
        LCP:"🌏 LCP",
        CBLOL:"🇧🇷 CBLOL"

    }[player.region];

}


function positionName() {

    return {

        TOP:"🛡️ TOP",
        JUNGLE:"🌲 JUNGLE",
        MID:"⚔️ MID",
        ADC:"🎯 ADC",
        SUPPORT:"🧭 SUPPORT"

    }[player.position];

}


function styleName() {

    return {

        specialist:"🔪 專精型",
        wide:"📚 廣泛型",
        balanced:"⚖️ 平衡型"

    }[player.style];

}


function languageName() {

    return {

        native:"🗣️ 本土語言",
        english:"🌎 英語",
        korean:"🇰🇷 韓語",
        multi:"🌐 多語言"

    }[player.language];

}


function phaseName() {

    return [

        "年初規劃",
        "賽季前・賽訓",
        "正式比賽",
        "休賽期"

    ][player.phase];

}


function getNextButtonText() {

    if (player.phase === 0)
        return "進入賽訓期";

    if (player.phase === 1)
        return "進入比賽";

    if (player.phase === 2)
        return "進入休賽期";

    return "進入年度結算";
}


/* =========================================================
   英雄池平均
========================================================= */

function heroAverage() {

    return (
        player.hero.assassin +
        player.hero.mage +
        player.hero.poke +
        player.hero.utility
    ) / 4;

}


/* =========================================================
   數值限制
========================================================= */

function normalize() {

    let keys = [
        "skill",
        "sense",
        "mental",
        "stamina",
        "fame"
    ];

    keys.forEach(key=>{

        player[key] =
            Math.max(
                0,
                Math.min(
                    100,
                    player[key]
                )
            );

    });


    Object.keys(player.hero)
        .forEach(key=>{

            player.hero[key] =
                Math.max(
                    0,
                    Math.min(
                        100,
                        player.hero[key]
                    )
                );

        });

}


/* =========================================================
   存檔
========================================================= */

function saveGame() {

    localStorage.setItem(
        "esportsLifeSave",
        JSON.stringify(player)
    );

    alert("💾 存檔成功");

}


/* =========================================================
   讀檔
========================================================= */

function loadGame() {

    let save =
        localStorage.getItem(
            "esportsLifeSave"
        );


    if (!save) {

        alert("目前沒有存檔");

        return;

    }


    player =
        JSON.parse(save);

    renderGame();
    showPhase();

}


/* =========================================================
   上一步
========================================================= */

function goBack() {

    if (!player.savedBeforeChoice) {

        alert(
            "目前沒有可以返回的操作。"
        );

        return;

    }


    player =
        JSON.parse(
            player.savedBeforeChoice
        );

    player.savedBeforeChoice = null;

    renderGame();
    showPhase();

}


/* =========================================================
   重開
========================================================= */

function restart() {

    if (
        !confirm(
            "確定重新開始？"
        )
    ) return;


    location.reload();

}


/* =========================================================
   初始化
========================================================= */

renderSetup();

</script>

</body>
</html>
