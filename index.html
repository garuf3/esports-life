<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎮 電競人生模擬器</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #17191f;
    color: #eeeeee;
    font-family:
        Arial,
        "Microsoft JhengHei",
        sans-serif;
}

button {
    font-family: inherit;
}

#app {
    width: 900px;
    max-width: 94%;
    margin: 25px auto 50px;
}

/* =========================
   頂部
========================= */

.header {
    background: #22252d;
    border-radius: 14px;
    padding: 18px 22px;
    margin-bottom: 12px;
    border: 1px solid #343842;
}

.title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.title {
    font-size: 24px;
    font-weight: bold;
}

.year-box {
    text-align: right;
    color: #aaa;
}

.year-box strong {
    display: block;
    color: #fff;
    font-size: 19px;
}

/* =========================
   狀態
========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 12px;
}

.stat {
    background: #22252d;
    border: 1px solid #343842;
    border-radius: 10px;
    padding: 10px;
    text-align: center;
}

.stat-label {
    font-size: 12px;
    color: #999;
}

.stat-value {
    font-size: 21px;
    font-weight: bold;
    margin-top: 4px;
}

.stat-name {
    font-size: 12px;
    color: #aaa;
    margin-top: 3px;
}

/* =========================
   人物資訊
========================= */

.profile {
    background: #22252d;
    border: 1px solid #343842;
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 12px;

    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.tag {
    background: #30343d;
    border-radius: 20px;
    padding: 6px 11px;
    font-size: 13px;
}

/* =========================
   主要事件
========================= */

.event-card {
    background: #22252d;
    border: 1px solid #343842;
    border-radius: 14px;
    padding: 25px;
    min-height: 430px;
}

.date {
    color: #888;
    font-size: 14px;
    margin-bottom: 8px;
}

.event-title {
    font-size: 27px;
    font-weight: bold;
    margin-bottom: 18px;
}

.event-text {
    color: #d6d6d6;
    line-height: 1.9;
    font-size: 16px;
    white-space: pre-line;
    margin-bottom: 25px;
}

/* =========================
   選項
========================= */

.choice-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.choice {
    width: 100%;
    background: #2c3039;
    color: white;
    border: 1px solid #404550;
    border-radius: 10px;
    padding: 14px 16px;
    text-align: left;
    cursor: pointer;
    transition: 0.15s;
}

.choice:hover {
    background: #363b46;
    border-color: #606775;
    transform: translateY(-1px);
}

.choice-title {
    font-size: 16px;
    font-weight: bold;
}

.choice-effect {
    color: #9da3af;
    font-size: 13px;
    margin-top: 5px;
}

/* =========================
   結果
========================= */

.result-box {
    margin-top: 18px;
    padding: 14px;
    border-radius: 9px;
    background: #191b20;
    border: 1px solid #333741;
    color: #ddd;
    line-height: 1.7;
}

/* =========================
   底部
========================= */

.bottom {
    margin-top: 12px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
}

.bottom button {
    flex: 1;
    padding: 10px;
    background: #24272f;
    color: #ccc;
    border: 1px solid #383c46;
    border-radius: 8px;
    cursor: pointer;
}

.bottom button:hover {
    background: #30343d;
}

/* =========================
   年度結算
========================= */

.summary {
    background: #22252d;
    border: 1px solid #343842;
    border-radius: 14px;
    padding: 25px;
}

.summary h2 {
    margin-top: 0;
}

.summary-line {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #343842;
    padding: 10px 0;
}

.next-year {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #eeeeee;
    color: #111;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

/* =========================
   設定畫面
========================= */

.setup {
    background: #22252d;
    border: 1px solid #343842;
    border-radius: 14px;
    padding: 28px;
}

.setup h1 {
    margin-top: 0;
}

.setup-desc {
    color: #aaa;
    line-height: 1.8;
    margin-bottom: 25px;
}

.setup-title {
    font-size: 18px;
    font-weight: bold;
    margin: 25px 0 10px;
}

.setup-options {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 9px;
}

.setup-option {
    background: #2b2f37;
    border: 1px solid #404550;
    color: white;
    border-radius: 9px;
    padding: 14px;
    text-align: left;
    cursor: pointer;
}

.setup-option:hover {
    background: #373c46;
}

.setup-option.selected {
    border-color: #eeeeee;
    background: #3a3e48;
}

.setup-option strong {
    display: block;
    margin-bottom: 5px;
}

.setup-option small {
    color: #999;
    line-height: 1.5;
}

.start-button {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: none;
    border-radius: 9px;
    background: #eeeeee;
    color: #111;
    font-weight: bold;
    font-size: 17px;
    cursor: pointer;
}

.start-button:disabled {
    opacity: 0.3;
    cursor: not-allowed;
}

/* =========================
   英雄池
========================= */

.hero-panel {
    margin-top: 12px;
    background: #22252d;
    border: 1px solid #343842;
    border-radius: 12px;
    padding: 15px;
}

.hero-panel-title {
    font-weight: bold;
    margin-bottom: 12px;
}

.hero-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.hero-stat {
    background: #191b20;
    border-radius: 8px;
    padding: 9px;
    text-align: center;
}

.hero-stat-name {
    font-size: 12px;
    color: #999;
}

.hero-stat-value {
    font-size: 18px;
    margin-top: 4px;
}

/* =========================
   手機
========================= */

@media(max-width:700px) {

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .setup-options {
        grid-template-columns: 1fr;
    }

    .hero-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .title-row {
        flex-direction: column;
        align-items: flex-start;
    }

    .year-box {
        text-align: left;
    }
}

</style>
</head>

<body>

<div id="app"></div>

<script>

/* =========================================================
   遊戲資料
========================================================= */

let player = {

    age: 16,
    year: 2026,

    region: "",
    position: "",
    style: "",
    language: "",

    skill: 50,
    gameSense: 50,
    mental: 50,
    stamina: 50,

    fame: 0,
    experience: 0,

    career: "高中生",

    club: "",
    clubLevel: 0,

    hero: {
        assassin: 50,
        mage: 50,
        poke: 50,
        utility: 50
    },

    history: [],

    yearlyEvents: 0,
    maxEvents: 4,

    eventIndex: 0,

    seasonResult: "",

    scoutAttention: 0,

    gameOver: false
};


/* =========================================================
   初始畫面
========================================================= */

let setup = {

    region: "",
    position: "",
    style: "",
    language: ""

};


function renderSetup() {

    document.getElementById("app").innerHTML = `

    <div class="setup">

        <h1>🎮 電競人生模擬器</h1>

        <div class="setup-desc">

        從16歲開始，你將用數年的時間，
        決定自己究竟會成為職業選手、青訓選手、
        內容創作者，還是最後走向另一條人生道路。

        <br><br>

        <strong>一年只需要做幾次重要決定。</strong>
        其餘時間由系統根據你的能力與選擇自動模擬。

        </div>


        <div class="setup-title">
            🌏 你的出身賽區
        </div>

        <div class="setup-options">

            ${setupOption(
                "region",
                "LCK",
                "🇰🇷 韓國",
                "本土競爭激烈，職業體系成熟。"
            )}

            ${setupOption(
                "region",
                "LPL",
                "🇨🇳 中國",
                "大型聯賽與青訓體系。"
            )}

            ${setupOption(
                "region",
                "LEC",
                "🇪🇺 歐洲",
                "多國選手環境，歐洲本土聯賽。"
            )}

            ${setupOption(
                "region",
                "LCS",
                "🇺🇸 北美",
                "海外選手比例相對較高。"
            )}

            ${setupOption(
                "region",
                "LCP",
                "🌏 亞太",
                "台港澳、日本、越南、太平洋等地區。"
            )}

            ${setupOption(
                "region",
                "CBLOL",
                "🇧🇷 巴西",
                "南美主要職業賽區。"
            )}

        </div>


        <div class="setup-title">
            🛣️ 你的主要位置
        </div>

        <div class="setup-options">

            ${setupOption(
                "position",
                "TOP",
                "🛡️ TOP",
                "重視對線、單帶與抗壓。"
            )}

            ${setupOption(
                "position",
                "JUNGLE",
                "🌲 JUNGLE",
                "重視節奏、判斷與地圖理解。"
            )}

            ${setupOption(
                "position",
                "MID",
                "⚔️ MID",
                "操作、理解與英雄池需求平均較高。"
            )}

            ${setupOption(
                "position",
                "ADC",
                "🎯 ADC",
                "操作、團戰與穩定輸出。"
            )}

            ${setupOption(
                "position",
                "SUPPORT",
                "🧭 SUPPORT",
                "理解、視野、開戰與團隊功能。"
            )}

        </div>


        <div class="setup-title">
            🎮 英雄池養成方式
        </div>

        <div class="setup-options">

            ${setupOption(
                "style",
                "specialist",
                "🔪 專精型",
                "某一類型成長較快，容易形成招牌風格。"
            )}

            ${setupOption(
                "style",
                "wide",
                "📚 廣泛型",
                "不同類型平均成長，較容易形成完整英雄池。"
            )}

            ${setupOption(
                "style",
                "balanced",
                "⚖️ 平衡型",
                "所有類型正常成長。"
            )}

        </div>


        <div class="setup-title">
            🗣️ 語言能力
        </div>

        <div class="setup-options">

            ${setupOption(
                "language",
                "native",
                "🗣️ 本土語言",
                "本土交流容易。"
            )}

            ${setupOption(
                "language",
                "english",
                "🌎 英語",
                "海外英語環境適應較好。"
            )}

            ${setupOption(
                "language",
                "korean",
                "🇰🇷 韓語",
                "韓國隊伍與韓籍隊友交流較容易。"
            )}

            ${setupOption(
                "language",
                "multi",
                "🌐 多語言",
                "海外適應能力較高。"
            )}

        </div>


        <button
            id="startButton"
            class="start-button"
            onclick="startGame()"
            disabled
        >
            開始電競人生
        </button>

    </div>

    `;

}


function setupOption(type, value, title, desc) {

    let selected =
        setup[type] === value
        ? "selected"
        : "";

    return `

    <button
        class="setup-option ${selected}"
        onclick="chooseSetup('${type}','${value}')"
    >

        <strong>${title}</strong>

        <small>${desc}</small>

    </button>

    `;

}


function chooseSetup(type, value) {

    setup[type] = value;

    renderSetup();

    if (
        setup.region &&
        setup.position &&
        setup.style &&
        setup.language
    ) {

        document.getElementById("startButton")
        .disabled = false;

    }

}


/* =========================================================
   開始遊戲
========================================================= */

function startGame() {

    player.region = setup.region;
    player.position = setup.position;
    player.style = setup.style;
    player.language = setup.language;

    player.age = 16;
    player.year = 2026;

    player.career = "高中生";

    player.history = [];

    applyStartingStyle();

    player.history.push(
        "16歲：開始認真投入英雄聯盟"
    );

    player.eventIndex = 0;
    player.yearlyEvents = 0;

    renderGame();

    showEvent();

}


/* =========================================================
   初始英雄池
========================================================= */

function applyStartingStyle() {

    if (player.style === "specialist") {

        player.hero.assassin = 65;
        player.hero.mage = 45;
        player.hero.poke = 45;
        player.hero.utility = 45;

    }

    if (player.style === "wide") {

        player.hero.assassin = 52;
        player.hero.mage = 52;
        player.hero.poke = 52;
        player.hero.utility = 52;

    }

    if (player.style === "balanced") {

        player.hero.assassin = 50;
        player.hero.mage = 50;
        player.hero.poke = 50;
        player.hero.utility = 50;

    }

}


/* =========================================================
   主畫面
========================================================= */

function renderGame() {

    document.getElementById("app").innerHTML = `

    <div class="header">

        <div class="title-row">

            <div class="title">
                🎮 電競人生模擬器
            </div>

            <div class="year-box">

                <strong>
                    ${player.year} 年
                </strong>

                ${player.age} 歲

            </div>

        </div>

    </div>


    <div class="stats">

        ${stat("操作","skill")}
        ${stat("遊戲理解","gameSense")}
        ${stat("心態","mental")}
        ${stat("體力","stamina")}
        ${stat("人氣","fame")}

    </div>


    <div class="profile">

        <div class="tag">
            ${regionName(player.region)}
        </div>

        <div class="tag">
            ${positionName(player.position)}
        </div>

        <div class="tag">
            ${styleName(player.style)}
        </div>

        <div class="tag">
            ${languageName(player.language)}
        </div>

        <div class="tag">
            ${player.career}
        </div>

        ${
            player.club
            ? `<div class="tag">🏢 ${player.club}</div>`
            : ""
        }

    </div>


    <div class="event-card">

        <div id="eventArea"></div>

    </div>


    <div class="hero-panel">

        <div class="hero-panel-title">
            🎮 英雄池
        </div>

        <div class="hero-grid">

            ${heroStat("刺客型","assassin")}
            ${heroStat("大法師型","mage")}
            ${heroStat("Poke型","poke")}
            ${heroStat("功能型","utility")}

        </div>

    </div>


    <div class="bottom">

        <button onclick="saveGame()">
            💾 儲存
        </button>

        <button onclick="loadGame()">
            📂 讀取
        </button>

        <button onclick="goBack()">
            ⬅️ 上一步
        </button>

        <button onclick="restartGame()">
            🔄 重開
        </button>

    </div>

    `;

}


function stat(name, key) {

    return `

    <div class="stat">

        <div class="stat-label">
            ${name}
        </div>

        <div
            class="stat-value"
            id="${key}"
        >
            ${Math.round(player[key])}
        </div>

    </div>

    `;

}


function heroStat(name,key) {

    return `

    <div class="hero-stat">

        <div class="hero-stat-name">
            ${name}
        </div>

        <div class="hero-stat-value">
            ${Math.round(player.hero[key])}
        </div>

    </div>

    `;

}


/* =========================================================
   事件系統
========================================================= */

function showEvent() {

    if (player.gameOver) {

        return;

    }

    let event =
        generateEvent();

    document.getElementById("eventArea")
    .innerHTML = `

        <div class="date">
            ${event.date}
        </div>

        <div class="event-title">
            ${event.title}
        </div>

        <div class="event-text">
            ${event.text}
        </div>

        <div class="choice-list">

            ${event.choices.map(
                (choice,index) => `

                <button
                    class="choice"
                    onclick="chooseEvent(${index})"
                >

                    <div class="choice-title">
                        ${choice.title}
                    </div>

                    <div class="choice-effect">
                        ${choice.effect}
                    </div>

                </button>

                `
            ).join("")}

        </div>

    `;

}


/* =========================================================
   每年事件
========================================================= */

function generateEvent() {

    let n = player.eventIndex;

    /*
       一年四次主要操作
    */

    if (n === 0) {

        return {

            date: "年初 · 1月～3月",

            title:
            player.age === 16
            ? "你的電競人生開始了"
            : "新的一年開始了",

            text:

            player.age === 16

            ?

`你是一名${player.age}歲的高中生。

最近，你開始認真投入英雄聯盟。

原本只是放學後和朋友一起玩的遊戲，
慢慢變成了你每天都會花時間研究的東西。

你開始注意自己的排位、操作以及比賽。

某一天，你突然產生了一個念頭：

「如果我真的很有天賦呢？」`

            :

`新的一年開始。

去年累積的經驗仍然留在你的身上。

你必須決定，
今年要把多少時間放在電競上。`,

            choices: [

                {
                    title:"🎮 全力投入排位",
                    effect:"操作 +4　體力 -3",
                    action:()=>{
                        player.skill += 4;
                        player.stamina -= 3;
                    }
                },

                {
                    title:"🧠 研究比賽與打法",
                    effect:"遊戲理解 +4　操作 +1",
                    action:()=>{
                        player.gameSense += 4;
                        player.skill += 1;
                    }
                },

                {
                    title:"⚖️ 維持課業與遊戲平衡",
                    effect:"心態 +3　體力 +2　遊戲理解 +1",
                    action:()=>{
                        player.mental += 3;
                        player.stamina += 2;
                        player.gameSense += 1;
                    }
                }

            ]

        };

    }


    if (n === 1) {

        return {

            date: "年中 · 4月～6月",

            title:
            randomMidYearTitle(),

            text:
            randomMidYearText(),

            choices:

            midYearChoices()

        };

    }


    if (n === 2) {

        return {

            date: "賽季 · 7月～9月",

            title:
            generateCompetitionTitle(),

            text:
            generateCompetitionText(),

            choices:

            competitionChoices()

        };

    }


    return {

        date: "年末 · 10月～12月",

        title:
        generateYearEndTitle(),

        text:
        generateYearEndText(),

        choices:
        yearEndChoices()

    };

}


/* =========================================================
   年中事件
========================================================= */

function randomMidYearTitle() {

    if (player.skill >= 70) {

        return "你的操作開始引起注意";

    }

    if (player.gameSense >= 70) {

        return "你開始真正理解這個遊戲";

    }

    return "你開始找到自己的打法";

}


function randomMidYearText() {

    if (player.skill >= 70) {

        return `最近幾個月，你的操作進步得非常快。

你開始能夠完成一些以前根本做不到的操作。

朋友開始稱讚你，
甚至有人開始問你是不是有機會打職業。

但你也知道，
真正的職業選手不只是操作好。`;

    }

    if (player.gameSense >= 70) {

        return `你開始大量觀看職業比賽。

你慢慢發現，
真正厲害的選手並不只是操作快。

他們知道什麼時候該打、
什麼時候該退，
也知道一場比賽真正重要的地方在哪裡。`;

    }

    return `你打了很多場比賽。

慢慢地，
你開始發現自己最喜歡的打法。

有些類型的英雄你特別順手，
有些則完全不適合你。

你的英雄池開始形成自己的方向。`;

}


function midYearChoices() {

    let choices = [

        {
            title:"🔥 衝擊更高排名",
            effect:"操作 +3　遊戲理解 +2　體力 -3",
            action:()=>{
                player.skill += 3;
                player.gameSense += 2;
                player.stamina -= 3;
            }
        },

        {
            title:"📚 開始系統研究比賽",
            effect:"遊戲理解 +4　心態 +1",
            action:()=>{
                player.gameSense += 4;
                player.mental += 1;
            }
        },

        {
            title:"🎮 開始擴充英雄池",
            effect:"英雄池 +4　操作 +1",
            action:()=>{
                growHeroPool(4);
                player.skill += 1;
            }
        }

    ];


    if (player.stamina < 35) {

        choices.push({

            title:"😴 暫時休息",
            effect:"體力 +8　心態 +4",
            action:()=>{
                player.stamina += 8;
                player.mental += 4;
            }

        });

    }

    return choices;

}


/* =========================================================
   賽事
========================================================= */

function generateCompetitionTitle() {

    if (player.age >= 18 && player.club) {

        return "正式賽季開始";

    }

    return "今年的第一場正式比賽";

}


function generateCompetitionText() {

    let power =
        player.skill * 0.3 +
        player.gameSense * 0.3 +
        player.mental * 0.2 +
        heroAverage() * 0.2;


    if (player.age >= 18 && player.club) {

        return `你已經加入${player.club}。

正式賽季開始。

這一次，
你面對的不再只是普通玩家。

每一場比賽都會影響你的職業評價。

目前綜合競爭力：

${Math.round(power)} / 100`;

    }

    return `你參加了今年的業餘／地區性比賽。

這是你第一次真正感受到比賽的壓力。

觀眾、對手、比賽時間，
全部都和一般排位不一樣。

這一次的表現，
可能會成為你未來被 Scout 注意的原因。`;

}


function competitionChoices() {

    return [

        {

            title:"🏆 全力準備比賽",
            effect:"心態 +3　遊戲理解 +2　體力 -4",
            action:()=>{

                player.mental += 3;
                player.gameSense += 2;
                player.stamina -= 4;

                playCompetition(true);

            }

        },

        {

            title:"⚔️ 正常參賽",
            effect:"賽事經驗 +2　心態 +1",
            action:()=>{

                player.experience += 2;
                player.mental += 1;

                playCompetition(false);

            }

        },

        {

            title:"😌 不給自己太大壓力",
            effect:"心態 +4　賽事經驗 +1",
            action:()=>{

                player.mental += 4;
                player.experience += 1;

                playCompetition(false);

            }

        }

    ];

}


function playCompetition(prepared) {

    let power =

        player.skill * 0.30 +

        player.gameSense * 0.25 +

        player.mental * 0.15 +

        heroAverage() * 0.20 +

        player.experience * 0.10;


    if (prepared) {

        power += 5;

    }


    let random =
        Math.random() * 25 - 12;


    let finalPower =
        power + random;


    let result = "";

    if (finalPower >= 70) {

        result =
        "🏆 你打出了非常亮眼的表現，成功進入深輪次。";

        player.fame += 5;
        player.scoutAttention += 8;
        player.mental += 3;

        player.seasonResult = "優異";

    }

    else if (finalPower >= 55) {

        result =
        "⚔️ 你穩定完成了比賽，累積了寶貴的經驗。";

        player.fame += 2;
        player.scoutAttention += 3;
        player.experience += 2;

        player.seasonResult = "普通";

    }

    else {

        result =
        "😓 你在壓力下出現不少失誤，提早結束了比賽。";

        player.mental -= 2;
        player.seasonResult = "失利";

    }


    player.experience += 2;

    setTimeout(()=>{

        showResult(
            result
        );

    },50);

}


/* =========================================================
   年末
========================================================= */

function generateYearEndTitle() {

    if (player.scoutAttention >= 15) {

        return "有人開始注意到你";

    }

    if (player.seasonResult === "優異") {

        return "今年的比賽改變了你";

    }

    return "一年即將結束";

}


function generateYearEndText() {

    if (player.scoutAttention >= 15) {

        return `今年的比賽結束後，
你收到了一些陌生人的聯絡。

其中有一個人自稱是職業俱樂部的 Scout。

他看過你今年的比賽紀錄。

你第一次真正意識到：

「職業電競，也許真的離我不遠。」`;

    }

    return `一年即將結束。

回頭看，
你已經和一年前的自己完全不同。

你的操作、遊戲理解、
英雄池與心態都產生了變化。

但你還不知道，
這些努力究竟會把你帶到哪裡。`;

}


function yearEndChoices() {

    let choices = [

        {

            title:"🔥 明年更加認真",
            effect:"操作 +3　遊戲理解 +2　體力 -3",
            action:()=>{

                player.skill += 3;
                player.gameSense += 2;
                player.stamina -= 3;

            }

        },

        {

            title:"🧠 專注自己的弱點",
            effect:"最低能力 +5",
            action:()=>{

                let values = [

                    ["skill",player.skill],
                    ["gameSense",player.gameSense],
                    ["mental",player.mental],
                    ["stamina",player.stamina]

                ];

                values.sort(
                    (a,b)=>a[1]-b[1]
                );

                player[values[0][0]] += 5;

            }

        },

        {

            title:"😴 讓自己休息一下",
            effect:"心態 +5　體力 +7",
            action:()=>{

                player.mental += 5;
                player.stamina += 7;

            }

        }

    ];


    /*
       Scout 事件
    */

    if (
        player.scoutAttention >= 15 &&
        !player.club &&
        player.age >= 17
    ) {

        choices.push({

            title:"📩 回覆 Scout 的訊息",
            effect:"可能觸發青訓試訓",
            action:()=>{

                scoutEvent();

            }

        });

    }


    return choices;

}


/* =========================================================
   Scout
========================================================= */

function scoutEvent() {

    let power =

        player.skill * 0.35 +
        player.gameSense * 0.30 +
        player.mental * 0.15 +
        heroAverage() * 0.20;


    let localBonus =
        12;


    if (player.region === "LCK") {

        localBonus += 5;

    }


    if (player.region !== "LCK") {

        localBonus += 3;

    }


    let chance =
        power + localBonus;


    if (chance >= 70) {

        showResult(

`📩 Scout 回覆了你。

對方對你的比賽表現很感興趣。

經過試訓後，
你成功獲得青訓合約。

🏢 ${player.region} 青訓

這是你第一次正式踏入職業電競體系。`

        );

        player.club =
        player.region + " 青訓";

        player.clubLevel = 1;

        player.career =
        "青訓選手";

        player.history.push(
            player.age + "歲：加入職業俱樂部青訓"
        );

    }

    else {

        showResult(

`你回覆了 Scout。

你參加了試訓。

然而最後，
教練認為你目前還沒有完全準備好。

「繼續成長，我們之後還會再觀察你。」

這並不是結束。`

        );

        player.mental -= 2;

    }

}


/* =========================================================
   英雄池
========================================================= */

function growHeroPool(amount) {

    if (player.style === "specialist") {

        player.hero.assassin += amount * 1.6;

        player.hero.mage += amount * 0.4;
        player.hero.poke += amount * 0.4;
        player.hero.utility += amount * 0.4;

    }

    else if (player.style === "wide") {

        player.hero.assassin += amount;
        player.hero.mage += amount;
        player.hero.poke += amount;
        player.hero.utility += amount;

    }

    else {

        player.hero.assassin += amount * 0.75;
        player.hero.mage += amount * 0.75;
        player.hero.poke += amount * 0.75;
        player.hero.utility += amount * 0.75;

    }

}


function heroAverage() {

    return (

        player.hero.assassin +
        player.hero.mage +
        player.hero.poke +
        player.hero.utility

    ) / 4;

}


/* =========================================================
   結果
========================================================= */

function showResult(text) {

    document.getElementById("eventArea")
    .innerHTML += `

        <div class="result-box">

            ${text.replace(/\n/g,"<br>")}

        </div>

    `;

}


/* =========================================================
   選擇事件
========================================================= */

function chooseEvent(index) {

    /*
       防止重複點擊
    */

    let buttons =
        document.querySelectorAll(".choice");

    buttons.forEach(
        b => b.disabled = true
    );


    let event =
        generateEvent();

    let choice =
        event.choices[index];


    /*
       執行選擇
    */

    choice.action();


    /*
       數值限制
    */

    normalize();


    /*
       記錄
    */

    player.history.push(

        `${player.age}歲：${stripHTML(choice.title)}`

    );


    player.eventIndex++;

    player.yearlyEvents++;


    /*
       一年四個主要事件
    */

    if (player.eventIndex >= 4) {

        setTimeout(
            showYearSummary,
            300
        );

    }

    else {

        setTimeout(
            ()=>{
                renderGame();
                showEvent();
            },
            300
        );

    }

}


/* =========================================================
   年度結算
========================================================= */

function showYearSummary() {

    let oldAge =
        player.age;

    let result =
        player.seasonResult || "沒有重大賽事紀錄";


    document.getElementById("app")
    .innerHTML = `

    <div class="summary">

        <h2>
            📅 ${player.year} 年度結算
        </h2>

        <p>
            這一年結束了。
        </p>


        <div class="summary-line">

            <span>年齡</span>

            <strong>
                ${oldAge} → ${oldAge + 1}
            </strong>

        </div>


        <div class="summary-line">

            <span>操作</span>

            <strong>
                ${Math.round(player.skill)}
            </strong>

        </div>


        <div class="summary-line">

            <span>遊戲理解</span>

            <strong>
                ${Math.round(player.gameSense)}
            </strong>

        </div>


        <div class="summary-line">

            <span>心態</span>

            <strong>
                ${Math.round(player.mental)}
            </strong>

        </div>


        <div class="summary-line">

            <span>體力</span>

            <strong>
                ${Math.round(player.stamina)}
            </strong>

        </div>


        <div class="summary-line">

            <span>人氣</span>

            <strong>
                ${Math.round(player.fame)}
            </strong>

        </div>


        <div class="summary-line">

            <span>年度賽事</span>

            <strong>
                ${result}
            </strong>

        </div>


        <br>

        <h3>
            📜 今年發生的事情
        </h3>

        <div>

            ${player.history
                .slice(-4)
                .map(x=>`・${x}`)
                .join("<br>")
            }

        </div>


        <button
            class="next-year"
            onclick="nextYear()"
        >
            進入 ${player.year + 1} 年 →
        </button>

    </div>

    `;

}


/* =========================================================
   下一年
========================================================= */

function nextYear() {

    player.age++;
    player.year++;

    player.eventIndex = 0;
    player.yearlyEvents = 0;

    player.seasonResult = "";

    /*
       年齡影響
    */

    if (player.age >= 18) {

        player.career =
            player.club
            ? "青訓選手"
            : "業餘選手";

    }


    /*
       體力自然恢復
    */

    player.stamina += 8;


    /*
       17歲以後可能出現 Scout
    */

    if (
        player.age >= 17 &&
        player.skill >= 60
    ) {

        player.scoutAttention += 2;

    }


    normalize();

    renderGame();

    showEvent();

}


/* =========================================================
   正規化
========================================================= */

function normalize() {

    player.skill =
    clamp(player.skill);

    player.gameSense =
    clamp(player.gameSense);

    player.mental =
    clamp(player.mental);

    player.stamina =
    clamp(player.stamina);

    player.fame =
    clamp(player.fame);

    player.experience =
    clamp(player.experience);

    player.hero.assassin =
    clamp(player.hero.assassin);

    player.hero.mage =
    clamp(player.hero.mage);

    player.hero.poke =
    clamp(player.hero.poke);

    player.hero.utility =
    clamp(player.hero.utility);

}


function clamp(value) {

    return Math.max(
        0,
        Math.min(100,value)
    );

}


/* =========================================================
   名稱
========================================================= */

function regionName(value) {

    let map = {

        LCK:"🇰🇷 LCK",
        LPL:"🇨🇳 LPL",
        LEC:"🇪🇺 LEC",
        LCS:"🇺🇸 LCS",
        LCP:"🌏 LCP",
        CBLOL:"🇧🇷 CBLOL"

    };

    return map[value] || value;

}


function positionName(value) {

    let map = {

        TOP:"🛡️ TOP",
        JUNGLE:"🌲 JUNGLE",
        MID:"⚔️ MID",
        ADC:"🎯 ADC",
        SUPPORT:"🧭 SUPPORT"

    };

    return map[value] || value;

}


function styleName(value) {

    let map = {

        specialist:"🔪 專精型",
        wide:"📚 廣泛型",
        balanced:"⚖️ 平衡型"

    };

    return map[value] || value;

}


function languageName(value) {

    let map = {

        native:"🗣️ 本土語言",
        english:"🌎 英語",
        korean:"🇰🇷 韓語",
        multi:"🌐 多語言"

    };

    return map[value] || value;

}


/* =========================================================
   存檔
========================================================= */

function saveGame() {

    localStorage.setItem(
        "esportsLifeSave",
        JSON.stringify(player)
    );

    alert("💾 已儲存目前人生。");

}


/* =========================================================
   讀檔
========================================================= */

function loadGame() {

    let save =
        localStorage.getItem(
            "esportsLifeSave"
        );


    if (!save) {

        alert("目前沒有存檔。");

        return;

    }


    player =
        JSON.parse(save);


    renderGame();

    showEvent();

}


/* =========================================================
   上一步
========================================================= */

let previousPlayer = null;


/*
   這裡提供簡單的事件回溯。
   每次選擇前保存一次。
*/

function goBack() {

    if (!previousPlayer) {

        alert(
            "目前沒有可以返回的操作。"
        );

        return;

    }


    player =
        JSON.parse(
            previousPlayer
        );

    previousPlayer = null;

    renderGame();

    showEvent();

}


/*
   包裝 chooseEvent，
   在選擇前保存。
*/

const originalChooseEvent =
    chooseEvent;


/* =========================================================
   重開
========================================================= */

function restartGame() {

    if (
        confirm(
            "確定要重新開始嗎？目前人生不會保留。"
        )
    ) {

        localStorage.removeItem(
            "esportsLifeSave"
        );

        player = {

            age:16,
            year:2026,

            region:"",
            position:"",
            style:"",
            language:"",

            skill:50,
            gameSense:50,
            mental:50,
            stamina:50,

            fame:0,
            experience:0,

            career:"高中生",

            club:"",
            clubLevel:0,

            hero:{
                assassin:50,
                mage:50,
                poke:50,
                utility:50
            },

            history:[],
            yearlyEvents:0,
            maxEvents:4,
            eventIndex:0,

            seasonResult:"",
            scoutAttention:0,

            gameOver:false

        };

        setup = {
            region:"",
            position:"",
            style:"",
            language:""
        };

        renderSetup();

    }

}


/* =========================================================
   清除 HTML
========================================================= */

function stripHTML(text) {

    return text
        .replace(/<[^>]*>/g,"");

}


/* =========================================================
   修正 chooseEvent 的上一部存檔
========================================================= */

const _chooseEvent =
    chooseEvent;

chooseEvent = function(index) {

    previousPlayer =
        JSON.stringify(player);

    _chooseEvent(index);

};


/* =========================================================
   初始化
========================================================= */

renderSetup();

</script>

</body>
</html>
