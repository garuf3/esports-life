<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoL 電競人生模擬器</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    background:#080d18;
    color:#edf2ff;
    font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;
}

button,input{font:inherit}
button{cursor:pointer}

.app{
    max-width:1050px;
    min-height:100vh;
    margin:auto;
    padding-bottom:76px;
}

.top{
    position:sticky;
    top:0;
    z-index:50;
    padding:13px 16px;
    background:rgba(8,13,24,.95);
    backdrop-filter:blur(12px);
    border-bottom:1px solid #222c42;
}

.topline{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.top-name{
    font-size:17px;
    font-weight:900;
}

.top-sub{
    color:#7f8ba3;
    font-size:11px;
    margin-top:2px;
}

.age{
    background:#172139;
    color:#bfcbea;
    border-radius:999px;
    padding:7px 11px;
    font-size:11px;
}

main{
    padding:15px;
}

.card{
    background:#101729;
    border:1px solid #242e45;
    border-radius:14px;
    padding:14px;
    margin-bottom:12px;
}

.title{
    font-size:21px;
    font-weight:900;
}

.subtitle{
    color:#8290a8;
    font-size:12px;
    line-height:1.6;
    margin-top:3px;
}

.card-title{
    font-size:14px;
    font-weight:850;
    margin-bottom:9px;
}

/* 建立角色 */

.create-header{
    text-align:center;
    padding:12px 5px 18px;
}

.create-icon{
    font-size:34px;
}

.create-title{
    font-size:24px;
    font-weight:950;
    margin-top:5px;
}

.create-layout{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

label{
    display:block;
    margin-top:10px;
    margin-bottom:5px;
    color:#aab5ca;
    font-size:11px;
}

.input{
    width:100%;
    padding:11px 12px;
    background:#0a1120;
    color:#fff;
    border:1px solid #2a354d;
    border-radius:9px;
    outline:none;
}

.input:focus{
    border-color:#657aff;
}

.option-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
}

.option{
    border:1px solid #2a354d;
    border-radius:9px;
    background:#0c1424;
    color:#c7d0e2;
    padding:10px 5px;
}

.option.active{
    background:#283762;
    border-color:#6d83ff;
    color:white;
    font-weight:850;
}

.option small{
    display:block;
    color:#718099;
    font-size:9px;
    margin-top:3px;
}

.option.active small{
    color:#bac7eb;
}

.status{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.status span{
    padding:6px 8px;
    background:#182238;
    color:#77849d;
    border-radius:999px;
    font-size:10px;
}

.status span.done{
    background:#20365b;
    color:#cbd8ff;
}

.start{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:0;
    border-radius:10px;
    background:#536cff;
    color:white;
    font-weight:900;
}

.start:disabled{
    background:#242d40;
    color:#69758b;
}

/* 數值 */

.stat{
    margin:13px 0;
}

.stat-head{
    display:flex;
    justify-content:space-between;
    margin-bottom:5px;
}

.stat-name{
    font-size:12px;
    font-weight:800;
}

.stat-value{
    color:#aab6cc;
    font-size:11px;
}

.bar{
    height:10px;
    background:#202a3e;
    border-radius:999px;
    overflow:hidden;
}

.fill{
    height:100%;
    background:linear-gradient(90deg,#536cff,#8c9aff);
    border-radius:999px;
}

.distance{
    margin-top:3px;
    color:#69768d;
    font-size:9px;
}

/* 事件 */

.event{
    color:#d8dfed;
    font-size:13px;
    line-height:1.7;
}

.event-meta{
    color:#6f7c94;
    font-size:10px;
    margin-bottom:7px;
}

.choice{
    width:100%;
    text-align:left;
    margin-top:7px;
    padding:10px;
    border-radius:10px;
    border:1px solid #29344b;
    background:#0c1424;
    color:#edf2ff;
}

.choice:hover{
    background:#17233b;
}

.choice-title{
    font-weight:850;
    font-size:12px;
}

.choice-effect{
    color:#78859d;
    font-size:10px;
    margin-top:3px;
}

/* 俱樂部 */

.club-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.club{
    background:#0b1322;
    border:1px solid #28334a;
    border-radius:12px;
    padding:11px;

.club-top{

.club-name{

.club-region{

.stars{

}

.club-desc{

    font-size:10px;
    line-height:1.5;
    margin:7px 0;

.club-stats{

.club-stat{
    padding:6px;
    background:#141d30;
    border-radius:7px;
}

.club-stat b{
    display:block;
    font-size:10px;
}

.club-stat span{
    display:block;
    color:#68758d;
    font-size:8px;
    margin-top:2px;
}

.club-status{
    margin-top:7px;
    padding:7px;
    border-radius:7px;
    font-size:9px;
}

.good{
    background:#143324;
    color:#8bd0a6;
}

.mid{
    background:#302d1b;
    color:#d0bd75;
}

.bad{
    background:#321b24;
    color:#d58e9e;
}

.club-btn{
    width:100%;
    margin-top:7px;
    padding:8px;
    border:0;
    border-radius:8px;
    background:#29385d;
    color:#fff;
    font-size:10px;
    font-weight:800;
}

/* 存檔 */

.save-btn{
    width:100%;
    margin-top:7px;
    padding:10px;
    background:#0d1525;
    color:#e8edf8;
    border:1px solid #29344b;
    border-radius:9px;
}

/* 底部 */

.bottom{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:min(1050px,100%);
    height:66px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    background:rgba(8,13,24,.97);
    border-top:1px solid #222c42;
    z-index:100;
}

.nav{
    border:0;
    background:none;
    color:#69758c;
    font-size:10px;
}

.nav.active{
    color:#dce5ff;
}

.nav:disabled{
    color:#30394b;
    cursor:not-allowed;
}

.nav-icon{
    display:block;
    font-size:18px;
    margin-bottom:2px;

@media(max-width:699px){

    main{
        padding:10px;
    }

    .create-layout{
        grid-template-columns:1fr;
    }

    .club-grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:380px){

    .option-grid{
        grid-template-columns:repeat(2,1fr);
    }

}
</style>
</head>

/* =========================================================

========================================================= */

function regionButton(id,desc){

return `
<button
    class="option ${player.region===id?"active":""}"
    data-region="${id}"
    onclick="selectRegion('${id}')">

    ${id}
    <small>${desc}</small>

</button>
`;

}


function roleButton(id,desc){

return `
<button
    class="option ${player.role===id?"active":""}"
    data-role="${id}"
    onclick="selectRole('${id}')">

    ${id}
    <small>${desc}</small>

</button>
`;

}


/* =========================================================
   ★ 這次最重要的修正
   輸入文字不重新建立 input
========================================================= */

function updateCreateStatus(){

    const name =
        document.getElementById("nameInput").value.trim();

    const id =
        document.getElementById("idInput").value.trim();


    player.name=name;
    player.id=id;


    document
        .getElementById("statusName")
        .className=name?"done":"";


    document
        .getElementById("statusName")
        .textContent=
        name ? "✓ 姓名" : "○ 姓名";


    document
        .getElementById("statusID")
        .className=id?"done":"";


    document
        .getElementById("statusID")
        .textContent=
        id ? "✓ ID" : "○ ID";


    document
        .getElementById("statusRegion")
        .className=
        player.region ? "done":"";


    document
        .getElementById("statusRegion")
        .textContent=
        player.region
        ? "✓ 賽區"
        : "○ 賽區";


    document
        .getElementById("statusRole")
        .className=
        player.role ? "done":"";


    document
        .getElementById("statusRole")
        .textContent=
        player.role
        ? "✓ 位置"
        : "○ 位置";


    const complete =
        name &&
        id &&
        player.region &&
        player.role;


    const btn =
        document.getElementById("startButton");


    btn.disabled=!complete;


    btn.textContent=
        complete
        ? "開始我的職業生涯"
        : "請完成以上資料";

}


/* =========================================================
   選賽區
========================================================= */

function selectRegion(region){

    player.region=region;


    document
        .querySelectorAll("[data-region]")
        .forEach(button=>{

            button.classList.toggle(
                "active",
                button.dataset.region===region
            );

        });


    updateCreateStatus();

}


/* =========================================================
   選位置
========================================================= */

function selectRole(role){

    player.role=role;


    document
        .querySelectorAll("[data-role]")
        .forEach(button=>{

            button.classList.toggle(
                "active",
                button.dataset.role===role
            );

        });


    updateCreateStatus();

}


/* =========================================================
   真正建立
========================================================= */

function createPlayer(){

    const name=
        document.getElementById("nameInput")
        .value.trim();

    const id=
        document.getElementById("idInput")
        .value.trim();


    if(
        !name ||
        !id ||
        !player.region ||
        !player.role
    ){
        return;
    }


    player.name=name;
    player.id=id;
    player.created=true;


    enableNavigation();

    render();

}

        <div class="choice-title">
            📩 查看俱樂部市場
        </div>

        <div class="choice-effect">
            尋找青訓與職業隊伍機會
        </div>

    </button>

</div>

`;

}


/* =========================================================
   數值
========================================================= */

function statHTML(name,value){

return `

<div class="stat">

    <div class="stat-head">

        <span class="stat-name">
            ${name}
        </span>

        <span class="stat-value">

        </span>

            class="fill"
            style="width:${value}%">

</div>

/* =========================================================
   風格
========================================================= */

function calculateStyle(){

    const stats=[
        ["操作型",player.stats.operation],
        ["理解型",player.stats.gameSense],
        ["心態型",player.stats.mentality],
        ["體能型",player.stats.stamina]
    ];


    stats.sort((a,b)=>b[1]-a[1]);


    if(stats[0][1]<60){
        return "尚未定型";
    }


    if(stats[0][1]-stats[1][1]>=12){
        return stats[0][0];
    }


    return "均衡型";

}


/* =========================================================
   賽訓
========================================================= */

function training(){

    player.stats.operation=
        Math.min(100,player.stats.operation+2);

    player.stats.gameSense=
        Math.min(100,player.stats.gameSense+1);

    player.stats.stamina=
        Math.max(0,player.stats.stamina-1);


    render();

}


/* =========================================================
   俱樂部
========================================================= */

function clubHTML(club){

    const stars=
        "★".repeat(club.stars)+
        "☆".repeat(5-club.stars);


    const ability=
        Math.round(
            (
                player.stats.operation+
                player.stats.gameSense+
                player.stats.mentality
            )/3
        );


    const roster=
        club.roster[player.role]||80;


    let chance=
        50+(ability-roster)*2;


    chance=
        Math.max(
            5,
            Math.min(95,chance)
        );


    let status;
    let cls;


    if(chance>=70){

        status="🟢 先發機會不錯";
        cls="good";

    }else if(chance>=40){

        status="🟡 需要競爭先發";
        cls="mid";

    }else{

        status="🔴 先發競爭非常激烈";
        cls="bad";

    }


return `

<div class="club">

    <div class="club-top">

        <div>

            <div class="club-name">
                ${club.name}
            </div>

            <div class="club-region">
                ${club.region}・${club.history}
            </div>

        </div>

        <div class="stars">
            ${stars}
        </div>

    </div>


    <div class="club-desc">
        ${club.desc}
    </div>


    <div class="club-stats">

        <div class="club-stat">
            <b>${"★".repeat(club.academy)}</b>
            <span>青訓能力</span>
        </div>

        <div class="club-stat">
            <b>${"★".repeat(club.international)}</b>
            <span>國際競爭力</span>
        </div>

        <div class="club-stat">
            <b>${club.stars>=5?"🏆 冠軍熱門":club.stars>=4?"⚔️ 競爭者":"🌱 挑戰者"}</b>
            <span>戰隊定位</span>
        </div>

        <div class="club-stat">
            <b>${roster}</b>
            <span>${player.role}位置強度</span>
        </div>

    </div>


    <div class="club-status ${cls}">
        ${status}・${Math.round(chance)}%
    </div>


    <button
        class="club-btn"
        onclick="clubOffer('${club.name}')">

        查看青訓邀請

    </button>

</div>

`;

}


function clubHTMLList(){

    const domestic=
        CLUBS.filter(c=>c.region===player.region);

    const overseas=
        CLUBS.filter(c=>c.region!==player.region);


return `

<div class="title">
    俱樂部市場
</div>

<div class="subtitle">
    星級越高，通常代表陣容與資源越強；
    但強隊的先發競爭也會更加激烈。
</div>


<div class="card">

    <div class="card-title">
        🏠 ${player.region}・本賽區
    </div>

    <div class="club-grid">

        ${
            domestic.length
            ? domestic.map(clubHTML).join("")
            : "<div class='subtitle'>目前沒有資料。</div>"
        }

    </div>

</div>


<div class="card">

    <div class="card-title">
        🌏 海外隊伍
    </div>

    <div class="subtitle" style="margin-bottom:9px">
        海外隊伍通常帶來更高的國際曝光，但語言、文化與先發競爭也可能提高難度。
    </div>

    <div class="club-grid">

        ${overseas.map(clubHTML).join("")}

    </div>

</div>

`;

}


/* =========================================================
   青訓邀請
========================================================= */

function clubOffer(name){

    const club=
        CLUBS.find(c=>c.name===name);

    if(!club)return;


    const ability=
        Math.round(
            (
                player.stats.operation+
                player.stats.gameSense+
                player.stats.mentality
            )/3
        );


    const roster=
        club.roster[player.role]||80;


    let chance=
        50+(ability-roster)*2;


    chance=
        Math.max(
            5,
            Math.min(95,chance)
        );


    if(Math.random()*100<=chance){

        player.club=club.name;

        alert(
            `${club.name}\n\n`+
            "青訓教練對你的表現產生興趣。\n\n"+
            "你獲得了青訓邀請！"
        );


        navigate("life");

    }else{

        alert(
            `${club.name}\n\n`+
            "教練團認為你目前還需要更多成長。\n\n"+
            "這次沒有拿到邀請。"
        );

    }

}


/* =========================================================
   存檔
========================================================= */

function saveHTML(){

return `

<div class="title">
    存檔
</div>

<div class="subtitle">
    遊戲不會自動讀取存檔。
</div>


<div class="card">

    <div class="card-title">
        💾 遊戲進度
    </div>

    <button
        class="save-btn"
        onclick="saveGame()">

        💾 儲存目前進度

    </button>


    <button
        class="save-btn"
        onclick="loadGame()">

        📂 讀取存檔

    </button>


    <button
        class="save-btn"
        onclick="resetGame()">

        🔄 重置遊戲

    </button>

</div>


<div class="card">

    <div class="card-title">
        存檔規則
    </div>

    <div class="subtitle">

        每次重新打開遊戲預設都是新的生涯。
        只有主動選擇「讀取存檔」才會恢復進度。

    </div>

</div>

`;

}


function saveGame(){

    localStorage.setItem(
        "lolLifeSave",
        JSON.stringify(player)
    );

    alert("存檔成功！");

}


function loadGame(){

    const data=
        localStorage.getItem("lolLifeSave");


    if(!data){

        alert("目前沒有存檔。");
        return;

    }


    try{

        player=
            JSON.parse(data);

        player.created=true;

        enableNavigation();

        navigate("life");

    }catch(e){

        alert("存檔資料損壞。");

    }

}


function resetGame(){

    if(
        !confirm(
            "確定要重置目前遊戲嗎？"
        )
    ){
        return;
    }


    localStorage.removeItem(
        "lolLifeSave"
    );


    player={
        created:false,
        name:"",
        id:"",
        region:"",
        role:"",
        age:17,
        year:2026,
        club:null,

        stats:{
            operation:48,
            gameSense:45,
            mentality:47,
            stamina:50
        }
    };


    disableNavigation();

    render();

}


/* =========================================================
   導覽
========================================================= */

function navigate(page){

    if(!player.created){

        render();
        return;

    }


    document
        .querySelectorAll(".nav")
        .forEach(x=>x.classList.remove("active"));


    if(page==="life"){

        document
            .getElementById("navLife")
            .classList.add("active");

        document
            .getElementById("screen")
            .innerHTML=
            lifeHTML();

    }


    if(page==="club"){

        document
            .getElementById("navClub")
            .classList.add("active");

        document
            .getElementById("screen")
            .innerHTML=
            clubHTMLList();

    }


    if(page==="save"){

        document
            .getElementById("navSave")
            .classList.add("active");

        document
            .getElementById("screen")
            .innerHTML=
            saveHTML();

    }


    updateTop();

}


/* =========================================================
   導覽權限
========================================================= */

function enableNavigation(){

    document.getElementById("navClub").disabled=false;
    document.getElementById("navSave").disabled=false;

}


function disableNavigation(){

    document.getElementById("navClub").disabled=true;
    document.getElementById("navSave").disabled=true;

}


/* =========================================================
   Render
========================================================= */

function render(){

    const screen=
        document.getElementById("screen");


    if(!player.created){

        screen.innerHTML=
            creationHTML();


        /*
         * 這裡只在第一次建立頁面時生成 input。
         * 後續輸入文字不會觸發 render。
         */

        const nameInput=
            document.getElementById("nameInput");

        const idInput=
            document.getElementById("idInput");


        nameInput.addEventListener(
            "input",
            updateCreateStatus
        );


        idInput.addEventListener(
            "input",
            updateCreateStatus
        );


        updateTop();

        return;

    }


    enableNavigation();

    screen.innerHTML=
        lifeHTML();

    document
        .querySelectorAll(".nav")
        .forEach(x=>x.classList.remove("active"));

    document
        .getElementById("navLife")
        .classList.add("active");

    updateTop();

}


/* =========================================================
   TOP
========================================================= */

function updateTop(){

    document
        .getElementById("topName")
        .textContent=
        player.created
        ? `${player.name}「${player.id}」`
        : "尚未建立選手";


    document
        .getElementById("topSub")
        .textContent=
        player.created
        ? `${player.region} · ${player.role} · ${player.year}`
        : "建立你的職業人生";


    document
        .getElementById("topAge")
        .textContent=
        `${player.age}歲`;

}


/* =========================================================
   啟動
========================================================= */

disableNavigation();
render();

</script>

</body>
</html>
