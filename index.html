<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎮 電競人生模擬器</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111318;
    color:#eeeeee;
    font-family:Arial,"Microsoft JhengHei",sans-serif;
}

button,input{
    font-family:inherit;
}

#app{
    width:94%;
    max-width:1000px;
    margin:25px auto 60px;
}

/* =========================
   共用
========================= */

.panel{
    background:#20232a;
    border:1px solid #343841;
    border-radius:14px;
    padding:22px;
    margin-bottom:14px;
}

button{
    cursor:pointer;
}

h1,h2,h3{
    margin-top:0;
}

.muted{
    color:#999;
}

.small{
    font-size:13px;
    color:#999;
}

/* =========================
   主選單
========================= */

.menu{
    text-align:center;
    padding:40px 25px;
}

.menu h1{
    font-size:34px;
    margin-bottom:10px;
}

.menu-sub{
    color:#999;
    margin-bottom:35px;
}

.menu-button{
    display:block;
    width:100%;
    max-width:500px;
    margin:12px auto;
    padding:16px;
    border-radius:10px;
    border:1px solid #444952;
    background:#2a2e36;
    color:white;
    font-size:17px;
}

.menu-button:hover{
    background:#383d47;
}

.menu-button.primary{
    background:#eeeeee;
    color:#111;
}

.menu-button.danger{
    color:#ff8d8d;
}

/* =========================
   建立角色
========================= */

.input{
    width:100%;
    padding:13px;
    margin-top:7px;
    border-radius:8px;
    border:1px solid #414650;
    background:#181a1f;
    color:white;
    font-size:16px;
}

.field{
    margin-bottom:20px;
}

.option-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.option{
    padding:15px;
    border-radius:10px;
    border:1px solid #414650;
    background:#292d35;
    color:white;
    text-align:left;
}

.option:hover{
    background:#363b45;
}

.option.selected{
    border-color:white;
    background:#3b404b;
}

.option strong{
    display:block;
    margin-bottom:5px;
}

.option small{
    color:#999;
}

.start{
    width:100%;
    margin-top:25px;
    padding:16px;
    border:none;
    border-radius:10px;
    background:#eeeeee;
    color:#111;
    font-size:17px;
    font-weight:bold;
}

/* =========================
   頭部
========================= */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.player-name{
    font-size:24px;
    font-weight:bold;
}

.player-id{
    color:#999;
    margin-top:3px;
}

.year{
    text-align:right;
}

.year strong{
    display:block;
    font-size:22px;
}

/* =========================
   能力
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:8px;
}

.stat{
    background:#20232a;
    border:1px solid #343841;
    border-radius:10px;
    padding:12px;
    text-align:center;
}

.stat-name{
    color:#999;
    font-size:12px;
}

.stat-value{
    font-size:21px;
    font-weight:bold;
    margin-top:5px;
}

/* =========================
   身分
========================= */

.tags{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.tag{
    background:#30343c;
    border-radius:20px;
    padding:7px 12px;
    font-size:13px;
}

/* =========================
   時間軸
========================= */

.timeline{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;
    margin-bottom:14px;
}

.timeline div{
    padding:9px 4px;
    text-align:center;
    border-radius:7px;
    background:#24272e;
    color:#666;
    font-size:12px;
}

.timeline .active{
    background:#454a55;
    color:white;
}

/* =========================
   事件
========================= */

.event-date{
    color:#888;
    font-size:13px;
    margin-bottom:7px;
}

.event-title{
    font-size:27px;
    font-weight:bold;
    margin-bottom:15px;
}

.event-text{
    color:#d4d4d4;
    line-height:1.9;
    white-space:pre-line;
    margin-bottom:22px;
}

.choices{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.choice{
    width:100%;
    padding:15px;
    border-radius:10px;
    border:1px solid #414650;
    background:#2b2f37;
    color:white;
    text-align:left;
}

.choice:hover{
    background:#383d47;
}

.choice-title{
    font-size:16px;
    font-weight:bold;
}

.choice-effect{
    color:#999;
    font-size:13px;
    margin-top:6px;
}

/* =========================
   結果
========================= */

.result{
    padding:18px;
    background:#181a1f;
    border:1px solid #383c45;
    border-radius:10px;
    line-height:1.9;
    white-space:pre-line;
}

.continue{
    width:100%;
    margin-top:14px;
    padding:14px;
    border:none;
    border-radius:9px;
    background:#eeeeee;
    color:#111;
    font-size:16px;
    font-weight:bold;
}

/* =========================
   英雄池調查
========================= */

.diagnosis{
    margin-top:12px;
    padding:13px;
    border-radius:8px;
    background:#181a1f;
}

.diagnosis-title{
    color:#999;
    font-size:12px;
}

.diagnosis-value{
    font-size:19px;
    margin-top:4px;
}

/* =========================
   紀錄
========================= */

.history{
    max-height:240px;
    overflow-y:auto;
}

.history-item{
    padding:9px 0;
    border-bottom:1px solid #343841;
    color:#ccc;
    line-height:1.6;
}

/* =========================
   底部
========================= */

.bottom{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.bottom button{
    padding:11px;
    border-radius:8px;
    border:1px solid #363a44;
    background:#20232a;
    color:#ccc;
}

.bottom button:hover{
    background:#30343c;
}

/* =========================
   年度結算
========================= */

.summary-line{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid #343841;
}

.next-year{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:9px;
    background:#eeeeee;
    color:#111;
    font-weight:bold;
    font-size:16px;
}

/* =========================
   RWD
========================= */

@media(max-width:700px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .option-grid{
        grid-template-columns:1fr;
    }

    .bottom{
        grid-template-columns:repeat(2,1fr);
    }

    .header{
        flex-direction:column;
        align-items:flex-start;
        gap:10px;
    }

    .year{
        text-align:left;
    }

}

</style>
</head>

<body>

<div id="app"></div>

<script>

/* =====================================================
   初始資料
===================================================== */

function newPlayer(){

    return {

        name:"",
        id:"",

        age:16,
        year:2026,

        region:"",
        position:"",

        career:"高中生",
        club:"",

        skill:50,
        sense:50,
        mental:50,
        stamina:50,
        fame:0,
        experience:0,

        /*
            英雄池真正數值
            玩家不直接看到
        */

        heroStyle:{
            assassin:50,
            mage:50,
            poke:50,
            utility:50
        },

        heroPool:{
            assassin:50,
            mage:50,
            poke:50,
            utility:50
        },

        heroDiagnosis:"尚未調查",
        heroPenalty:0,

        /*
            語言完全隱藏
        */

        languages:{
            native:80,
            korean:0,
            chinese:0,
            english:0,
            vietnamese:0,
            japanese:0
        },

        localLanguage:"native",

        phase:0,

        seasonResult:"",

        history:[],

        /*
            上一步專用
        */

        undoState:null

    };

}


/* =====================================================
   當前玩家
===================================================== */

let player = newPlayer();


let setup = {

    name:"",
    id:"",
    region:"",
    position:""

};


/* =====================================================
   主選單
===================================================== */

function renderMenu(){

    let hasSave =
        localStorage.getItem(
            "esportsLifeSave"
        );

    document.getElementById("app").innerHTML = `

    <div class="panel menu">

        <h1>
            🎮 電競人生模擬器
        </h1>

        <div class="menu-sub">
            從16歲開始，看看你能不能走上職業舞台。
        </div>

        ${
            hasSave
            ?
            `
            <button
                class="menu-button primary"
                onclick="loadGame()"
            >
                ▶ 讀取上次存檔
            </button>
            `
            :
            ""
        }

        <button
            class="menu-button"
            onclick="renderCreate()"
        >
            🆕 開始新人生
        </button>

        ${
            hasSave
            ?
            `
            <button
                class="menu-button danger"
                onclick="deleteSave()"
            >
                🗑️ 刪除存檔
            </button>
            `
            :
            ""
        }

    </div>

    `;

}


/* =====================================================
   建立角色
===================================================== */

function renderCreate(){

    document.getElementById("app").innerHTML = `

    <div class="panel">

        <h1>
            建立你的選手
        </h1>

        <div class="field">

            <label>
                選手姓名
            </label>

            <input
                id="playerName"
                class="input"
                placeholder="例如：李相赫"
                maxlength="20"
            >

        </div>


        <div class="field">

            <label>
                遊戲 ID
            </label>

            <input
                id="playerID"
                class="input"
                placeholder="例如：Faker"
                maxlength="20"
            >

        </div>


        <div class="field">

            <strong>
                🌏 出身賽區
            </strong>

            <div
                class="option-grid"
                style="margin-top:10px"
            >

                ${createOption(
                    "region",
                    "LCK",
                    "🇰🇷 LCK",
                    "韓國"
                )}

                ${createOption(
                    "region",
                    "LPL",
                    "🇨🇳 LPL",
                    "中國"
                )}

                ${createOption(
                    "region",
                    "LEC",
                    "🇪🇺 LEC",
                    "歐洲"
                )}

                ${createOption(
                    "region",
                    "LCS",
                    "🇺🇸 LCS",
                    "北美"
                )}

                ${createOption(
                    "region",
                    "LCP",
                    "🌏 LCP",
                    "亞太"
                )}

                ${createOption(
                    "region",
                    "CBLOL",
                    "🇧🇷 CBLOL",
                    "巴西"
                )}

            </div>

        </div>


        <div class="field">

            <strong>
                🛣️ 登記位置
            </strong>

            <div
                class="option-grid"
                style="margin-top:10px"
            >

                ${createOption(
                    "position",
                    "TOP",
                    "🛡️ TOP",
                    "上路"
                )}

                ${createOption(
                    "position",
                    "JUNGLE",
                    "🌲 JUNGLE",
                    "打野"
                )}

                ${createOption(
                    "position",
                    "MID",
                    "⚔️ MID",
                    "中路"
                )}

                ${createOption(
                    "position",
                    "ADC",
                    "🎯 ADC",
                    "下路"
                )}

                ${createOption(
                    "position",
                    "SUPPORT",
                    "🧭 SUPPORT",
                    "輔助"
                )}

            </div>

        </div>


        <button
            class="start"
            onclick="startNewGame()"
        >
            🎮 開始電競人生
        </button>

    </div>

    `;

}


function createOption(
    type,
    value,
    title,
    description
){

    return `

    <button
        class="option ${
            setup[type] === value
            ? "selected"
            : ""
        }"
        onclick="selectSetup(
            '${type}',
            '${value}'
        )"
    >

        <strong>
            ${title}
        </strong>

        <small>
            ${description}
        </small>

    </button>

    `;

}


function selectSetup(
    type,
    value
){

    setup[type] = value;

    renderCreate();

}


/* =====================================================
   開始新遊戲
===================================================== */

function startNewGame(){

    let name =
        document.getElementById(
            "playerName"
        ).value.trim();

    let id =
        document.getElementById(
            "playerID"
        ).value.trim();


    if(!name || !id){

        alert(
            "請輸入選手姓名與遊戲 ID。"
        );

        return;

    }


    if(
        !setup.region ||
        !setup.position
    ){

        alert(
            "請選擇出身賽區與位置。"
        );

        return;

    }


    player = newPlayer();

    player.name = name;
    player.id = id;

    player.region =
        setup.region;

    player.position =
        setup.position;


    /*
        設定本土語言
    */

    if(
        player.region === "LCK"
    ){

        player.languages.korean = 80;
        player.localLanguage =
            "korean";

    }

    else if(
        player.region === "LPL"
    ){

        player.languages.chinese = 80;
        player.localLanguage =
            "chinese";

    }

    else if(
        player.region === "LEC" ||
        player.region === "LCS"
    ){

        player.languages.english = 80;
        player.localLanguage =
            "english";

    }

    else if(
        player.region === "LCP"
    ){

        player.languages.english = 50;
        player.localLanguage =
            "english";

    }

    else{

        player.localLanguage =
            "native";

    }


    player.history.push(
        `${player.year}年：${player.name}（${player.id}）開始了電競人生。`
    );


    renderGame();

    showPhase();

}


/* =====================================================
   主遊戲畫面
===================================================== */

function renderGame(){

    document.getElementById("app").innerHTML = `

    <div class="panel header">

        <div>

            <div class="player-name">
                ${escapeHTML(player.name)}
            </div>

            <div class="player-id">
                ID：${escapeHTML(player.id)}
            </div>

        </div>


        <div class="year">

            <strong>
                ${player.year}
            </strong>

            ${player.age} 歲

        </div>

    </div>


    <div class="stats">

        ${stat("操作","skill")}

        ${stat("遊戲理解","sense")}

        ${stat("心態","mental")}

        ${stat("體力","stamina")}

        ${stat("人氣","fame")}

        ${stat("經驗","experience")}

    </div>


    <div class="panel">

        <div class="tags">

            <span class="tag">
                ${regionName()}
            </span>

            <span class="tag">
                ${positionName()}
            </span>

            <span class="tag">
                ${player.career}
            </span>

            ${
                player.club
                ?
                `<span class="tag">
                    🏢 ${player.club}
                </span>`
                :
                ""
            }

        </div>

    </div>


    <div class="timeline">

        <div id="phase0">
            年初
        </div>

        <div id="phase1">
            賽訓
        </div>

        <div id="phase2">
            比賽
        </div>

        <div id="phase3">
            休賽期
        </div>

    </div>


    <div
        class="panel"
        id="eventArea"
    ></div>


    ${
        player.heroDiagnosis !== "尚未調查"
        ?
        `
        <div class="panel">

            <div class="diagnosis">

                <div class="diagnosis-title">
                    🎮 最近一次英雄池調查
                </div>

                <div class="diagnosis-value">
                    ${player.heroDiagnosis}
                </div>

            </div>

        </div>
        `
        :
        ""
    }


    <div class="panel">

        <h3>
            📜 人生紀錄
        </h3>

        <div class="history">

            ${
                player.history
                .slice()
                .reverse()
                .map(
                    item =>
                    `
                    <div class="history-item">
                        ${item}
                    </div>
                    `
                )
                .join("")
            }

        </div>

    </div>


    <div class="bottom">

        <button onclick="saveGame()">
            💾 儲存
        </button>

        <button onclick="goBack()">
            ⬅️ 上一步
        </button>

        <button onclick="renderMenu()">
            🏠 主選單
        </button>

        <button onclick="restartConfirm()">
            🔄 新人生
        </button>

    </div>

    `;

}


/* =====================================================
   數值
===================================================== */

function stat(
    name,
    key
){

    return `

    <div class="stat">

        <div class="stat-name">
            ${name}
        </div>

        <div class="stat-value">
            ${Math.round(
                player[key]
            )}
        </div>

    </div>

    `;

}


/* =====================================================
   階段
===================================================== */

function showPhase(){

    updateTimeline();


    if(
        player.phase === 0
    ){

        showStartOfYear();

    }

    else if(
        player.phase === 1
    ){

        showTraining();

    }

    else if(
        player.phase === 2
    ){

        runCompetition();

    }

    else if(
        player.phase === 3
    ){

        showOffSeason();

    }

}


/* =====================================================
   時間軸
===================================================== */

function updateTimeline(){

    for(
        let i=0;
        i<4;
        i++
    ){

        let el =
            document.getElementById(
                "phase"+i
            );

        if(el){

            el.classList.toggle(
                "active",
                i === player.phase
            );

        }

    }

}


/* =====================================================
   年初
===================================================== */

function showStartOfYear(){

    let text;


    if(
        player.age === 16
    ){

        text =
`你是一名16歲的高中生。

放學之後，你開始比以前更加認真地打英雄聯盟。

原本只是遊戲。

但最近，你第一次產生了一個念頭：

「如果我真的可以成為職業選手呢？」

你的電競人生，正式開始。`;

    }

    else{

        text =
`新的一年開始。

你回頭看著過去一年的自己。

你已經和剛開始時不同。

但職業電競的道路，
仍然遠遠沒有結束。`;

    }


    showChoices(
        "新的一年",
        text,
        [

            {
                title:
                    "🎮 大量排位",
                effect:
                    "操作 +4　體力 -3",
                action:()=>{

                    saveUndo();

                    player.skill += 4;
                    player.stamina -= 3;

                    player.heroStyle.assassin += 2;
                    player.heroPool.assassin += 2;

                }

            },

            {
                title:
                    "🧠 研究比賽",
                effect:
                    "遊戲理解 +4",
                action:()=>{

                    saveUndo();

                    player.sense += 4;

                    player.heroStyle.mage += 2;
                    player.heroPool.mage += 2;

                }

            },

            {
                title:
                    "🎯 嘗試不同打法",
                effect:
                    "各類英雄池小幅成長",
                action:()=>{

                    saveUndo();

                    let keys=[
                        "assassin",
                        "mage",
                        "poke",
                        "utility"
                    ];

                    keys.forEach(
                        key=>{

                            player.heroStyle[key]+=2;
                            player.heroPool[key]+=2;

                        }
                    );

                }

            },

            {
                title:
                    "🧘 保持狀態",
                effect:
                    "心態 +4　體力 +4",
                action:()=>{

                    saveUndo();

                    player.mental += 4;
                    player.stamina += 4;

                }

            }

        ]
    );

}


/* =====================================================
   賽訓
===================================================== */

function showTraining(){

    showChoices(
        "賽季前賽訓",
`新賽季即將開始。

現在進入真正的賽訓階段。

這裡不是正式比賽，
你的選擇會影響接下來的狀態。`,
        [

            {
                title:
                    "🏋️ 強化操作",
                effect:
                    "操作 +5　體力 -4",
                action:()=>{

                    saveUndo();

                    player.skill+=5;
                    player.stamina-=4;

                }

            },

            {
                title:
                    "🧠 戰術訓練",
                effect:
                    "遊戲理解 +5",
                action:()=>{

                    saveUndo();

                    player.sense+=5;
                    player.heroStyle.utility+=2;
                    player.heroPool.utility+=2;

                }

            },

            {
                title:
                    "🎮 英雄池訓練",
                effect:
                    "進一步形成自己的打法",
                action:()=>{

                    saveUndo();

                    showHeroTraining();

                }

            },

            {
                title:
                    "🧘 心理與體能",
                effect:
                    "心態 +4　體力 +5",
                action:()=>{

                    saveUndo();

                    player.mental+=4;
                    player.stamina+=5;

                }

            }

        ]
    );

}


/* =====================================================
   英雄池
===================================================== */

function showHeroTraining(){

    showChoices(
        "英雄池訓練",
`教練問你：

「今年你想把哪種打法再往前推？」

你不是在選擇自己的最終類型。

你只是選擇這次訓練的方向。

長期累積後，
系統才會判斷你真正的英雄池風格。`,
        [

            {
                title:
                    "🔪 進攻與單殺",
                effect:
                    "刺客傾向 +6",
                action:()=>{

                    player.heroStyle.assassin+=6;
                    player.heroPool.assassin+=5;

                }

            },

            {
                title:
                    "🔮 技能與團戰輸出",
                effect:
                    "大法師傾向 +6",
                action:()=>{

                    player.heroStyle.mage+=6;
                    player.heroPool.mage+=5;

                }

            },

            {
                title:
                    "🎯 遠程消耗",
                effect:
                    "Poke傾向 +6",
                action:()=>{

                    player.heroStyle.poke+=6;
                    player.heroPool.poke+=5;

                }

            },

            {
                title:
                    "🧭 團隊功能",
                effect:
                    "功能傾向 +6",
                action:()=>{

                    player.heroStyle.utility+=6;
                    player.heroPool.utility+=5;

                }

            }

        ]
    );

}


/* =====================================================
   比賽
===================================================== */

function runCompetition(){

    diagnoseHeroPool();


    let heroAverage =
        (
            player.heroPool.assassin+
            player.heroPool.mage+
            player.heroPool.poke+
            player.heroPool.utility
        )/4;


    let language =
        getLanguage();


    let languageBonus=0;


    if(language>=70){

        languageBonus=5;

    }

    else if(language<30){

        languageBonus=-5;

    }


    let power =
        player.skill*.30+
        player.sense*.30+
        player.mental*.15+
        player.stamina*.10+
        heroAverage*.15+
        languageBonus-
        player.heroPenalty;


    let random =
        Math.random()*16-8;


    let finalPower =
        power+random;


    let result;


    if(
        finalPower>=75
    ){

        result =
`🏆 你打出了非常亮眼的賽季。

你的表現開始受到更多人的注意。

人氣 +8
心態 +3`;

        player.fame+=8;
        player.mental+=3;
        player.experience+=6;

        player.seasonResult="頂尖";

    }

    else if(
        finalPower>=60
    ){

        result =
`⚔️ 你完成了一個不錯的賽季。

你的表現獲得教練與隊友肯定。

人氣 +4`;

        player.fame+=4;
        player.experience+=4;

        player.seasonResult="良好";

    }

    else if(
        finalPower>=45
    ){

        result =
`😐 你的賽季表現普通。

你沒有犯下太多錯誤，
但也沒有成為最受矚目的選手。`;

        player.experience+=2;

        player.seasonResult="普通";

    }

    else{

        result =
`😓 這個賽季並不順利。

幾場關鍵比賽的失誤，
讓你的評價下降。

心態 -3`;

        player.mental-=3;

        player.seasonResult="失利";

    }


    player.history.push(
        `${player.year}年：完成賽季，成績為「${player.seasonResult}」。`
    );


    showResult(
        "🏆 正式比賽",
`賽季正式開始。

你前面的訓練，
現在全部轉化成比賽表現。

英雄池調查：
${player.heroDiagnosis}

${
    player.heroPenalty>0
    ?
    "⚠️ 英雄池缺乏明確武器，競爭力受到影響。"
    :
    "你的英雄池沒有產生額外懲罰。"
}

${result}

綜合競爭力：
${Math.round(finalPower)}`,
        "進入休賽期"
    );

}


/* =====================================================
   英雄池調查
===================================================== */

function diagnoseHeroPool(){

    let values=[
        player.heroStyle.assassin,
        player.heroStyle.mage,
        player.heroStyle.poke,
        player.heroStyle.utility
    ];


    let sorted =
        [...values].sort(
            (a,b)=>b-a
        );


    let max=sorted[0];
    let second=sorted[1];
    let min=sorted[3];

    let average =
        values.reduce(
            (a,b)=>a+b,
            0
        )/4;


    player.heroPenalty=0;


    /*
       絕活型
    */

    if(
        max>=75 &&
        max-second>=12
    ){

        player.heroDiagnosis=
            "🔪 絕活型";

        return;

    }


    /*
       專精型
    */

    if(
        max-second>=8
    ){

        player.heroDiagnosis=
            "🎯 專精型";

        return;

    }


    /*
       所有都不高且很接近
       → 平庸
    */

    if(
        max<65 &&
        max-min<=6
    ){

        player.heroDiagnosis=
            "😐 平庸型";

        player.heroPenalty=8;

        return;

    }


    /*
       均衡
    */

    if(
        max-min<=8
    ){

        player.heroDiagnosis=
            "⚖️ 均衡型";

        if(
            average<60
        ){

            player.heroPenalty=4;

        }

        return;

    }


    player.heroDiagnosis=
        "🎲 偏科型";

    player.heroPenalty=2;

}


/* =====================================================
   休賽期
===================================================== */

function showOffSeason(){

    let choices=[

        {
            title:
                "🔥 繼續衝刺",
            effect:
                "操作 +3　遊戲理解 +2　體力 -3",
            action:()=>{

                saveUndo();

                player.skill+=3;
                player.sense+=2;
                player.stamina-=3;

            }

        },

        {
            title:
                "📚 修正弱點",
            effect:
                "目前最低能力 +5",
            action:()=>{

                saveUndo();

                let keys=[
                    "skill",
                    "sense",
                    "mental",
                    "stamina"
                ];

                keys.sort(
                    (a,b)=>
                    player[a]-player[b]
                );

                player[keys[0]]+=5;

            }

        },

        {
            title:
                "😴 好好休息",
            effect:
                "體力 +8　心態 +5",
            action:()=>{

                saveUndo();

                player.stamina+=8;
                player.mental+=5;

            }

        }

    ];


    /*
       海外語言事件
    */

    if(
        player.club &&
        player.localLanguage!=="native"
    ){

        choices.push({

            title:
                "🗣️ 主動學習當地語言",
            effect:
                "隱藏語言能力提升",
            action:()=>{

                saveUndo();

                trainLanguage();

                player.history.push(
                    `${player.year}年：主動學習隊伍所在地語言。`
                );

            }

        });

    }


    showChoices(
        "休賽期",
`賽季結束。

你終於有時間重新檢視自己。

這段時間的選擇，
會影響下一個賽季的狀態。`,
        choices
    );

}


/* =====================================================
   語言
===================================================== */

function trainLanguage(){

    let key=
        player.localLanguage;

    if(
        key==="native"
    ){

        return;

    }

    player.languages[key]+=8;

}


function getLanguage(){

    return (
        player.languages[
            player.localLanguage
        ] || 0
    );

}


/* =====================================================
   語言年度自然成長
===================================================== */

function yearlyLanguageGrowth(){

    let key=
        player.localLanguage;


    if(
        key==="native"
    ){

        return;

    }


    player.languages[key]+=3;

}


/* =====================================================
   選項系統
===================================================== */

function showChoices(
    title,
    text,
    choices
){

    updateTimeline();


    let html=`

    <div class="event-date">
        ${phaseName()}
    </div>

    <div class="event-title">
        ${title}
    </div>

    <div class="event-text">
        ${text}
    </div>

    <div class="choices">

    `;


    choices.forEach(
        (choice,index)=>{

            html+=`

            <button
                class="choice"
                onclick="choose(${index})"
            >

                <div class="choice-title">
                    ${choice.title}
                </div>

                <div class="choice-effect">
                    ${choice.effect}
                </div>

            </button>

            `;

        }
    );


    html+=`

    </div>

    `;


    document.getElementById(
        "eventArea"
    ).innerHTML=html;


    window.currentChoices=
        choices;

}


/* =====================================================
   選擇
===================================================== */

function choose(index){

    let choice=
        window.currentChoices[index];


    choice.action();


    normalize();


    /*
       英雄池訓練選單不立即推進
    */

    if(
        choice.title.includes(
            "英雄池訓練"
        )
    ){

        return;

    }


    /*
       所有正常選項完成後
       才進入下一階段提示
    */

    showResult(
        "你的選擇",
`你選擇了：

${choice.title}

${choice.effect}`,
        nextButtonText()
    );

}


/* =====================================================
   結果
===================================================== */

function showResult(
    title,
    text,
    nextText
){

    document.getElementById(
        "eventArea"
    ).innerHTML=`

    <div class="event-date">
        ${phaseName()}
    </div>

    <div class="event-title">
        ${title}
    </div>

    <div class="result">
        ${text}
    </div>

    <button
        class="continue"
        onclick="nextPhase()"
    >
        ▶ ${nextText}
    </button>

    `;

}


/* =====================================================
   下一階段
===================================================== */

function nextPhase(){

    if(
        player.phase===0
    ){

        player.phase=1;

        renderGame();
        showPhase();

        return;

    }


    if(
        player.phase===1
    ){

        player.phase=2;

        renderGame();

        setTimeout(
            showPhase,
            100
        );

        return;

    }


    if(
        player.phase===2
    ){

        player.phase=3;

        renderGame();
        showPhase();

        return;

    }


    if(
        player.phase===3
    ){

        yearlyLanguageGrowth();

        showYearSummary();

    }

}


/* =====================================================
   年度結算
===================================================== */

function showYearSummary(){

    document.getElementById(
        "app"
    ).innerHTML=`

    <div class="panel">

        <h1>
            📅 ${player.year} 年度結算
        </h1>

        <p class="muted">
            這一年結束了。
        </p>


        <div class="summary-line">
            <span>選手</span>
            <strong>
                ${escapeHTML(player.id)}
            </strong>
        </div>


        <div class="summary-line">
            <span>年齡</span>
            <strong>
                ${player.age} 歲
            </strong>
        </div>


        <div class="summary-line">
            <span>年度成績</span>
            <strong>
                ${player.seasonResult}
            </strong>
        </div>


        <div class="summary-line">
            <span>操作</span>
            <strong>
                ${Math.round(player.skill)}
            </strong>
        </div>


        <div class="summary-line">
            <span>遊戲理解</span>
            <strong>
                ${Math.round(player.sense)}
            </strong>
        </div>


        <div class="summary-line">
            <span>心態</span>
            <strong>
                ${Math.round(player.mental)}
            </strong>
        </div>


        <div class="summary-line">
            <span>體力</span>
            <strong>
                ${Math.round(player.stamina)}
            </strong>
        </div>


        <div class="summary-line">
            <span>人氣</span>
            <strong>
                ${Math.round(player.fame)}
            </strong>
        </div>


        <h3 style="margin-top:25px">
            🎮 英雄池調查
        </h3>

        <div class="diagnosis">

            <div class="diagnosis-value">
                ${player.heroDiagnosis}
            </div>

            ${
                player.heroPenalty>0
                ?
                `
                <div class="small">
                    ⚠️ 目前缺乏明確武器，
                    下賽季競爭力受到影響。
                </div>
                `
                :
                `
                <div class="small">
                    目前沒有英雄池額外懲罰。
                </div>
                `
            }

        </div>


        <h3 style="margin-top:25px">
            📜 年度紀錄
        </h3>

        <div class="history">

            ${
                player.history
                .slice()
                .reverse()
                .slice(0,8)
                .map(
                    x=>
                    `
                    <div class="history-item">
                        ${x}
                    </div>
                    `
                )
                .join("")
            }

        </div>


        <button

            onclick="nextYear()"
        >
            ▶ 進入 ${player.year+1} 年
        </button>

    `;

}


/* =====================================================
   下一年
===================================================== */

function nextYear(){

    player.age++;
    player.year++;

    player.phase=0;

    player.seasonResult="";


    /*
       年度恢復
    */

    player.stamina+=8;


    if(
        player.age>=18 &&
        !player.club
    ){

        player.career=
            "業餘選手";

    }


    normalize();


    renderGame();
    showPhase();

}


/* =====================================================
   上一步
===================================================== */

function saveUndo(){

    /*
       只保存真正做選擇前的狀態。
       因此可以退回上一個決策。
    */

    player.undoState=
        JSON.stringify(
            player
        );

}


function goBack(){

    if(
        !player.undoState
    ){

        alert(
            "目前沒有可以返回的決策。"
        );

        return;

    }


    let restored=
        JSON.parse(
            player.undoState
        );


    /*
       保留 undoState，
       讓使用者不會因為返回後立刻失去返回能力。
    */

    player=restored;


    renderGame();
    showPhase();

}


/* =====================================================
   存檔
===================================================== */

function saveGame(){

    /*
       存檔本身不包含暫時的 undo 狀態，
       避免存檔後產生奇怪的回退。
    */

    let save=
        JSON.parse(
            JSON.stringify(player)
        );


    localStorage.setItem(
        "esportsLifeSave",
        JSON.stringify(save)
    );


    alert(
        "💾 人生已儲存。"
    );

}


/* =====================================================
   讀檔
===================================================== */

function loadGame(){

    let save=
        localStorage.getItem(
            "esportsLifeSave"
        );


    if(!save){

        alert(
            "目前沒有存檔。"
        );

        return;

    }


    player=
        JSON.parse(save);


    /*
       每次從存檔讀取後，
       上一步重新清空。
    */

    player.undoState=null;


    renderGame();
    showPhase();

}


/* =====================================================
   刪除存檔
===================================================== */

function deleteSave(){

    if(
        !confirm(
            "確定要刪除存檔嗎？"
        )
    ){

        return;

    }


    localStorage.removeItem(
        "esportsLifeSave"
    );


    renderMenu();

}


/* =====================================================
   重開
===================================================== */

function restartConfirm(){

    if(
        !confirm(
            "確定要放棄目前人生並開始新遊戲嗎？"
        )
    ){

        return;

    }


    player=
        newPlayer();


    setup={
        name:"",
        id:"",
        region:"",
        position:""
    };


    renderCreate();

}


/* =====================================================
   名稱
===================================================== */

function regionName(){

    return {

        LCK:"🇰🇷 LCK",
        LPL:"🇨🇳 LPL",
        LEC:"🇪🇺 LEC",
        LCS:"🇺🇸 LCS",
        LCP:"🌏 LCP",
        CBLOL:"🇧🇷 CBLOL"

    }[player.region];

}


function positionName(){

    return {

        TOP:"🛡️ TOP",
        JUNGLE:"🌲 JUNGLE",
        MID:"⚔️ MID",
        ADC:"🎯 ADC",
        SUPPORT:"🧭 SUPPORT"

    }[player.position];

}


function phaseName(){

    return [

        "年初規劃",
        "賽季前・賽訓",
        "正式比賽",
        "休賽期"

    ][player.phase];

}


function nextButtonText(){

    return [

        "進入賽訓期",
        "進入正式比賽",
        "進入休賽期",
        "進入年度結算"

    ][player.phase];

}


/* =====================================================
   限制數值
===================================================== */

function normalize(){

    let keys=[
        "skill",
        "sense",
        "mental",
        "stamina",
        "fame",
        "experience"
    ];


    keys.forEach(
        key=>{

            player[key]=
                Math.max(
                    0,
                    Math.min(
                        100,
                        player[key]
                    )
                );

        }
    );


    Object.keys(
        player.heroPool
    ).forEach(
        key=>{

            player.heroPool[key]=
                Math.max(
                    0,
                    Math.min(
                        100,
                        player.heroPool[key]
                    )
                );

        }
    );


    Object.keys(
        player.heroStyle
    ).forEach(
        key=>{

            player.heroStyle[key]=
                Math.max(
                    0,
                    Math.min(
                        100,
                        player.heroStyle[key]
                    )
                );

        }
    );


    Object.keys(
        player.languages
    ).forEach(
        key=>{

            player.languages[key]=
                Math.max(
                    0,
                    Math.min(
                        100,
                        player.languages[key]
                    )
                );

        }
    );

}


/* =====================================================
   HTML 安全
===================================================== */

function escapeHTML(text){

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   初始化
===================================================== */

renderMenu();

</script>
