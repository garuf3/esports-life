<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeSL My Player｜跑跑職業人生 DEMO</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111827;
    color: #f3f4f6;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
}

button {
    font: inherit;
}

#app {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    min-height: 100vh;
    padding: 20px;
}

.header {
    background: #1f2937;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid #374151;
}

.header h1 {
    margin: 0 0 6px;
    font-size: 26px;
}

.subtitle {
    color: #9ca3af;
    font-size: 14px;
}

.panel {
    background: #1f2937;
    border: 1px solid #374151;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 16px;
}

.panel h2 {
    margin-top: 0;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

.card {
    background: #111827;
    border: 1px solid #374151;
    border-radius: 14px;
    padding: 16px;
}

.card h3 {
    margin-top: 0;
}

input,
select {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    border-radius: 10px;
    border: 1px solid #4b5563;
    background: #111827;
    color: white;
}

label {
    display: block;
    margin-bottom: 14px;
    color: #d1d5db;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 11px 16px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    margin: 4px;
}

button:hover {
    filter: brightness(1.15);
}

button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.secondary {
    background: #374151;
}

.danger {
    background: #991b1b;
}

.success {
    background: #047857;
}

.team {
    cursor: pointer;
    transition: 0.15s;
}

.team:hover {
    transform: translateY(-2px);
    border-color: #60a5fa;
}

.team.selected {
    border: 2px solid #60a5fa;
}

.locked {
    opacity: 0.55;
}

.stat {
    margin: 10px 0;
}

.stat-top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
}

.bar {
    height: 8px;
    background: #374151;
    border-radius: 10px;
    overflow: hidden;
}

.bar-inner {
    height: 100%;
    background: #3b82f6;
}

.big-number {
    font-size: 30px;
    font-weight: bold;
}

.event {
    border-left: 4px solid #60a5fa;
    padding: 10px 14px;
    background: #111827;
    margin-bottom: 10px;
    border-radius: 0 10px 10px 0;
}

.result {
    font-size: 20px;
    font-weight: bold;
    padding: 14px;
    background: #111827;
    border-radius: 12px;
    margin-bottom: 10px;
}

.ending {
    text-align: center;
    padding: 30px 15px;
}

.ending h2 {
    font-size: 30px;
}

.small {
    font-size: 13px;
    color: #9ca3af;
}

@media (max-width: 700px) {
    #app {
        padding: 10px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .header h1 {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<script>
/* =========================================================
   TeSL My Player
   跑跑職業人生 DEMO
   單檔版本
========================================================= */

const app = document.getElementById("app");

const state = {
    screen: "create",

    name: "",
    age: 18,
    year: 2008,

    team: null,
    locked: false,

    ability: {
        speed: 60,
        stability: 60,
        route: 60,
        reaction: 60,
        mentality: 60,
        teamwork: 60
    },

    potential: 80,

    fame: 10,
    money: 0,

    professional: false,
    retired: false,

    careerYears: 0,
    championships: 0,
    races: 0,
    wins: 0,

    teamRelationship: 50,

    leagueStrength: 100,

    history: [],
    events: []
};


/* =========================================================
   隊伍
========================================================= */

const teams = [
    {
        id: "A",
        name: "星火車隊",
        strength: 82,
        opportunity: 55,
        salary: 18000,
        description: "傳統強隊，冠軍競爭力高，但新人上場機會有限。"
    },
    {
        id: "B",
        name: "疾風車隊",
        strength: 72,
        opportunity: 85,
        salary: 13000,
        description: "新興隊伍，願意培養新人。"
    },
    {
        id: "C",
        name: "藍翼車隊",
        strength: 63,
        opportunity: 95,
        salary: 10000,
        description: "目前成績普通，但你很可能直接成為核心。"
    }
];


/* =========================================================
   工具
========================================================= */

function random(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function averageAbility() {
    const values = Object.values(state.ability);
    return Math.round(values.reduce((a, b) => a + b, 0) / values.length);
}

function ageFactor() {
    /*
        年齡不直接禁止職業。
        18~24：黃金成長期
        25~29：成熟
        30~34：開始有市場壓力
        35+：高齡
    */

    if (state.age <= 20) return 1.05;
    if (state.age <= 24) return 1.10;
    if (state.age <= 28) return 1.00;
    if (state.age <= 31) return 0.90;
    if (state.age <= 34) return 0.78;
    return 0.62;
}

function marketValue() {
    let value = averageAbility();

    value *= ageFactor();

    value += state.fame * 0.25;

    if (state.professional) {
        value += 5;
    }

    return Math.round(value);
}

function salaryExpectation() {
    const market = marketValue();

    if (market >= 90) return 30000;
    if (market >= 80) return 24000;
    if (market >= 70) return 18000;
    if (market >= 60) return 13000;
    return 8000;
}

function logEvent(text) {
    state.events.unshift(text);

    if (state.events.length > 8) {
        state.events.pop();
    }
}


/* =========================================================
   建立角色
========================================================= */

function renderCreate() {

    app.innerHTML = `
        <div class="header">
            <h1>TeSL My Player</h1>
            <div class="subtitle">
                跑跑卡丁車職業人生 DEMO
            </div>
        </div>

        <div class="panel">
            <h2>建立你的選手</h2>

            <label>
                選手名稱
                <input id="name" placeholder="例如：Yu-Hsiang">
            </label>

            <label>
                年齡
                <input id="age" type="number" min="14" max="40" value="18">
            </label>

            <p class="small">
                年齡不會直接決定你能不能打職業。
                它會影響成長、衰退與職業市場價值。
            </p>

            <button onclick="createPlayer()">
                開始生涯
            </button>
        </div>
    `;
}

function createPlayer() {

    const name = document.getElementById("name").value.trim();
    const age = Number(document.getElementById("age").value);

    if (!name) {
        alert("請輸入選手名稱");
        return;
    }

    if (age < 14 || age > 40) {
        alert("年齡請設定在 14～40 歲");
        return;
    }

    state.name = name;
    state.age = age;

    state.ability.speed = random(55, 70);
    state.ability.stability = random(55, 70);
    state.ability.route = random(55, 70);
    state.ability.reaction = random(55, 70);
    state.ability.mentality = random(50, 70);
    state.ability.teamwork = random(50, 70);

    state.potential = random(75, 95);

    state.screen = "teams";

    renderTeams();
}


/* =========================================================
   選隊
========================================================= */

function renderTeams() {

    app.innerHTML = `
        <div class="header">
            <h1>2008 年｜生涯起點</h1>
            <div class="subtitle">
                選擇你的第一支隊伍。確認後將 LOCK IN。
            </div>
        </div>

        <div class="panel">
            <h2>${state.name}｜${state.age} 歲</h2>

            <div class="grid">

                ${teams.map(team => `
                    <div class="card team"
                         onclick="selectTeam('${team.id}')"
                         id="team-${team.id}">

                        <h3>${team.name}</h3>

                        <p>${team.description}</p>

                        <p>
                            戰隊實力：
                            <strong>${team.strength}</strong>
                        </p>

                        <p>
                            新人機會：
                            <strong>${team.opportunity}</strong>
                        </p>

                        <p>
                            預估月薪：
                            <strong>$${team.salary.toLocaleString()}</strong>
                        </p>

                    </div>
                `).join("")}

            </div>

            <div id="selectedTeam"></div>
        </div>
    `;
}

function selectTeam(id) {

    if (state.locked) return;

    state.team = teams.find(t => t.id === id);

    document.querySelectorAll(".team")
        .forEach(el => el.classList.remove("selected"));

    document
        .getElementById("team-" + id)
        .classList.add("selected");

    document.getElementById("selectedTeam").innerHTML = `
        <div class="panel">
            <h3>你選擇了：${state.team.name}</h3>

            <p>
                選擇之後將會正式 LOCK IN。
                除非發生交易、解散或其他特殊事件，
                你不能主動跳隊。
            </p>

            <button onclick="lockInTeam()">
                🔒 LOCK IN
            </button>
        </div>
    `;
}

function lockInTeam() {

    if (!state.team) {
        alert("請先選擇隊伍");
        return;
    }

    state.locked = true;

    /*
        根據隊伍決定初始職業狀態
    */

    const market = marketValue();

    if (market >= 65 && state.team.opportunity >= 70) {
        state.professional = true;
    } else if (market >= 70 && state.team.strength >= 75) {
        state.professional = true;
    }

    logEvent(
        `${state.year}年：${state.name} 加入 ${state.team.name}。`
    );

    state.screen = "career";

    renderCareer();
}


/* =========================================================
   主畫面
========================================================= */

function renderCareer() {

    app.innerHTML = `
        <div class="header">
            <h1>TeSL｜${state.year} 年</h1>
            <div class="subtitle">
                ${state.name}｜${state.age} 歲｜${state.team.name}
            </div>
        </div>

        <div class="grid">

            <div class="panel">
                <h2>選手資料</h2>

                <div class="big-number">
                    ${averageAbility()}
                </div>

                <div class="small">
                    綜合能力
                </div>

                ${renderStat("速度", state.ability.speed)}
                ${renderStat("穩定", state.ability.stability)}
                ${renderStat("路線理解", state.ability.route)}
                ${renderStat("反應", state.ability.reaction)}
                ${renderStat("心態", state.ability.mentality)}
                ${renderStat("團隊配合", state.ability.teamwork)}

            </div>

            <div class="panel">

                <h2>生涯狀態</h2>

                <p>
                    年齡：
                    <strong>${state.age}</strong>
                </p>

                <p>
                    身分：
                    <strong>
                        ${state.professional ? "職業選手" : "業餘選手"}
                    </strong>
                </p>

                <p>
                    市場價值：
                    <strong>${marketValue()}</strong>
                </p>

                <p>
                    預期薪資：
                    <strong>
                        $${salaryExpectation().toLocaleString()}
                    </strong>
                </p>

                <p>
                    聲望：
                    <strong>${state.fame}</strong>
                </p>

                <p>
                    冠軍：
                    <strong>${state.championships}</strong>
                </p>

                <p>
                    職業年數：
                    <strong>${state.careerYears}</strong>
                </p>

            </div>

        </div>

        <div class="panel">

            <h2>本年度事件</h2>

            ${state.events.length
                ? state.events.map(e =>
                    `<div class="event">${e}</div>`
                  ).join("")
                : `<p class="small">目前還沒有事件。</p>`
            }

        </div>

        <div class="panel">

            <h2>下一年</h2>

            <button onclick="train()">
                🎯 專注訓練
            </button>

            <button onclick="rest()"
                    class="secondary">
                💤 休息／兼顧人生
            </button>

            <button onclick="nextYear()"
                    class="success">
                ▶ 推進一年
            </button>

            <button onclick="retire()"
                    class="danger">
                退役
            </button>

        </div>
    `;
}

function renderStat(name, value) {

    return `
        <div class="stat">

            <div class="stat-top">
                <span>${name}</span>
                <strong>${value}</strong>
            </div>

            <div class="bar">
                <div class="bar-inner"
                     style="width:${Math.min(value,100)}%">
                </div>
            </div>

        </div>
    `;
}


/* =========================================================
   訓練
========================================================= */

function train() {

    const gains = [];

    for (const key in state.ability) {

        if (Math.random() < 0.65) {

            const gain =
                Math.max(
                    1,
                    Math.floor(
                        (state.potential - state.ability[key]) / 15
                    )
                );

            state.ability[key] =
                Math.min(
                    100,
                    state.ability[key] + gain
                );

            gains.push(key);
        }
    }

    state.fame += random(1, 3);

    logEvent(
        `${state.year}年：你投入大量時間訓練，${gains.length} 項能力有所提升。`
    );

    renderCareer();
}


/* =========================================================
   休息
========================================================= */

function rest() {

    state.teamRelationship += random(1, 4);

    state.ability.mentality =
        Math.min(100, state.ability.mentality + 1);

    logEvent(
        `${state.year}年：你選擇休息並兼顧生活，心態有所提升。`
    );

    renderCareer();
}


/* =========================================================
   年齡成長／衰退
========================================================= */

function ageDevelopment() {

    state.age++;

    /*
        年輕：容易成長
        中期：穩定
        高齡：部分能力開始衰退
    */

    if (state.age <= 24) {

        for (const key in state.ability) {

            if (Math.random() < 0.55) {

                state.ability[key] =
                    Math.min(
                        100,
                        state.ability[key] + random(0, 2)
                    );
            }
        }

    } else if (state.age <= 29) {

        for (const key in state.ability) {

            if (Math.random() < 0.25) {

                state.ability[key] =
                    Math.min(
                        100,
                        state.ability[key] + 1
                    );
            }
        }

    } else {

        /*
            高齡不會所有能力一起崩。
            反應／速度比較容易下降。
        */

        if (Math.random() < 0.55) {
            state.ability.reaction =
                Math.max(
                    40,
                    state.ability.reaction - random(0, 2)
                );
        }

        if (Math.random() < 0.45) {
            state.ability.speed =
                Math.max(
                    40,
                    state.ability.speed - random(0, 2)
                );
        }

        if (Math.random() < 0.25) {
            state.ability.route =
                Math.min(
                    100,
                    state.ability.route + 1
                );
        }

        if (Math.random() < 0.25) {
            state.ability.mentality =
                Math.min(
                    100,
                    state.ability.mentality + 1
                );
        }

    }
}


/* =========================================================
   比賽
========================================================= */

function simulateSeason() {

    if (!state.professional) {

        /*
            業餘比賽
        */

        const power =
            averageAbility() +
            random(-15, 15);

        if (power >= 80) {

            state.wins += random(2, 5);
            state.fame += random(2, 5);

            if (Math.random() < 0.25) {
                state.championships++;

                logEvent(
                    `${state.year}年：你在業餘賽事拿下冠軍！`
                );

            } else {

                logEvent(
                    `${state.year}年：你在業餘賽事表現亮眼。`
                );
            }

        } else {

            logEvent(
                `${state.year}年：你參加多場業餘賽事，但成績普通。`
            );
        }

        return;
    }


    /*
        職業比賽
    */

    const teamPower =
        state.team.strength +
        averageAbility() * 0.35 +
        random(-15, 15);

    state.races += 12;

    if (teamPower >= 95) {

        state.wins += random(5, 8);
        state.championships++;

        state.fame += random(5, 10);

        logEvent(
            `${state.year}年：${state.team.name} 奪得年度冠軍！`
        );

    } else if (teamPower >= 80) {

        state.wins += random(3, 5);
        state.fame += random(2, 5);

        logEvent(
            `${state.year}年：你與 ${state.team.name} 打入年度後段賽事。`
        );

    } else {

        state.fame += random(0, 2);

        logEvent(
            `${state.year}年：本季戰績不佳，隊伍需要重新調整。`
        );
    }

}


/* =========================================================
   特殊歷史事件
========================================================= */

function historicalEvents() {

    /*
        這裡目前故意使用虛構事件。
        之後再把真正 TeSL 歷史資料填進來。
    */

    if (state.year === 2010) {

        state.leagueStrength += 5;

        logEvent(
            "聯盟進入擴張期，電競產業受到更多關注。"
        );
    }

    if (state.year === 2012) {

        state.leagueStrength += 3;

        logEvent(
            "聯盟進入黃金時期，職業選手的曝光度提高。"
        );
    }

    if (state.year === 2013) {

        state.leagueStrength -= 8;

        logEvent(
            "聯盟開始出現結構性的變化。部分隊伍開始重新評估未來。"
        );
    }

    if (state.year === 2014) {

        state.leagueStrength -= 15;

        logEvent(
            "職業環境開始惡化，部分選手開始思考其他人生選擇。"
        );
    }

    if (state.year === 2015) {

        state.leagueStrength -= 20;

        logEvent(
            "職業聯賽規模縮小，留下來的選手開始尋找新的舞台。"
        );
    }

    if (state.year >= 2016) {

        state.leagueStrength -= random(3, 8);

        if (state.leagueStrength < 20) {

            state.leagueStrength = 20;

            logEvent(
                "台灣職業舞台已經與當年完全不同。"
            );
        }
    }
}


/* =========================================================
   交易
========================================================= */

function possibleTransfer() {

    if (!state.professional) return;

    /*
        目前只有在特定條件下發生。
        之後可以改成真正的歷史隊伍資料。
    */

    if (Math.random() < 0.10) {

        const candidates =
            teams.filter(t => t.id !== state.team.id);

        const newTeam =
            candidates[random(0, candidates.length - 1)];

        state.team = newTeam;

        logEvent(
            `重大轉會：你被交易至 ${newTeam.name}。`
        );
    }
}


/* =========================================================
   聯盟衰退後的職業機會
========================================================= */

function leagueCheck() {

    /*
        聯盟越弱，職業機會越低。
        但不是直接禁止。
    */

    if (!state.professional) return;

    const market = marketValue();

    if (
        state.leagueStrength < 40 &&
        market < 70
    ) {

        state.professional = false;

        logEvent(
            "職業舞台逐漸消失，你暫時回到業餘賽事。"
        );
    }
}


/* =========================================================
   年度結算
========================================================= */

function nextYear() {

    if (state.retired) return;

    state.year++;

    ageDevelopment();

    simulateSeason();

    historicalEvents();

    possibleTransfer();

    leagueCheck();

    if (state.professional) {
        state.careerYears++;
        state.money += salaryExpectation() * 12;
    }

    /*
        聯盟非常衰退時
        檢查特殊事件
    */

    if (
        state.year >= 2016 &&
        averageAbility() >= 90 &&
        state.age <= 35 &&
        !state.professional
    ) {

        if (Math.random() < 0.18) {

            logEvent(
                "多年後，一場意外的國際邀請賽讓你重新受到關注。"
            );
        }
    }

    /*
        年齡非常高時，不直接強制退役。
        市場自然會變差。
    */

    if (state.age >= 38) {

        if (marketValue() < 55) {

            logEvent(
                "你仍然熱愛比賽，但職業市場已經很少給高齡選手機會。"
            );
        }
    }

    renderCareer();
}


/* =========================================================
   退役
========================================================= */

function retire() {

    state.retired = true;

    renderEnding();
}


/* =========================================================
   結局判定
========================================================= */

function renderEnding() {

    let title = "";
    let description = "";

    const avg = averageAbility();

    if (
        avg >= 90 &&
        state.leagueStrength <= 30 &&
        state.championships === 0
    ) {

        title = "生不逢時";

        description =
            "你的能力已經登上頂尖水準，" +
            "但當你真正成熟時，屬於你的職業舞台卻已經逐漸消失。";

    } else if (
        !state.professional &&
        state.championships >= 3 &&
        avg >= 80
    ) {

        title = "業餘之神";

        description =
            "你沒有成為傳統意義上的職業明星，" +
            "但在那個年代的業餘圈，你就是最難被忘記的名字。";

    } else if (
        state.championships >= 4
    ) {

        title = "職業王者";

        description =
            "你把自己的巔峰時期完整轉化成了冠軍。";

    } else if (
        state.age >= 32 &&
        avg >= 80
    ) {

        title = "老將不死";

        description =
            "你的速度或許不再是年輕時的自己，" +
            "但經驗、理解與心態讓你仍然能站在賽場上。";

    } else if (
        state.fame >= 60
    ) {

        title = "時代留下的名字";

        description =
            "你未必拿到了最多的冠軍，" +
            "但這個時代的人記得你。";

    } else {

        title = "另一種人生";

        description =
            "你的生涯沒有成為傳奇，" +
            "但你確實活過那個屬於電競的年代。";
    }


    app.innerHTML = `
        <div class="header">
            <h1>生涯終章</h1>
        </div>

        <div class="panel ending">

            <h2>${title}</h2>

            <p>
                ${description}
            </p>

            <hr>

            <p>
                <strong>${state.name}</strong>
            </p>

            <p>
                生涯：${state.year - 2008 + 1} 年
            </p>

            <p>
                最終年齡：${state.age}
            </p>

            <p>
                最終能力：${averageAbility()}
            </p>

            <p>
                冠軍：${state.championships}
            </p>

            <p>
                職業年數：${state.careerYears}
            </p>

            <p>
                生涯收入：
                $${state.money.toLocaleString()}
            </p>

            <button onclick="location.reload()">
                再開一局
            </button>

        </div>
    `;
}


/* =========================================================
   啟動
========================================================= */

renderCreate();

</script>

</body>
</html>
