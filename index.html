<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電競人生模擬器</title>

<style>
    body {
        margin: 0;
        font-family: Arial, "Microsoft JhengHei", sans-serif;
        background: #f2f2f2;
        color: #222;
    }

    .game {
        width: 900px;
        max-width: 94%;
        margin: 30px auto;
        background: white;
        border-radius: 14px;
        padding: 25px;
        box-sizing: border-box;
        box-shadow: 0 4px 18px rgba(0,0,0,0.12);
    }

    h1 {
        text-align: center;
        margin-top: 0;
    }

    /* 玩家基本資料 */
    .info {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 20px;
    }

    .stat {
        background: #f5f5f5;
        padding: 14px;
        border-radius: 8px;
        text-align: center;
    }

    .stat strong {
        display: block;
        font-size: 24px;
        margin-top: 5px;
    }

    /* 英雄池 */
    .hero-pool {
        background: #f7f7f7;
        border-radius: 10px;
        padding: 18px;
        margin-bottom: 20px;
    }

    .hero-pool h2 {
        margin-top: 0;
    }

    .pool-style {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 15px;
    }

    .hero-stat {
        margin: 12px 0;
    }

    .hero-name {
        display: flex;
        justify-content: space-between;
        margin-bottom: 5px;
    }

    .bar {
        width: 100%;
        height: 14px;
        background: #ddd;
        border-radius: 10px;
        overflow: hidden;
    }

    .bar-inner {
        height: 100%;
        background: #333;
        transition: width 0.3s;
    }

    /* 事件 */
    .event {
        border-top: 1px solid #ddd;
        padding-top: 20px;
    }

    .event h2 {
        margin-top: 0;
    }

    .choices {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 20px;
    }

    button {
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #222;
        color: white;
        font-size: 16px;
        cursor: pointer;
        text-align: left;
    }

    button:hover {
        opacity: 0.82;
    }

    button small {
        display: block;
        margin-top: 5px;
        color: #ccc;
        font-size: 13px;
    }

    #result {
        margin-top: 20px;
        min-height: 30px;
        font-weight: bold;
    }

    @media (max-width: 600px) {
        .info {
            grid-template-columns: repeat(2, 1fr);
        }

        .game {
            padding: 18px;
        }
    }
</style>
</head>

<body>

<div class="game">

    <h1>🎮 電競人生模擬器</h1>

    <!-- 玩家基本狀況 -->
    <div class="info">

        <div class="stat">
            年齡
            <strong id="age">16</strong>
        </div>

        <div class="stat">
            操作
            <strong id="skill">50</strong>
        </div>

        <div class="stat">
            遊戲理解
            <strong id="gameSense">50</strong>
        </div>

        <div class="stat">
            心態
            <strong id="mental">50</strong>
        </div>

        <div class="stat">
            體力
            <strong id="stamina">50</strong>
        </div>

        <div class="stat">
            人氣
            <strong id="fame">0</strong>
        </div>

    </div>


    <!-- 英雄池 -->
    <div class="hero-pool">

        <h2>🎮 英雄池</h2>

        <div class="pool-style" id="poolStyle">
            ⚖️ 標準型
        </div>


        <div class="hero-stat">

            <div class="hero-name">
                <span>🗡️ 刺客型</span>
                <span id="assassin">50</span>
            </div>

            <div class="bar">
                <div
                    class="bar-inner"
                    id="assassinBar"
                    style="width:50%">
                </div>
            </div>

        </div>


        <div class="hero-stat">

            <div class="hero-name">
                <span>🔮 大法師型</span>
                <span id="mage">50</span>
            </div>

            <div class="bar">
                <div
                    class="bar-inner"
                    id="mageBar"
                    style="width:50%">
                </div>
            </div>

        </div>


        <div class="hero-stat">

            <div class="hero-name">
                <span>🎯 Poke型</span>
                <span id="poke">50</span>
            </div>

            <div class="bar">
                <div
                    class="bar-inner"
                    id="pokeBar"
                    style="width:50%">
                </div>
            </div>

        </div>


        <div class="hero-stat">

            <div class="hero-name">
                <span>🧭 支援型</span>
                <span id="support">50</span>
            </div>

            <div class="bar">
                <div
                    class="bar-inner"
                    id="supportBar"
                    style="width:50%">
                </div>
            </div>

        </div>

    </div>


    <!-- 事件 -->
    <div class="event">

        <h2 id="eventTitle">
            你的英雄池開始形成
        </h2>

        <p id="eventText">
            你開始發現自己有特別擅長的英雄類型。
            現在，你可以決定自己的英雄池往哪個方向發展。
        </p>


        <div class="choices">

            <button onclick="choose(1)">
                🗡️ 專精刺客型
                <small>刺客型 +10</small>
            </button>


            <button onclick="choose(2)">
                🔮 專精大法師型
                <small>大法師型 +10</small>
            </button>


            <button onclick="choose(3)">
                🎯 專精 Poke 型
                <small>Poke 型 +10</small>
            </button>


            <button onclick="choose(4)">
                🧭 專精支援型
                <small>支援型 +10</small>
            </button>

        </div>


        <div id="result"></div>

    </div>

</div>


<script>

let player = {

    age: 16,

    skill: 50,
    gameSense: 50,
    mental: 50,
    stamina: 50,
    fame: 0,

    assassin: 50,
    mage: 50,
    poke: 50,
    support: 50

};


/* 限制數值 0～100 */
function clamp(value) {

    return Math.max(0, Math.min(100, value));

}


/* 判定目前英雄池風格 */
function getPoolStyle() {

    let values = [
        player.assassin,
        player.mage,
        player.poke,
        player.support
    ];

    let max = Math.max(...values);
    let min = Math.min(...values);


    /* 全能型 */
    if (
        player.assassin >= 85 &&
        player.mage >= 85 &&
        player.poke >= 85 &&
        player.support >= 85
    ) {
        return "👑 全能型";
    }


    /* 專精型 */
    if (max >= 80 && max - min >= 20) {

        if (max === player.assassin) {
            return "🗡️ 刺客專精型";
        }

        if (max === player.mage) {
            return "🔮 大法師專精型";
        }

        if (max === player.poke) {
            return "🎯 Poke 專精型";
        }

        if (max === player.support) {
            return "🧭 支援專精型";
        }
    }


    /* 預設 */
    return "⚖️ 標準型";
}


/* 更新畫面 */
function updateScreen() {

    document.getElementById("age").textContent =
        player.age;

    document.getElementById("skill").textContent =
        player.skill;

    document.getElementById("gameSense").textContent =
        player.gameSense;

    document.getElementById("mental").textContent =
        player.mental;

    document.getElementById("stamina").textContent =
        player.stamina;

    document.getElementById("fame").textContent =
        player.fame;


    document.getElementById("assassin").textContent =
        player.assassin;

    document.getElementById("assassinBar").style.width =
        player.assassin + "%";


    document.getElementById("mage").textContent =
        player.mage;

    document.getElementById("mageBar").style.width =
        player.mage + "%";


    document.getElementById("poke").textContent =
        player.poke;

    document.getElementById("pokeBar").style.width =
        player.poke + "%";


    document.getElementById("support").textContent =
        player.support;

    document.getElementById("supportBar").style.width =
        player.support + "%";


    document.getElementById("poolStyle").textContent =
        getPoolStyle();

}


/* 選擇事件 */
function choose(choice) {

    let result = "";


    if (choice === 1) {

        player.assassin += 10;

        result =
            "你開始專注研究刺客型英雄。";

    }


    if (choice === 2) {

        player.mage += 10;

        result =
            "你開始專注研究大法師型英雄。";

    }


    if (choice === 3) {

        player.poke += 10;

        result =
            "你開始專注研究 Poke 型英雄。";

    }


    if (choice === 4) {

        player.support += 10;

        result =
            "你開始專注研究支援型英雄。";

    }


    player.age++;


    player.assassin = clamp(player.assassin);
    player.mage = clamp(player.mage);
    player.poke = clamp(player.poke);
    player.support = clamp(player.support);


    updateScreen();

    document.getElementById("result").textContent =
        result;

}


updateScreen();

</script>

</body>
</html>
